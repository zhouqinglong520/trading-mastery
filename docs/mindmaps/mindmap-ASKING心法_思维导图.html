const COLORS = ["#4FC3F7", "#81C784", "#FFB74D", "#E57373", "#BA68C8", "#4DB6AC", "#FF8A65", "#AED581", "#7986CB", "#F06292", "#FFD54F", "#A1887F", "#90A4AE", "#CE93D8", "#80CBC4", "#FFAB91"];

let currentTransform = { x: 0, y: 0, k: 1 };

const svg = document.getElementById('canvas');

// 构建树结构
function buildTree(data, depth = 0, colorIdx = 0) {
  const node = {
    id: nodeId++,
    data: data,
    depth: depth,
    color: COLORS[colorIdx % COLORS.length],
    children: [],
    _children: null, // collapsed children
    x: 0,
    y: 0
  };
  
  if (data.children && data.children.length > 0) {
    node.children = data.children.map((c, i) => 
      buildTree(c, depth + 1, depth === 0 ? i : colorIdx)
    );
  }
  
  return node;
}

// 布局计算 - 水平树布局
function layout(node, x0 = 0) {
  const nodeHeight = 32;
  const verticalGap = 8;
  const levelWidth = 220;
  
  // 计算子树高度
  const visibleChildren = node.children || [];
  if (visibleChildren.length === 0) {
    node._subtreeHeight = nodeHeight;
    node.x = x0;
    return;
  }
  
  // 递归布局子节点
  let childX = x0 + levelWidth;
  let totalChildHeight = 0;
  
  visibleChildren.forEach((child, i) => {
    layout(child, childX);
    totalChildHeight += child._subtreeHeight;
    if (i > 0) totalChildHeight += verticalGap;
  });
  
  node._subtreeHeight = Math.max(nodeHeight, totalChildHeight);
  
  // 垂直居中
  let startY = -totalChildHeight / 2;
  visibleChildren.forEach((child, i) => {
    child.y += startY + child._subtreeHeight / 2;
    startY += child._subtreeHeight + verticalGap;
  });
  
  node.x = x0;
}

// 计算文本宽度（近似）
function textWidth(text) {
  let w = 0;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code > 127) w += 14;
    else w += 7.5;
  }
  return w;
}

// 渲染
function render() {
  while (mainGroup.firstChild) mainGroup.removeChild(mainGroup.firstChild);
  
  function renderNode(node, parentNode) {
    const tw = textWidth(node.data.name);
    const padding = node.depth === 0 ? 24 : 14;
    const nodeW = tw + padding * 2;
    const nodeH = node.depth === 0 ? 40 : 30;
    
    // 连接线
    if (parentNode) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const px = parentNode._renderX + (textWidth(parentNode.data.name) + 28) / 2 + 14;
      const py = parentNode._renderY;
      const cx = node._renderX - nodeW / 2;
      const cy = node._renderY;
      const mx = (px + cx) / 2;
      
      path.setAttribute('d', `M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      path.setAttribute('class', 'link');
      path.setAttribute('stroke', node.color);
      mainGroup.appendChild(path);
    }
    
    // 节点组
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-group');
    g.setAttribute('transform', `translate(${node._renderX - nodeW/2}, ${node._renderY - nodeH/2})`);
    
    // 节点矩形
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', nodeW);
    rect.setAttribute('height', nodeH);
    rect.setAttribute('class', 'node-rect');
    
    if (node.depth === 0) {
      rect.setAttribute('fill', '#667eea');
      rect.setAttribute('stroke', '#5568d3');
      rect.setAttribute('stroke-width', '0');
      rect.setAttribute('rx', '20');
      rect.setAttribute('ry', '20');
    } else {
      rect.setAttribute('fill', 'white');
      rect.setAttribute('stroke', node.color);
      rect.setAttribute('stroke-width', '2');
      rect.setAttribute('rx', '8');
      rect.setAttribute('ry', '8');
    }
    g.appendChild(rect);
    
    // 左侧色条
    if (node.depth > 0) {
      const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bar.setAttribute('x', '0');
      bar.setAttribute('y', '0');
      bar.setAttribute('width', '4');
      bar.setAttribute('height', nodeH);
      bar.setAttribute('fill', node.color);
      bar.setAttribute('rx', '2');
      g.appendChild(bar);
    }
    
    // 文本
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', node.depth === 0 ? nodeW/2 : padding + 4);
    text.setAttribute('y', nodeH / 2);
    text.setAttribute('class', node.depth === 0 ? 'node-text root' : 'node-text');
    if (node.depth === 0) text.setAttribute('text-anchor', 'middle');
    text.textContent = node.data.name;
    g.appendChild(text);
    
    // 折叠/展开按钮
    const hasChildren = node.children && node.children.length > 0;
    const hasCollapsed = node._children && node._children.length > 0;
    
    if (hasChildren || hasCollapsed) {
      const btnG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      btnG.setAttribute('class', 'expand-btn');
      btnG.setAttribute('transform', `translate(${nodeW + 8}, ${nodeH/2})`);
      
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '9');
      btnG.appendChild(circle);
      
      const btnText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      btnText.textContent = hasChildren ? '−' : '+';
      btnG.appendChild(btnText);
      
      const countText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const count = hasCollapsed ? node._children.length : node.children.length;
      countText.setAttribute('x', '14');
      countText.setAttribute('font-size', '10');
      countText.setAttribute('fill', '#aaa');
      countText.textContent = count;
      btnG.appendChild(countText);
      
      btnG.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNode(node);
      });
      g.appendChild(btnG);
    }
    
    // 点击节点也切换
    g.addEventListener('click', () => {
      if (node.children || node._children) toggleNode(node);
    });
    
    mainGroup.appendChild(g);
    node._renderX = node._renderX;
    node._renderY = node._renderY;
    
    // 递归渲染子节点
    if (node.children) {
      node.children.forEach(child => renderNode(child, node));
    }
  }
  
  // 执行布局
  root._renderX = 0;
  root._renderY = 0;
  
  // 计算布局（递归）
  function calcLayout(node, x0) {
    const nodeH = node.depth === 0 ? 40 : 30;
    const vGap = 6;
    const levelW = Math.max(180, 220 - node.depth * 10);
    
    const vis = node.children || [];
    if (vis.length === 0) {
      node._subtreeH = nodeH;
      node._renderX = x0;
      return;
    }
    
    let childX = x0 + levelW;
    let totalH = 0;
    vis.forEach((c, i) => {
      calcLayout(c, childX);
      totalH += c._subtreeH;
      if (i > 0) totalH += vGap;
    });
    
    node._subtreeH = Math.max(nodeH, totalH);
    
    let sy = -totalH / 2;
    vis.forEach((c, i) => {
      c._renderY = sy + c._subtreeH / 2;
      sy += c._subtreeH + vGap;
    });
    
    node._renderX = x0;
  }
  
  calcLayout(root, 0);
  renderNode(root, null);
  
  // 初始居中
  fitView();
}

function toggleNode(node) {
  if (node.children && node.children.length > 0) {
    node._children = node.children;
    node.children = null;
  } else if (node._children) {
    node.children = node._children;
    node._children = null;
  }
  render();
}

// 缩放平移
let isDragging = false, startX, startY, startTX, startTY;

svg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  startTX = currentTransform.x;
  startTY = currentTransform.y;
});

svg.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  currentTransform.x = startTX + (e.clientX - startX);
  currentTransform.y = startTY + (e.clientY - startY);
  applyTransform();
});

svg.addEventListener('mouseup', () => isDragging = false);
svg.addEventListener('mouseleave', () => isDragging = false);

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  currentTransform.k = Math.max(0.2, Math.min(3, currentTransform.k * delta));
  applyTransform();
  document.getElementById('zoomInfo').textContent = Math.round(currentTransform.k * 100) + '%';
});

function applyTransform() {
  mainGroup.setAttribute('transform', 
    `translate(${currentTransform.x}, ${currentTransform.y}) scale(${currentTransform.k})`);
}

function zoomIn() {
  currentTransform.k = Math.min(3, currentTransform.k * 1.2);
  applyTransform();
  document.getElementById('zoomInfo').textContent = Math.round(currentTransform.k * 100) + '%';
}

function zoomOut() {
  currentTransform.k = Math.max(0.2, currentTransform.k / 1.2);
  applyTransform();
  document.getElementById('zoomInfo').textContent = Math.round(currentTransform.k * 100) + '%';
}

function fitView() {
  // 简单适应：将视图居中
  currentTransform.x = svgWidth * 0.3;
  currentTransform.y = svgHeight * 0.5;
  currentTransform.k = Math.min(1, svgHeight / (root._subtreeH + 100));
  currentTransform.k = Math.max(0.3, Math.min(1.5, currentTransform.k));
  applyTransform();
  document.getElementById('zoomInfo').textContent = Math.round(currentTransform.k * 100) + '%';
}

function expandAll() {
  function expand(n) {
    if (n._children) { n.children = n._children; n._children = null; }
    if (n.children) n.children.forEach(expand);
  }
  expand(root);
  render();
}

function collapseAll() {
  function collapse(n, depth) {
    if (depth > 1 && n.children && n.children.length > 0) {
      n._children = n.children;
      n.children = null;
    }
    const ch = n.children || n._children || [];
    ch.forEach(c => collapse(c, depth + 1));
  }
  collapse(root, 0);
  render();
}

// 初始渲染
render();

// 窗口resize
window.addEventListener('resize', () => {
  const r = svg.getBoundingClientRect();
  svgWidth = r.width;
  svgHeight = r.height;
  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);
  fitView();
});
</script>
</body>
