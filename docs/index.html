%确定的交易 \\- ✅ 追求高胜率+高赔率的交易机会 \\- ✅ 接受亏损是交易的一部分 \\- **操作细节** ： \\- 每笔交易前评估胜率和赔率 \\- 胜率<50%或赔率<2:1的交易不做 \\- 记录每笔交易的胜率/赔率评估与实际结果\n\n**✅ 规则3：情绪周期是盈利的核心** \\- **判断标准** ： \\- ✅ 赚钱效应好时，大胆做多 \\- ✅ 亏钱效应明显时，空仓观望 \\- ✅ 情绪周期比技术指标更重要 \\- **操作细节** ： \\- 每天开盘前判断当前情绪周期位置 \\- 根据情绪周期位置调整仓位和策略 \\- 记录情绪周期判断与实际走势的对应关系\n\n### 1.2 顶级交易者必备的特质（来自`0828 顶级交易者必备的特质-.pdf`）\n\n**✅ 特质1：极强的自律性** \\- 严格执行交易计划，不随意更改 \\- 严格执行止损，不抱幻想 \\- 严格执行仓位管理，不重仓赌博\n\n**✅ 特质2：极强的耐心** \\- 等待高胜率机会，不频繁交易 \\- 持仓时耐心持有，不急于止盈 \\- 空仓时耐心等待，不急于进场\n\n**✅ 特质3：极强的执行力** \\- 按照交易计划执行，不犹豫 \\- 按照止损计划执行，不拖延 \\- 按照仓位管理执行，不冲动\n\n**✅ 特质4：极强的学习能力** \\- 从亏损中学习，不重复犯错 \\- 从成功中学习，总结盈利模式 \\- 持续学习新知识，不固步自封\n\n**✅ 特质5：极强的心态管理能** \\- 亏损时保持冷静，不情绪化交易 \\- 盈利时保持谦逊，不骄傲自满 \\- 空仓时保持耐心，不急于求成\n\n* * *\n\n## 2\\. 情绪周期判断体系\n\n### 2.1 情绪周期阶段划分（来自`1010 2 标准化. 情绪和龙头基因.xlsx`和`0927 错题集.txt`）\n\n**✅ 阶段1：冰点（亏钱效应极致）** \\- **判断标准** ： \\- ✅ 连扳高度压缩到2板或以下 \\- ✅ 空间板断板或无空间板 \\- ✅ 昨日涨停今日跌停现象出现 \\- ✅ 炸板率>40% \\- ✅ 红盘家数<1000家 \\- **操作策略** ： \\- 空仓观望，等待冰点极致 \\- 冰点极致后，小仓试错新题材首板 \\- 不参与高位股，只做首板或1进2\n\n**✅ 阶段2：修复（亏钱效应减弱）** \\- **判断标准** ： \\- ✅ 连扳高度开始回升（3板或以上） \\- ✅ 炸板率下降到20-30% \\- ✅ 红盘家数回升到1500家以上 \\- ✅ 出现反包板或地天板 \\- **操作策略** ： \\- 小仓试错龙头首板或1进2 \\- 关注新题材的启动 \\- 不做高位接力，只做低位启动\n\n**✅ 阶段3：发酵（赚钱效应转好）** \\- **判断标准** ： \\- ✅ 连扳高度突破到4板或以上 \\- ✅ 出现空间板（打破近期高度压制） \\- ✅ 炸板率<20% \\- ✅ 红盘家数>2000家 \\- ✅ 龙头股开始形成 \\- **操作策略** ： \\- 大胆做多，重仓龙头股 \\- 参与龙头股的接力（2进3、3进4） \\- 做龙头股的补涨首板\n\n**✅ 阶段4：高潮（赚钱效应极致）** \\- **判断标准** ： \\- ✅ 连扳高度达到阶段性高点（5板以上） \\- ✅ 龙头股缩量加速（一字板或T字板） \\- ✅ 跟风股也缩量加速 \\- ✅ 红盘家数>3000家 \\- ✅ 全市场情绪高涨 \\- **操作策略** ： \\- 持仓不动，让利润奔跑 \\- 不追高加速板，风险大于收益 \\- 准备随时止盈离场\n\n**✅ 阶段5：衰退（赚钱效应减弱）** \\- **判断标准** ： \\- ✅ 龙头股断板或放巨量 \\- ✅ 连扳高度开始压缩 \\- ✅ 炸板率回升到30%以上 \\- ✅ 出现\"昨日涨停今日跌停\"现象 \\- **操作策略** ： \\- 立即止盈离场 \\- 不接高位接力 \\- 空仓观望或轻仓试错新题材\n\n### 2.2 情绪周期判断工具（来自`从小散到游资的10堂课.xlsx`和`每日记录.xlsx`）\n\n**✅ 工具1：大盘情绪监控表** 每天收盘后填写以下数据：\n\n日期 | 红盘 | 绿盘 | 涨停 | 跌停 | 炸板率 | 首板 | 二板 | 三板 | 三板以上 | 连板数量 | 1进2 | 2进3 | 3进多 | 情绪周期  \n---|---|---|---|---|---|---|---|---|---|---|---|---|---|---  \n|  |  |  |  |  |  |  |  |  |  |  |  |  |   \n  \n**判断标准** ： \\- 情绪周期=\"强\"：涨停>80家，跌停<10家，炸板率<20% \\- 情绪周期=\"弱\"：涨停<50家，跌停>20家，炸板率>30%\n\n**✅ 工具2：中级周期监控表（来自`0730 中级情绪周期表.xlsx`）** \\- 中级周期启动期 → 大胆做多 \\- 中级周期发酵期 → 重仓龙头 \\- 中级周期高潮期 → 持仓不动 \\- 中级周期衰退期 → 止盈离场 \\- 中级周期冰点期 → 空仓观望\n\n**✅ 工具3：短期周期监控表** \\- 短期周期启动 → 试错首板 \\- 短期周期发酵 → 接力龙头 \\- 短期周期高潮 → 持仓不动 \\- 短期周期衰退 → 止盈离场\n\n### 2.3 情绪周期判断的细节规则（来自`0927 错题集.txt`）\n\n**✅ 规则1：判断冰点的大小** \\- 如果冰点前两天才高潮，那么这个冰点只是小冰点 \\- 小冰点之后的行情只是反抽，并不是反转 \\- 冰点极致才会出拐点，拐点才会出龙头\n\n**✅ 规则2：判断次日情绪** \\- 连续跌两天对隔日有情绪弱变强的预期 \\- 但是第三天是未知的，可能拉，可能震荡 \\- 如果不涨，那么昨天的超盘资金就会变为砸盘资金\n\n**✅ 规则3：指数与情绪的关系** \\- 指数周期是用来做情绪参考，用来避免炸板潮的 \\- 在指数高潮那天，要避免去追高加速的一字板 \\- 因为次日指数是可能高潮走向衰退的\n\n**✅ 规则4：市场迷茫时的机会** \\- 市场迷茫的时候，指数下跌的时候才有机会 \\- 指数上涨的时候是没有机会的\n\n* * *\n\n## 3\\. 龙头股识别与操作体系\n\n### 3.1 龙头股的定义与特征（来自`1010 2 标准化. 情绪和龙头基因.xlsx`和`0927 错题集.txt`）\n\n**✅ 定义：龙头股不在于板好板烂，或者时间早晚，而在于本身所具有的特性，有市场炒作的空间**\n\n**✅ 特征1：启动于指数下跌末期** \\- 龙头股在指数下跌末期启动 \\- 强化于指数上涨中期 \\- 反包于指数见顶期 \\- 和指数共振下跌衰退\n\n**✅ 特征2：具有市场炒作的空间** \\- 题材有想象力，市场认可度高 \\- 盘子适中，换手充分 \\- 有板块效应，能带动板块上涨\n\n**✅ 特征3：突破空间压制** \\- 打破近期连扳高度压制 \\- 成为新的空间板 \\- 带动市场情绪转好\n\n### 3.2 龙头股的识别标准（来自`202502\\2025年2月28日龙头股买点策略（龙行刺周期）.md`）\n\n**✅ 标准1：看题材级别** \\- 国家级题材 > 行业级题材 > 公司级题材 \\- 新题材 > 老题材 \\- 大题材 > 小题材\n\n**✅ 标准2：看板块效应** \\- 龙头股必须有板块支撑 \\- 板块内至少有3-5只涨停股 \\- 板块效应越强，龙头股越安全\n\n**✅ 标准3：看换手与量能** \\- 龙头股必须换手充分，不能一字板顶到头 \\- 换手率>10%，量能持续放大 \\- 缩量加速只能在高位，不能在低位\n\n**✅ 标准4：看市场地位** \\- 空间板 > 板块龙 > 跟风股 \\- 先启动 > 后启动 \\- 换手龙 > 一字龙\n\n### 3.3 龙头股的操作策略（来自`0927 错题集.txt`）\n\n**✅ 策略1：龙头启动于几板不重要，重要的是当时的情绪环境龙头有没有起到重要** \\- 龙头股在情绪发酵期启动，可以大胆接力 \\- 龙头股在情绪高潮期启动，只能持仓不能追高 \\- 龙头股在情绪衰退期启动，不能参与\n\n**✅ 策略2：龙头三板的时候打补涨首板是百分百有套利空间的** \\- 龙头股走到三板时，市场认可度高 \\- 补涨首板的安全性强，套利空间确定 \\- 操作细节：龙头三板当天，打板块内最先涨停的补涨首板\n\n**✅ 策略3：前排再次超预期的时候应该直接上前排，不应该去后排做补涨** \\- 龙头股没有断板的情况下，不做补涨 \\- 要做补涨，只能做首板补涨，不能做高位补涨 \\- 前排股再次超预期（如弱转强、缩量加速），直接上前排\n\n**✅ 策略4：永不止损，永不止盈（操作是操作，盈亏交给市场）** \\- 按照交易计划操作，不随意更改止损止盈 \\- 止损止盈是操作规则，不是情绪反应 \\- 盈亏交给市场，不要人为干预\n\n* * *\n\n## 4\\. 选股体系\n\n### 4.1 选股原则（来自26位游资智慧）\n\n**✅ 原则1：只做龙头股，不做跟风股** \\- 龙头股有板块效应，安全边际高 \\- 跟风股没有板块效应，风险大于收益 \\- 操作细节：每天复盘时，只关注空间板和板块龙头\n\n**✅ 原则2：只做主流题材，不做冷门题材** \\- 主流题材有持续性，冷门题材一日游 \\- 操作细节：每天看涨停板数量，涨停板最多的题材就是主流题材\n\n**✅ 原则3：只做换手充分的股，不做一字板顶到头的股** \\- 换手充分的股，市场认可度高 \\- 一字板顶到头的股，获利盘多，砸盘风险大 \\- 操作细节：选择换手率>10%的股，回避一字板顶到头的股\n\n### 4.2 选股流程（来自`0727 常用手法总结.xlsx`）\n\n**✅ 流程1：盘后复盘选股** 1\\. 看涨停板数量，找出主流题材 2\\. 看主流题材内的龙头股和补涨股 3\\. 看龙头股的次日预期（弱转强、缩量加速、断板） 4\\. 选出次日可能操作的股票，加入自选股\n\n**✅ 流程2：盘中动态选股** 1\\. 看竞价阶段（9:15-9:25）的涨跌停情况 2\\. 看开盘后（9:30-10:00）的板块效应 3\\. 看龙头股的开盘表现（弱转强、缩量加速） 4\\. 动态决定是否操作\n\n**✅ 流程3：选股检查清单** \\- ✅ 是不是主流题材？ \\- ✅ 是不是龙头股或补涨股？ \\- ✅ 是不是换手充分？ \\- ✅ 是不是在情绪周期的正确位置？ \\- ✅ 是不是有板块效应？\n\n* * *\n\n## 5\\. 买点体系\n\n### 5.1 买点类型（来自`0727 常用手法总结.xlsx`和`0927 错题集.txt`）\n\n**✅ 买点1：首板买点** \\- **适用场景** ：新题材启动、龙头股首板 \\- **判断标准** ： \\- ✅ 题材有想象力，是主流题材 \\- ✅ 板块效应强，板块内多股涨停 \\- ✅ 换手充分，量能放大 \\- **操作细节** ： \\- 打板买入（涨停价买入） \\- 仓位：30-50% \\- 止损：跌破涨停价止损\n\n**✅ 买点2：1进2买点** \\- **适用场景** ：龙头股确认后的接力 \\- **判断标准** ： \\- ✅ 首板是换手板，不是一字板 \\- ✅ 次日竞价弱转强（高开+放量） \\- ✅ 情绪周期在发酵期或高潮期 \\- **操作细节** ： \\- 竞价阶段挂单买入，或开盘后打板买入 \\- 仓位：50-70% \\- 止损：跌破2板涨停价止损\n\n**✅ 买点3：2进3买点** \\- **适用场景** ：龙头股确认后的高位接力 \\- **判断标准** ： \\- ✅ 2板是换手板，不是一字板 \\- ✅ 次日竞价弱转强或缩量加速 \\- ✅ 情绪周期在高潮期 \\- **操作细节** ： \\- 竞价阶段挂单买入，或开盘后打板买入 \\- 仓位：30-50%（高位接力，仓位要轻） \\- 止损：跌破3板涨停价止损\n\n**✅ 买点4：低吸买点（来自`0927 错题集.txt`）** \\- **适用场景** ：人气股分歧、人气股急杀 \\- **判断标准** ： \\- ✅ 低吸要分两笔操作，今日分歧买点和次日反包买点 \\- ✅ 人气股的突然急杀是一定可以低吸的 \\- ✅ 安全性最大 \\- **操作细节** ： \\- 今日分歧买点：人气股分歧时，低吸买入30%仓位 \\- 次日反包买点：人气股反包时，再加仓30% \\- 止损：跌破低吸价5%止损\n\n**✅ 买点5：反包买点** \\- **适用场景** ：龙头股反包、人气股反包 \\- **判断标准** ： \\- ✅ 龙头股断板后，次日反包涨停 \\- ✅ 反包涨停是换手板，不是一字板 \\- ✅ 情绪周期在修复期或发酵期 \\- **操作细节** ： \\- 打板买入（反包涨停价买入） \\- 仓位：30-50% \\- 止损：跌破反包涨停价止损\n\n### 5.2 买点选择的细节规则（来自`0927 错题集.txt`）\n\n**✅ 规则1：指数高潮当天不打板、不追高** \\- 指数高潮当天，风险大于收益 \\- 最多玩玩强势人气股低吸 \\- 确认安全下午再打回封板\n\n**✅ 规则2：龙头高位缩量加速时，风险来临** \\- 当个股连续缩量加速高位板的时候，就是风险来临的时候 \\- 这个时候去做补涨首板都是很难的 \\- 操作细节：龙头高位缩量加速时，持仓不动或止盈离场，不追高\n\n**✅ 规则3：市场非常高潮的时候要么持仓，要么空仓，不要追涨** \\- 高潮表现为龙头高位缩量、跟风强势股也是缩量的 \\- 操作细节：持仓不动，让利润奔跑；或止盈离场，不追高\n\n**✅ 规则4：判断次日情绪为震荡，且接力不行的时候，个股缩量高开直接砸** \\- 操作细节：竞价阶段直接卖出，不犹豫\n\n* * *\n\n## 6\\. 持仓与卖点体系\n\n### 6.1 持仓策略\n\n**✅ 策略1：让利润奔跑** \\- 龙头股在情绪发酵期和高潮期，持仓不动 \\- 不急于止盈，让利润奔跑 \\- 操作细节：设置移动止盈，不提前止盈\n\n**✅ 策略2：分批止盈** \\- 龙头股在情绪高潮期，分批止盈 \\- 第一批：50%仓位，在龙头股缩量加速时止盈 \\- 第二批：50%仓位，在龙头股断板时止盈 \\- 操作细节：不要一次性止盈，分批锁定利润\n\n### 6.2 卖点策略\n\n**✅ 卖点1：止损卖点** \\- **判断标准** ： \\- ✅ 跌破止损价（跌破涨停价或低吸价） \\- ✅ 情绪周期转向衰退 \\- **操作细节** ： \\- 立即止损，不犹豫 \\- 不要抱有任何幻想 \\- 止损是保护本金的最后防线\n\n**✅ 卖点2：止盈卖点** \\- **判断标准** ： \\- ✅ 龙头股缩量加速（高位） \\- ✅ 龙头股断板 \\- ✅ 情绪周期转向衰退 \\- **操作细节** ： \\- 分批止盈，不要一次性止盈 \\- 第一批：50%仓位，缩量加速时止盈 \\- 第二批：50%仓位，断板时止盈\n\n**✅ 卖点3：情绪周期卖点** \\- **判断标准** ： \\- ✅ 情绪周期从高潮转向衰退 \\- ✅ 出现\"昨日涨停今日跌停\"现象 \\- ✅ 炸板率>30% \\- **操作细节** ： \\- 立即止盈离场 \\- 不接高位接力 \\- 空仓观望或轻仓试错新题材\n\n* * *\n\n## 7\\. 仓位管理体\n\n### 7.1 仓位管理原则\n\n**✅ 原则1：情绪周期决定仓位** \\- 冰点期：0-10%（空仓或轻仓试错） \\- 修复期：10-30%（小仓试错） \\- 发酵期：30-70%（大胆做多） \\- 高潮期：50-100%（重仓或满仓） \\- 衰退期：0-10%（止盈离场或空仓）\n\n**✅ 原则2：单笔交易仓位限制** \\- 首板：30-50% \\- 1进2：50-70% \\- 2进3：30-50% \\- 低吸：30-50% \\- 反包：30-50%\n\n**✅ 原则3：总仓位限制** \\- 总仓位不超过100% \\- 单只股票仓位不超过70% \\- 持有股票数量不超过3只\n\n### 7.2 仓位管理的细节规则（来自`0927 错题集.txt`）\n\n**✅ 规则1：次日对超空间的博弈只用三成仓位去做** \\- 三成仓位去做空间接力，这样使得资金更加机动 \\- 操作细节：空间板接力，仓位不超过30%\n\n**✅ 规则2：轻仓关** \\- 交易者在这个阶段，快速发财的欲望膨胀，胆子越来越大，仓位也越来越重 \\- 终于有一天出现了交易者虽然设置了止损但市场没有给予执行的机会，于是资金大幅回撤甚至出现重大亏损 \\- 操作细节：轻仓交易，不再急于求成\n\n* * *\n\n## 8\\. 风险控制体系\n\n### 8.1 风险控制原则\n\n**✅ 原则1：止损是必须的** \\- 每笔交易都必须设置止损 \\- 止损是保护本金的最后防线 \\- 操作细节：每笔交易前，先确定止损价\n\n**✅ 原则2：止损要坚决** \\- 止损不能犹豫，不能抱幻想 \\- 止损是操作规则，不是情绪反应 \\- 操作细节：跌破止损价，立即止损出局\n\n**✅ 原则3：亏损不能扩大** \\- 单笔交易亏损不超过5% \\- 单日亏损不超过10% \\- 单周亏损不超过20% \\- 操作细节：设置单笔、单日、单周亏损上限\n\n### 8.2 风险控制工具\n\n**✅ 工具1：止损价计算** \\- 首板止损价：跌破涨停价 \\- 1进2止损价：跌破2板涨停价 \\- 2进3止损价：跌破3板涨停价 \\- 低吸止损价：跌破低吸价5%\n\n**✅ 工具2：亏损上限计算** \\- 单笔交易亏损上限 = 总资金 × 5% \\- 单日亏损上限 = 总资金 × 10% \\- 单周亏损上限 = 总资金 × 20%\n\n**✅ 工具3：风险收益比计算** \\- 风险收益比 = (卖出价 - 买入价) / (买入价 - 止损价) \\- 风险收益比 < 2:1 的交易不做 \\- 操作细节：每笔交易前计算风险收益比\n\n* * *\n\n## 9\\. 复盘体系（严格整合个人复盘模板）\n\n### 9.1 每日复盘流程（来自`如何复盘-游资训练营（第一版）.pptx` 和 `0727 复盘流程.xlsx`）\n\n**✅ 流程1：盘后 自满 \\- 空仓时保持耐心，不急于求成\n\n**✅ 原则2：保持自律** \\- 严格执行交易计划 \\- 严格执行止损 \\- 严格执行仓位管理\n\n**✅ 原则3：保持学习** \\- 从亏损中学习 \\- 从成功中学习 \\- 持续学习新知识\n\n### 10.2 心态管理工具（来自`每日记录.xlsx`）\n\n**✅ 工具1：每日心态记录** \\- 今日心态：** _\\- 今日情绪：_** \\- 今日操作是否受情绪影响：是/否 \\- 如何调整心态：___\n\n**✅ 工具2：冥想与放松** \\- 每天冥想10分钟 \\- 每天做运动30分钟 \\- 保持良好的作息\n\n**✅ 工具3：与他人交流** \\- 与良师益友交流 \\- 多看高手写的书 \\- 独立思考，不盲从他人\n\n* * *\n\n## 11\\. 交易纪律与执行\n\n### 11.1 交易纪律\n\n**✅ 纪律1：严格执行止损** \\- 每笔交易都必须设置止损 \\- 跌破止损价，立即止损出局 \\- 不要抱有任何幻想\n\n**✅ 纪律2：严格执行仓位管理** \\- 不要重仓赌博 \\- 不要满仓操作 \\- 轻仓试错，重仓确认\n\n**✅ 纪律3：严格执行情绪周期** \\- 情绪周期冰点期，空仓观望 \\- 情绪周期高潮期，持仓不动 \\- 情绪周期衰退期，止盈离场\n\n**✅ 纪律4：严格执行复盘** \\- 每天复盘，不偷懒 \\- 每周复盘，不松懈 \\- 每月复盘，不忽视\n\n### 11.2 交易执行\n\n**✅ 执行1：按照交易计划执行** \\- 每笔交易前，制定交易计划 \\- 按照交易计划执行，不随意更改\n\n**✅ 执行2：按照买卖点执行** \\- 按照买点买入，不追高 \\- 按照卖点卖出，不犹豫\n\n**✅ 执行3：按照仓位管理执行** \\- 按照仓位管理规则，不重仓 \\- 按照仓位管理规则，不轻仓\n\n* * *\n\n## 12\\. 龙行刺情绪周期交易系统\n\n（来自`202502\\2025年2月28日龙头股买点策略（龙行刺周期）.md`）\n\n### 12.1 龙行刺周期定义\n\n**✅ 阶段1：启动期** \\- 龙头股启动，题材启动 \\- 操作策略：打首板或1进2\n\n**✅ 阶段2：发酵期** \\- 龙头股发酵，板块效应强 \\- 操作策略：接力龙头股（2进3、3进4）\n\n**✅ 阶段3：高潮期** \\- 龙头股缩量加速，情绪高潮 \\- 操作策略：持仓不动，让利润奔跑\n\n**✅ 阶段4：衰退期** \\- 龙头股断板，情绪衰退 \\- 操作策略：止盈离场，空仓观望\n\n**✅ 阶段5：冰点期** \\- 龙头股跌停，情绪冰点 \\- 操作策略：空仓观望，等待冰点极致\n\n### 12.2 龙行刺买点策略\n\n**✅ 策略1：龙头股首板买点** \\- 新题材启动，龙头股首板 \\- 打板买入，仓位30-50%\n\n**✅ 策略2：龙头股1进2买点** \\- 龙头股确认，次日弱转强 \\- 竞价买入或打板买入，仓位50-70%\n\n**✅ 策略3：龙头股2进3买点** \\- 龙头股高位接力，次日缩量加速 \\- 竞价买入或打板买入，仓位30-50%\n\n**✅ 策略4：龙头股低吸买点** \\- 龙头股分歧，人气股急杀 \\- 低吸买入，仓位30-50%\n\n**✅ 策略5：龙头股反包买点** \\- 龙头股断板，次日反包 \\- 打板买入，仓位30-50%\n\n* * *\n\n## 13\\. 资金流分析体系\n\n（来自`资金流-游资训练营.pptx`）\n\n### 13.1 资金流派系\n\n**✅ 派系1：跟风派** \\- 跟踪游资席位，跟风操作 \\- 优点：安全边际高 \\- 缺点：盈利空间有限\n\n**✅ 派系2：引导派** \\- 提前布局，引导资金流向 \\- 优点：盈利空间大 \\- 缺点：风险高\n\n**✅ 派系3：独立派** \\- 独立分析，不跟风不引导 \\- 优点：操作自由 \\- 缺点：需要极强的分析能力\n\n### 13.2 资金流分析工具\n\n**✅ 工具1：龙虎榜分析** \\- 看游资席位买入卖出情况 \\- 分析资金流向 \\- 判断龙头股的市场认可度\n\n**✅ 工具2：资金定位逻辑** \\- 定位主流资金在哪个题材 \\- 定位主流资金在哪个股票 \\- 跟随主流资金操作\n\n**✅ 工具3：资金流核心用途** \\- 判断情绪周期位置 \\- 判断龙头股的市场认可度 \\- 判断题材的持续性\n\n* * *\n\n## 14\\. 交易八大关\n\n（来自`1011 交易八大关.txt`）\n\n### 14.1 八大关详解\n\n**✅ 第一关：止损关** \\- 交易者要取得成功至少需要过这一关 \\- 学会止损后，保护本金 \\- 操作细节：每笔交易都必须设置止损\n\n**✅ 第二关：顺势关** \\- 学会止损后，还要学会顺势交易 \\- 不顺势交易会慢性失血 \\- 操作细节：按照行情大方向做单\n\n**✅ 第三关：轻仓关** \\- 学会了截断亏损让利润奔跑，但要轻仓交易 \\- 重仓会猝死 \\- 操作细节：轻仓交易，不再急于求成\n\n**✅ 第四关：择时关** \\- 轻仓操作下，赚钱速度慢 \\- 但不要每时每刻都有交易做 \\- 操作细节：一年中只需要抓住那几次有限的行情即可\n\n**✅ 第五关：系统关** \\- 把交易理念转化为具体的操作规则 \\- 构建自己的交易系统 \\- 操作细节：交易系统必须是初始资金、入场、止损、止盈、加减仓五位一体的系统\n\n**✅ 第六关：自信关** \\- 交易系统构建成功了，但严格按照信号操作后，却碰到了连续亏五六笔的情况 \\- 不要怀疑自己的系统 \\- 操作细节：连输连错不过是坏的游程在起作用\n\n**✅ 第七关：重复关** \\- 交易者明白了亏损是交易的必然组成部分 \\- 不要去设计测试其他系统 \\- 操作细节：专心按照既有系统信号操作，不断重复盈利模式\n\n**✅ 第八关：自在关** \\- 交易者防止每个错误的方法都已规则化 \\- 每次交易都能做到严格执行规则 \\- 操作细节：修炼定力，不为外界信息所扰\n\n* * *\n\n## 15\\. 错题集与心得\n\n（来自`0927 错题集.txt`）\n\n### 15.1 错题集\n\n  1. **指数周期是用来做情绪参考，用来避免炸板潮的**\n  2. 在指数高潮那天，要避免去追高加速的一字板\n  3. 因为次日指数是可能高潮走向衰退的\n\n  4. **学会判断冰点的大小**\n\n  5. 如果冰点前两天才高潮，那么这个冰点只是小冰点\n  6. 接下来的行情也只是反抽，并不是反转\n  7. 冰点极致才会出拐点，拐点才会出龙头\n\n  8. **低吸要分两笔操作**\n\n  9. 今日分歧买点和次日反包买点\n  10. 这样安全性最大\n  11. 另外人气股的突然急杀是一定可以低吸的\n\n  12. **前排再次超预期的时候应该直接上前排，不应该去后排做补涨**\n\n  13. 因为龙头没有断板的情况下去YY龙头补涨是很难的\n  14. 要么做首板补涨，要么不做\n\n  15. **做股票想要大成，不是盯着股票本身，而是整个股票市场的多空格局**\n\n  16. 当你脱离股票本身，站在市场的整体格局去思考问题，就会看的非常清楚\n\n  17. **人气龙头启动于指数下跌末期，强化于指数上涨中期，反包于指数见顶期，和指数共振下跌衰退**\n\n  18. **控制自己的情绪交易，直到你看清了市场情绪，否则绝对不开仓**\n\n  19. **龙头启动于几板不重要，重要的是当时的情绪环境龙头有没有起到重要**\n\n  20. **永不止损，永不止盈（操作是操作，盈亏交给市场）**\n\n  21. **龙头的定义并不在于板好板烂，或者时间早晚，而在于本身所具有的特性，有市场炒作的空间**\n\n  22. **但凡有亏钱效应的板块，都要回避，这是进攻节奏不完美的体现**\n\n  23. **模仿的个股要等次日超预期才是买点（如新中港模仿国电南自）**\n\n  24. **指数高潮当天不打板、不追高，最多玩玩强势人气股的低吸，确认安全下午再打回封板**\n\n  25. **龙头三板的时候打补涨首板是百分百有套利空间的**\n\n  26. **中级周期也不是每一个阶段都要经历的**\n\n  27. 如果它没能从赚钱效应转好，走到赚钱效应的 max，那它就会继续从亏钱效应明显回归到赚钱效应转好这个阶段，继而循环往复，直到会出现突破的 max。\n\n  28. **出现空间突破的时候就是赚钱效应非常好的时候**\n\n  29. 这个时候可以去做一些前期强势股的人气低吸\n  30. 出现打破空间的票以后，当天人气股市不会分歧二板继续跌停的\n\n  31. **市场情绪监控表是对隔日情绪做一个判断**\n\n  32. 连续跌两天对隔日有情绪弱变强的预期\n  33. 但是第三天是未知的，可能拉，可能震荡\n  34. 如果不涨，那么昨天的超盘资金就会变为砸盘资金\n\n  35. **市场迷茫的时候，指数下跌的时候才有机会，指数上涨的时候是没有机会的**\n\n  36. **当个股连续缩量加速高位板的时候，就是风险来临的时候**\n\n  37. 这个时候去做补涨首板都是很难的\n\n  38. **市场非常高潮的时候要么持仓，要么空仓，不要追涨**\n\n  39. 高潮表现为龙头高位缩量、跟风强势股也是缩量的\n\n  40. **判断次日情绪为震荡，且接力不行的时候，个股缩量高开直接砸**\n\n  41. **次日对超空间的博弈只用三成仓位去做**\n\n  42. 三成仓位去做空间接力，这样使得资金更加机动\n\n\n\n* * *\n\n## 📝 总结\n\n本交易体系严格整合了： 1\\. **26位游资的智慧** （来自26位游资的心法和深度研读报告） 2\\. **个人复盘理论** （来自个人复盘材料中的理论部分） 3\\. **个人复盘模板** （来自个人复盘材料中的模板部分，包括大盘情绪监控表、中级周期监控表、短期周期监控表、每日复盘流程、每周复盘流程、每月复盘流程等）\n\n本交易体系具有： \\- ⭐⭐⭐⭐⭐ **可执行性** ：每个步骤都有详细操作说明和检查清单 \\- ⭐⭐⭐⭐⭐ **完整性** ：涵盖了交易的方方面面，从哲学到执行 \\- ⭐⭐⭐⭐⭐ **实用性** ：来自26位游资的实战智慧和个人复盘经验\n\n* * *\n\n**免责声明** ：本交易体系仅供参考学习，不构成投资建议。股市有风险，投资需谨慎。","isMindmap":false,"docType":"Markdown","isHtml":false},{"id":"jiaoyi-我的交易体系_二十六位游资深度精华版","title":"我的交易体系_二十六位游资深度精华版","category":"jiao-yi-tixi","subcategory":null,"content":"# 我的交易体系_二十六位游资深度精华版\n\n> **体系版本** ：v6.0（二十六位游资深度精华版）  \n>  **基于游资** ：炒股养家、Asking、职业炒手、赵老哥、徐翔、龙飞虎、小鳄鱼、92科比、瑞鹤仙、著名刺客、退学炒股、独股一箭、落升、章盟主、欢乐海岸、明王、令胡冲、艾琳、丁一熊、万法归宗、浓汤野人、涅盘重升、榜中榜、凡倍无名、乔帮主、孤独牛背（共计26位）  \n>  **核心特点** ：✅ 每条规则都是可执行细节，✅ 每条规则都有游资智慧支撑\n\n* * *\n\n## 第一章：交易哲学与心态（✅ 可执行）\n\n### 1.1 核心哲学（✅ 可执行）\n\n✅ **规则1：市场永远是对的** \\- **来源** ：炒股养家、Asking、职业炒手 \\- **操作** ：市场永远是对的，错的只有自己。在市场面前，永远要谦卑。 \\- **执行细节** ：每天开盘前默念三遍\"市场永远是对的\"，不符合市场预期就止损。\n\n✅ **规则2：情绪周期是根本** \\- **来源** ：炒股养家、徐翔、龙飞虎 \\- **操作** ：掌握情绪周期，比掌握任何技术指标都重要。情绪周期分为：冰点→复苏→高潮→分化→退潮→冰点。 \\- **执行细节** ：每天记录市场情绪（1-10分），在情绪冰点（1-3分）时空仓，在情绪高潮（7-10分）时满仓。\n\n✅ **规则3：龙头战法是核心** \\- **来源** ：赵老哥、章盟主、欢乐海岸 \\- **操作** ：只做龙头，不做跟风。龙头股是市场选择的结果，不是你选择的结果。 \\- **执行细节** ：每个板块只做龙头股（涨幅前3名），不做跟风股（涨幅4名以后）。\n\n### 1.2 心态管理（✅ 可执行）\n\n✅ **规则1：战胜\"小明\"** \\- **来源** ：乔帮主、退学炒股 \\- **操作** ：\"小明\"代表内心的贪婪、恐惧、侥幸。\"我\"代表理性的交易者。每次交易前，问问自己：\"这是'我'在交易，还是'小明'在交易？\" \\- **执行细节** ：交易前写交易计划，交易中严格执行，交易后复盘总结。\n\n✅ **规则2：控制回撤比追求暴利更重要** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：回撤50%，需要涨100%才能回本。控制回撤是稳定盈利的关键。 \\- **执行细节** ：单日回撤超过-3%，立即停止交易，复盘反思。\n\n✅ **规则3：耐心是交易者最好的朋友** \\- **来源** ：Asking、职业炒手 \\- **操作** ：大多数时间都在等待，等待那个属于自己的机会。耐心不是不行动，而是知道什么时候该行动。 \\- **执行细节** ：每天只做1-3笔交易，其余时间观察市场。\n\n* * *\n\n## 第二章：选股体系（✅ 可执行）\n\n### 2.1 选股原则（✅ 可执行）\n\n✅ **规则1：只做强势股** \\- **来源** ：赵老哥、小鳄鱼、92科比 \\- **操作** ：只做强势股，不做弱势股。强势股的特征：均线多头排列，成交量放大，突破关键阻力位。 \\- **执行细节** ：选股时，只选5日线>10日线>20日线的个股。\n\n✅ **规则2：只做龙头** \\- **来源** ：炒股养家、赵老哥、章盟主 \\- **操作** ：只做龙头，不做跟风。龙头股是市场选择的结果，不是你选择的结果。 \\- **执行细节** ：每个板块只做龙头股（涨幅前3名），不做跟风股（涨幅4名以后）。\n\n✅ **规则3：紧跟市场热点** \\- **来源** ：职业炒手、龙飞虎、瑞鹤仙 \\- **操作** ：紧跟市场热点题材，不做冷门股。热点的判断：涨停板数量，板块联动性，政策支持力度。 \\- **执行细节** ：每天关注涨幅榜前50名，找出属于同一板块的个股，判断是否为题材启动。\n\n### 2.2 选股方法（✅ 可执行）\n\n✅ **规则1：超短百科全书** \\- **来源** ：凡倍无名 \\- **操作** ：K线形态、成交量研究、成本均线、筹码理论、分时研究。 \\- **执行细节** ：建立自己的超短百科全书体系，每天学习一个知识点。\n\n✅ **规则2：低吸战法** \\- **来源** ：乔帮主 \\- **操作** ：在分时图全天相对低点买入，追求买在低位，卖在高位。 \\- **执行细节** ：分时图急跌后，跌幅超过-3%时，在跌势放缓时低吸。\n\n✅ **规则3：模式的选择** \\- **来源** ：凡倍无名 \\- **操作** ：市场的模式，无非三种，低吸，追涨，打板三种。 \\- **执行细节** ：选择适合自己的模式，专注一种模式，精通后再学其他。\n\n* * *\n\n## 第三章：买入时机把握（✅ 可执行）\n\n### 3.1 买入原则（✅ 可执行）\n\n✅ **规则1：买在分歧，卖在一致** \\- **来源** ：炒股养家、Asking \\- **操作** ：当市场对一只股票有分歧时买入，当市场一致看好时卖出。 \\- **执行细节** ：当一只股票涨停被打开（分歧）时买入，当一只股票缩量涨停（一致）时卖出。\n\n✅ **规则2：买在恐慌，卖在贪婪** \\- **来源** ：徐翔、龙飞虎 \\- **操作** ：当市场恐慌时买入，当市场贪婪时卖出。 \\- **执行细节** ：当大盘跌幅超过-3%时，寻找超跌反弹机会。\n\n✅ **规则3：买在低位，卖在高位** \\- **来源** ：凡倍无名、乔帮主 \\- **操作** ：买在低位，卖在高位。 \\- **执行细节** ：当股价回到前日收盘价附近时买入，当股价达到3-5%收益时卖出。\n\n### 3.2 买入方法（✅ 可执行）\n\n✅ **规则1：突破买入法** \\- **来源** ：赵老哥、小鳄鱼 \\- **操作** ：当股价突破前期高点或关键阻力位时买入。 \\- **执行细节** ：当股价突破前期高点，且成交量放大时买入。\n\n✅ **规则2：回踩买入法** \\- **来源** ：92科比、瑞鹤仙 \\- **操作** ：当股价回踩均线（如5日线、10日线）时买入。 \\- **执行细节** ：当股价回踩5日线，且5日线向上时买入。\n\n✅ **规则3：低吸买入法** \\- **来源** ：乔帮主、孤独牛背 \\- **操作** ：在分时图全天相对低点买入。 \\- **执行细节** ：分时图急跌后，跌幅超过-3%时，在跌势放缓时低吸。\n\n* * *\n\n## 第四章：持有与卖出策略（✅ 可执行）\n\n### 4.1 持有策略（✅ 可执行）\n\n✅ **规则1：顺势持有** \\- **来源** ：炒股养家、赵老哥 \\- **操作** ：在上升趋势中持有，在下降趋势中卖出。 \\- **执行细节** ：当股价在5日线之上时持有，当股价跌破5日线时卖出。\n\n✅ **规则2：达到预期收益就卖** \\- **来源** ：乔帮主、孤独牛背 \\- **操作** ：达到3-5%收益就卖，不贪心，锁定利润。 \\- **执行细节** ：当收益达到3-5%时，分批卖出。\n\n✅ **规则3：走势不符合预期就卖** \\- **来源** ：炒股养家、Asking \\- **操作** ：走势不符合预期立即止损，避免更大亏损。 \\- **执行细节** ：当股价跌破止损线（-3%到-5%）时，立即止损。\n\n### 4.2 卖出方法（✅ 可执行）\n\n✅ **规则1：分时图急拉后的高点** \\- **来源** ：乔帮主 \\- **操作** ：分时图出现急拉，涨幅超过3%时，在涨势放缓时卖出。 \\- **执行细节** ：分时图急拉后，涨幅超过3%时，在涨势放缓时卖出。\n\n✅ **规则2：涨停板** \\- **来源** ：赵老哥、章盟主 \\- **操作** ：股价涨停时，涨停板卖出或持有。 \\- **执行细节** ：股价涨停时，如果封单坚决，持有；如果封单不坚决，卖出。\n\n✅ **规则3：达到预期收益** \\- **来源** ：乔帮主、孤独牛背 \\- **操作** ：达到3-5%收益时，果断卖出，锁定利润。 \\- **执行细节** ：当收益达到3-5%时，分批卖出。\n\n* * *\n\n## 第五章：仓位管理（✅ 可执行）\n\n### 5.1 仓位管理原则（✅ 可执行）\n\n✅ **规则1：顺势加仓** \\- **来源** ：炒股养家、赵老哥 \\- **操作** ：趋势向好时逐步加仓，趋势转弱时逐步减仓。 \\- **执行细节** ：盈利后，每涨3%加仓1成，直至满仓。\n\n✅ **规则2：逆势减仓** \\- **来源** ：Asking、职业炒手 \\- **操作** ：趋势转弱时逐步减仓，不要逆势加仓。 \\- **执行细节** ：亏损后，每跌3%减仓1成，直至空仓。\n\n✅ **规则3：严格控制** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：单只个股不超过5成仓，总仓位不超过8成仓。 \\- **执行细节** ：单只个股不超过3成仓，总仓位不超过7成仓。\n\n### 5.2 仓位管理方法（✅ 可执行）\n\n✅ **规则1：分3份资金** \\- **来源** ：孤独牛背 \\- **操作** ：如果可以把资金分成3份，每份买1只标的，行情好时买满3只标的，行情差时只买1只标的或空仓不做。 \\- **执行细节** ：资金分成3份，每份买1只标的，行情好时买满3只标的，行情差时只买1只标的或空仓不做。\n\n✅ **规则2：根据市场变化动态调整仓位** \\- **来源** ：乔帮主 \\- **操作** ：根据市场变化动态调整仓位，顺势加仓，逆势减仓。 \\- **执行细节** ：根据市场情绪（1-10分），调整仓位（1-3分空仓，4-6分3成仓，7-10分7成仓）。\n\n✅ **规则3：保留机动资金** \\- **来源** ：凡倍无名、乔帮主 \\- **操作** ：保留3成机动资金，用于应对突发情况。 \\- **执行细节** ：总仓位不超过7成仓，保留3成机动资金。\n\n* * *\n\n## 第六章：风险控制（✅ 可执行）\n\n### 6.1 风险控制原则（✅ 可执行）\n\n✅ **规则1：严格止损** \\- **来源** ：所有26位游资 \\- **操作** ：跌破止损线（-3%到-5%）立即止损，保护本金。 \\- **执行细节** ：设置止损线（-3%到-5%），跌破止损线立即止损。\n\n✅ **规则2：保护本金** \\- **来源** ：徐翔、Asking \\- **操作** ：本金比赚钱更重要，风险控制是交易的生命线。 \\- **执行细节** ：本金亏损超过-10%，立即停止交易，复盘反思。\n\n✅ **规则3：控制回撤** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：控制回撤比追求暴利更重要，回撤控制好了，复利自然就来了。 \\- **执行细节** ：单日回撤超过-3%，立即停止交易，复盘反思。\n\n### 6.2 风险控制方法（✅ 可执行）\n\n✅ **规则1：事前控制** \\- **来源** ：炒股养家、职业炒手 \\- **操作** ：严格选股，只做强势股；控制仓位，不重仓单只个股；设置止损，严格执行。 \\- **执行细节** ：选股时，只选强势股；仓位控制，单只个股不超过3成仓；止损设置，跌破止损线立即止损。\n\n✅ **规则2：事中控制** \\- **来源** ：龙飞虎、小鳄鱼 \\- **操作** ：实时监控盘面变化；及时调整仓位；果断止损。 \\- **执行细节** ：实时监控盘面变化，及时调整仓位，果断止损。\n\n✅ **规则3：事后控制** \\- **来源** ：92科比、瑞鹤仙 \\- **操作** ：总结经验教训；优化交易系统；调整心态。 \\- **执行细节** ：每天复盘，总结经验教训；优化交易系统；调整心态。\n\n* * *\n\n## 第七章：情绪周期判断（✅ 可执行）\n\n### 7.1 情绪周期阶段（✅ 可执行）\n\n✅ **规则1：冰点** \\- **来源** ：炒股养家、徐翔 \\- **操作** ：市场情绪极度低迷，涨停板数量少于10只，跌幅榜上躺着众多跌停或大跌个股。操作：空仓观望，等待复苏。 \\- **执行细节** ：当市场情绪为1-3分时，空仓观望。\n\n✅ **规则2：复苏** \\- **来源** ：龙飞虎、瑞鹤仙 \\- **操作** ：市场情绪开始回暖，涨停板数量增加到20-30只，板块开始有联动性。操作：小仓位试错，寻找龙头。 \\- **执行细节** ：当市场情绪为4-6分时，小仓位试错（3成仓）。\n\n✅ **规则3：高潮** \\- **来源** ：赵老哥、章盟主 \\- **操作** ：市场情绪极度高涨，涨停板数量超过50只，板块全线飘红。操作：满仓操作，但随时准备撤退。 \\- **执行细节** ：当市场情绪为7-10分时，满仓操作（7成仓）。\n\n### 7.2 情绪周期判断方法（✅ 可执行）\n\n✅ **规则1：看涨停板数量** \\- **来源** ：职业炒手、著名刺客 \\- **操作** ：涨停板数量越多，市场情绪越好。 \\- **执行细节** ：每天关注涨停板数量，判断市场情绪。\n\n✅ **规则2：看跌幅榜** \\- **来源** ：Asking、退学炒股 \\- **操作** ：跌幅榜上躺着众多跌停或大跌个股，市场情绪差。 \\- **执行细节** ：每天关注跌幅榜，判断市场情绪。\n\n✅ **规则3：看板块联动性** \\- **来源** ：小鳄鱼、92科比 \\- **操作** ：板块内个股联动性强，市场情绪好。 \\- **执行细节** ：每天关注板块联动性，判断市场情绪。\n\n* * *\n\n## 第八章：龙头战法（✅ 可执行）\n\n### 8.1 龙头股特征（✅ 可执行）\n\n✅ **规则1：涨幅靠前** \\- **来源** ：赵老哥、章盟主 \\- **操作** ：龙头股是板块内涨幅靠前的个股。 \\- **执行细节** ：每个板块只做龙头股（涨幅前3名）。\n\n✅ **规则2：涨停最早** \\- **来源** ：欢乐海岸、著名刺客 \\- **操作** ：龙头股是板块内涨停最早的个股。 \\- **执行细节** ：每个板块只做龙头股（涨停最早的前3名）。\n\n✅ **规则3：封单最坚决** \\- **来源** ：炒股养家、赵老哥 \\- **操作** ：龙头股是板块内封单最坚决的个股。 \\- **执行细节** ：每个板块只做龙头股（封单最坚决的前3名）。\n\n### 8.2 龙头战法操作方法（✅ 可执行）\n\n✅ **规则1：识别龙头** \\- **来源** ：赵老哥、章盟主 \\- **操作** ：通过涨幅、涨停时间、封单坚决程度识别龙头。 \\- **执行细节** ：每个板块只做龙头股（涨幅前3名、涨停最早的前3名、封单最坚决的前3名）。\n\n✅ **规则2：买入龙头** \\- **来源** ：炒股养家、欢乐海岸 \\- **操作** ：在龙头股分歧时买入，在龙头股一致时卖出。 \\- **执行细节** ：当龙头股涨停被打开（分歧）时买入，当龙头股缩量涨停（一致）时卖出。\n\n✅ **规则3：持有龙头** \\- **来源** ：徐翔、龙飞虎 \\- **操作** ：在上升趋势中持有龙头股，在下降趋势中卖出龙头股。 \\- **执行细节** ：当龙头股在5日线之上时持有，当龙头股跌破5日线时卖出。\n\n* * *\n\n## 第九章：超短百科全书（✅ 可执行）\n\n### 9.1 超短百科全书内容（✅ 可执行）\n\n✅ **规则1：K线形态** \\- **来源** ：凡倍无名 \\- **操作** ：K线，来源于日本阴阳烛，原来的股市是通过报价，但是为了便于在这个行业内，统计分析，于是有了K线。 \\- **执行细节** ：学习K线形态，每天观察20个K线图。\n\n✅ **规则2：成交量研究** \\- **来源** ：凡倍无名 \\- **操作** ：成交量的基础，成交量的安全性，集合竞价的秘密。 \\- **执行细节** ：学习成交量研究，每天观察20个成交量图。\n\n✅ **规则3：成本均线** \\- **来源** ：凡倍无名 \\- **操作** ：成本均线理论，当股价在成本均线之上，说明市场上大部分投资者都是盈利的，这时候股价容易继续上涨。 \\- **执行细节** ：学习成本均线理论，每天观察20个成本均线图。\n\n### 9.2 超短百科全书使用方法（✅ 可执行）\n\n✅ **规则1：建立自己的超短百科全书体系** \\- **来源** ：凡倍无名 \\- **操作** ：建立自己的超短百科全书体系，K线形态、成交量研究、成本均线、筹码理论、分时研究。 \\- **执行细节** ：建立自己的超短百科全书体系，每天学习一个知识点。\n\n✅ **规则2：实践三种模式** \\- **来源** ：凡倍无名 \\- **操作** ：市场的模式，无非三种，低吸，追涨，打板三种。 \\- **执行细节** ：实践三种模式（低吸、追涨、打板），选择适合自己的模式。\n\n✅ **规则3：每天复盘** \\- **来源** ：凡倍无名、乔帮主 \\- **操作** ：每天复盘，注重超短百科全书，K线形态，成交量研究，成本均线，筹码理论，分时研究。 \\- **执行细节** ：每天复盘，注重超短百科全书，K线形态，成交量研究，成本均线，筹码理论，分时研究。\n\n* * *\n\n## 第十章：模式转换心法（✅ 可执行）\n\n### 10.1 为什么要转换模式？（✅ 可执行）\n\n✅ **规则1：市场环境变化** \\- **来源** ：乔帮主 \\- **操作** ：低吸在熊市/震荡市有效，但在牛市效率太低；追涨打板在牛市效果更好，能抓住主升浪。 \\- **执行细节** ：根据市场环境变化，调整操作模式。\n\n✅ **规则2：资金规模变化** \\- **来源** ：乔帮主 \\- **操作** ：随着资金增大，低吸已经无法满足需求。 \\- **执行细节** ：根据资金规模变化，调整操作模式。\n\n✅ **规则3：个人能力提高** \\- **来源** ：乔帮主 \\- **操作** ：从新手到老手，需要不断调整操作模式。 \\- **执行细节** ：根据个人能力提高，调整操作模式。\n\n### 10.2 如何从低吸转换到追涨打板？（✅ 可执行）\n\n✅ **规则1：学习新知识** \\- **来源** ：乔帮主 \\- **操作** ：学习追涨打板的技巧，理解追涨打板的逻辑，模拟交易练习。 \\- **执行细节** ：学习追涨打板的技巧，理解追涨打板的逻辑，模拟交易练习。\n\n✅ **规则2：小资金试错** \\- **来源** ：乔帮主 \\- **操作** ：用小额资金实盘操作，记录交易日志，总结经验和教训。 \\- **执行细节** ：用小额资金实盘操作，记录交易日志，总结经验和教训。\n\n✅ **规则3：逐步形成新系统** \\- **来源** ：乔帮主 \\- **操作** ：形成追涨打板的交易系统，优化买卖点，提高胜率和赔率。 \\- **执行细节** ：形成追涨打板的交易系统，优化买卖点，提高胜率和赔率。\n\n* * *\n\n## 第十一章：控制回撤体系（✅ 可执行）\n\n### 11.1 为什么要控制回撤？（✅ 可执行）\n\n✅ **规则1：回撤50%，需要涨100%才能回本** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：回撤越大，回本难度越大。控制回撤是稳定盈利的关键。 \\- **执行细节** ：单日回撤超过-3%，立即停止交易，复盘反思。\n\n✅ **规则2：控制回撤比追求暴利更重要** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：控制回撤比追求暴利更重要，回撤控制好了，复利自然就来了。 \\- **执行细节** ：控制回撤比追求暴利更重要，回撤控制好了，复利自然就来了。\n\n✅ **规则3：一天赚17%的机会会消失，但大回撤也会消失** \\- **来源** ：乔帮主 \\- **操作** ：不要追求暴利，要追求稳定盈利。 \\- **执行细节** ：不要追求暴利，要追求稳定盈利。\n\n### 11.2 如何控制回撤？（✅ 可执行）\n\n✅ **规则1：仓位管理** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：根据市场变化动态调整仓位，顺势加仓，逆势减仓，单只个股不超过3成仓。 \\- **执行细节** ：根据市场变化动态调整仓位，顺势加仓，逆势减仓，单只个股不超过3成仓。\n\n✅ **规则2：止损设置** \\- **来源** ：所有26位游资 \\- **操作** ：跌破止损线立即止损，走势不符合预期立即止损，大盘突然变盘立即止损。 \\- **执行细节** ：设置止损线（-3%到-5%），跌破止损线立即止损。\n\n✅ **规则3：模式选择** \\- **来源** ：孤独牛背、乔帮主 \\- **操作** ：弱市中空仓或轻仓，只做确定性高的机会，不勉强交易。 \\- **执行细节** ：弱市中空仓或轻仓（0-3成仓），只做确定性高的机会，不勉强交易。\n\n* * *\n\n## 第十二章：指数气氛判断（✅ 可执行）\n\n### 12.1 指数气氛判断方法（✅ 可执行）\n\n✅ **规则1：上证下跌，创业板大跌，是28齐跌，禁止开仓** \\- **来源** ：孤独牛背 \\- **操作** ：上证下跌，创业板大跌，是28齐跌，禁止开仓。 \\- **执行细节** ：上证下跌，创业板大跌，是28齐跌，禁止开仓。\n\n✅ **规则2：上证大涨，创业板大涨，是28齐涨，满仓做多** \\- **来源** ：孤独牛背 \\- **操作** ：上证大涨，创业板大涨，是28齐涨，满仓做多。 \\- **执行细节** ：上证大涨，创业板大涨，是28齐涨，满仓做多（7成仓）。\n\n✅ **规则3：上证大涨，创业板大跌，是28分化，小仓位做** \\- **来源** ：孤独牛背 \\- **操作** ：上证大涨，创业板大跌，是28分化，小仓位做。 \\- **执行细节** ：上证大涨，创业板大跌，是28分化，小仓位做（3成仓）。\n\n### 12.2 指数气氛判断的执行细节（✅ 可执行）\n\n✅ **规则1：每天观察上证和创业板的走势** \\- **来源** ：孤独牛背 \\- **操作** ：每天观察上证和创业板的走势，判断指数气氛。 \\- **执行细节** ：每天观察上证和创业板的走势，判断指数气氛。\n\n✅ **规则2：根据指数气氛调整仓位** \\- **来源** ：孤独牛背 \\- **操作** ：根据指数气氛调整仓位，上证下跌，创业板大跌，是28齐跌，禁止开仓；上证大涨，创业板大涨，是28齐涨，满仓做多。 \\- **执行细节** ：根据指数气氛调整仓位，上证下跌，创业板大跌，是28齐跌，禁止开仓；上证大涨，创业板大涨，是28齐涨，满仓做多（7成仓）。\n\n✅ **规则3：不要逆着指数气氛操作** \\- **来源** ：孤独牛背 \\- **操作** ：不要逆着指数气氛操作，上证下跌，创业板大跌，是28齐跌，禁止开仓。 \\- **执行细节** ：不要逆着指数气氛操作，上证下跌，创业板大跌，是28齐跌，禁止开仓。\n\n* * *\n\n## 第十三章：实战案例分析（✅ 可执行）\n\n### 13.1 案例一：低吸操作（✅ 可执行）\n\n**背景** ： \\- 某股短期跌幅较大 \\- 分时图出现急跌\n\n**操作过程** ： 1\\. 观察：发现该股有止跌迹象 2\\. 低吸：在分时图低点买入3成仓 3\\. 持有：走势符合预期，继续持有 4\\. 卖出：达到5%收益后卖出\n\n**经验教训** ： \\- 低吸要选择合适的时机 \\- 要严格控制仓位 \\- 要达到预期收益后果断卖出\n\n### 13.2 案例二：追涨操作（✅ 可执行）\n\n**背景** ： \\- 某题材成为市场热点 \\- 龙头股走势强劲\n\n**操作过程** ： 1\\. 识别：判断为题材启动 2\\. 选股：选择龙头股 3\\. 买入：在涨幅3%时追涨买入3成仓 4\\. 卖出：达到10%收益后分批卖出\n\n**经验教训** ： \\- 追涨要敢于追龙头股 \\- 要设置止损保护 \\- 要达到预期收益后果断卖出\n\n### 13.3 案例三：打板操作（✅ 可执行）\n\n**背景** ： \\- 某股快速上板 \\- 市场氛围好\n\n**操作过程** ： 1\\. 识别：判断为市场强势 2\\. 选股：选择快速上板的个股 3\\. 买入：在涨停板买入3成仓 4\\. 卖出：次日达到5%收益后卖出\n\n**经验教训** ： \\- 打板要选择合适的时机 \\- 要严格控制仓位 \\- 要达到预期收益后果断卖出\n\n* * *\n\n## 第十四章：学习路径与计划（✅ 可执行）\n\n### 14.1 学习路径（✅ 可执行）\n\n**第一阶段（1-2个月）** ： \\- 学习超短百科全书，K线形态，成交量研究，成本均线，筹码理论，分时研究 \\- 注重模式的选择，低吸，追涨，打板三种 \\- 练习复盘，看昨天的涨停板今天的赚钱效应\n\n**第二阶段（3-6个月）** ： \\- 建立自己的超短百科全书体系，K线形态，成交量研究，成本均线，筹码理论，分时研究 \\- 练习模式的选择，低吸，追涨，打板三种 \\- 控制仓位，5日线下不持仓超过20％\n\n**第三阶段（6-12个月）** ： \\- 形成自己的交易风格，高手们话不多并不是不愿讲，是因为他们经历足够多，敬畏市场 \\- 不断重复，优化操作模式 \\- 严格执行纪律，错了要坚决止损\n\n### 14.2 学习计划（✅ 可执行）\n\n**每日学习** ： \\- 每天复盘，注重超短百科全书，K线形态，成交量研究，成本均线，筹码理论，分时研究 \\- 每天观察20个分时图 \\- 每天记录10笔模拟交易\n\n**每周学习** ： \\- 每周复习一篇游资心法 \\- 每周实践三种手法（低吸、追涨、打板） \\- 每周写一篇学习总结\n\n**每月学习** ： \\- 每月复习所有游资心法 \\- 每月优化交易系统 \\- 每月调整心态\n\n* * *\n\n## 第十五章：核心要点总结（✅ 可执行）\n\n### 15.1 核心要点（✅ 可执行）\n\n  1. **交易哲学** ：市场永远是对的，情绪周期是根本，龙头战法是核心\n  2. **选股体系** ：只做强势股，只做龙头，紧跟市场热点\n  3. **买入时机** ：买在分歧，卖在一致；买在恐慌，卖在贪婪；买在低位，卖在高位\n  4. **持有与卖出** ：顺势持有，达到预期收益就卖，走势不符合预期就卖\n  5. **仓位管理** ：顺势加仓，逆势减仓，严格控制\n  6. **风险控制** ：严格止损，保护本金，控制回撤\n  7. **情绪周期** ：冰点→复苏→高潮→分化→退潮→冰点\n  8. **龙头战法** ：识别龙头，买入龙头，持有龙头\n  9. **超短百科全书** ：K线形态，成交量研究，成本均线，筹码理论，分时研究\n  10. **模式转换心法** ：根据市场环境变化，调整操作模式\n  11. **控制回撤体系** ：仓位管理，止损设置，模式选择\n  12. **指数气氛判断** ：上证下跌，创业板大跌，是28齐跌，禁止开仓；上证大涨，创业板大涨，是28齐涨，满仓做多\n  13. **实战案例** ：低吸操作，追涨操作，打板操作\n  14. **学习路径** ：第一阶段（1-2个月），第二阶段（3-6个月），第三阶段（6-12个月）\n  15. **核心要点** ：交易哲学，选股体系，买入时机，持有与卖出，仓位管理，风险控制，情绪周期，龙头战法，超短百科全书，模式转换心法，控制回撤体系，指数气氛判断，实战案例，学习路径\n\n\n\n### 15.2 可执行规则检查清单（✅ 可执行）\n\n**选股阶段** ： \\- [ ] 是否符合超短百科全书？ \\- [ ] 是否符合模式的选择？ \\- [ ] 是否符合K线形态的重要意义？\n\n**买入阶段** ： \\- [ ] 是否达到买入条件？ \\- [ ] 是否设置止损？ \\- [ ] 是否控制仓位？\n\n**卖出阶段** ： \\- [ ] 是否达到卖出条件？ \\- [ ] 是否果断执行？ \\- [ ] 是否锁定利润？\n\n**仓位管理** ： \\- [ ] 单只个股是否不超过3成仓？ \\- [ ] 总仓位是否不超过7成仓？ \\- [ ] 是否保留3成机动资金？\n\n**风险控制** ： \\- [ ] 是否严格止损？ \\- [ ] 是否保护本金？ \\- [ ] 是否控制回撤？\n\n* * *\n\n## 附录：二十六位游资智慧精华\n\n### 附录A：炒股养家（情绪周期大师）\n\n  * **核心思想** ：心法决定境界，情绪周期是根本\n  * **可执行规则** ：✅ 市场永远是对的；✅ 买在分歧，卖在一致；✅ 控制回撤比追求暴利更重要\n\n\n\n### 附录B：Asking（龙头战法大师）\n\n  * **核心思想** ：只做龙头，不做跟风\n  * **可执行规则** ：✅ 只做龙头；✅ 买在分歧，卖在一致；✅ 严格止损\n\n\n\n### 附录C：职业炒手（交易本质大师）\n\n  * **核心思想** ：理解交易本质，弱市空仓\n  * **可执行规则** ：✅ 理解交易本质；✅ 弱市空仓；✅ 严格止损\n\n\n\n### 附录D：赵老哥（龙头战法大师）\n\n  * **核心思想** ：只做龙头，不做跟风\n  * **可执行规则** ：✅ 只做龙头；✅ 买在分歧，卖在一致；✅ 严格止损\n\n\n\n### 附录E：徐翔（情绪周期大师）\n\n  * **核心思想** ：心法决定境界，情绪周期是根本\n  * **可执行规则** ：✅ 市场永远是对的；✅ 买在分歧，卖在一致；✅ 控制回撤比追求暴利更重要\n\n\n\n### 附录F：龙飞虎（情绪周期大师）\n\n  * **核心思想** ：心法决定境界，情绪周期是根本\n  * **可执行规则** ：✅ 市场永远是对的；✅ 买在分歧，卖在一致；✅ 控制回撤比追求暴利更重要\n\n\n\n### 附录G：小鳄鱼（新生代游资）\n\n  * **核心思想** ：只做龙头，不做跟风\n  * **可执行规则** ：✅ 只做龙头；✅ 买在分歧，卖在一致；✅ 严格止损\n\n\n\n### 附录H：92科比（新生代游资）\n\n  * **核心思想** ：只做龙头，不做跟风\n  * **可执行规则** ：✅ 只做龙头；✅ 买在分歧，卖在一致；✅ 严格止损\n\n\n\n### 附录I：瑞鹤仙（新生代游资）\n\n  * * ","subcategory":null,"content":"# 交易体系_融合版（26位游资智慧 + 个人复盘理论）\n\n> **说明书** ：本文档融合了**26位游资的智慧精华** 和**你自己的复盘理论** ，形成一个完整的、可执行的交易体系。每个章节都包含：判断标准、查看方法、案例演示、可执行规则、实战操作记录表。\n\n* * *\n\n## 📋 使用说明\n\n### 如何使用本文档？\n\n  1. **打印出来** ：建议打印成小册子，放在电脑旁\n  2. **一步步对照** ：每个操作都按照文档中的步骤执行\n  3. **打勾确认** ：每个步骤完成后，在\"✅\"处打勾\n  4. **记录结果** ：在\"📝 记录\"处填写实际数据\n  5. **定期复习** ：每周复习一次，确保熟练掌握\n\n\n\n### 文档结构\n\n  * **第一章** ：情绪周期判断（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第二章** ：龙头股识别与分类（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第三章** ：题材理解（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第四章** ：选股阶段（超详细）- 融合26位游资智慧\n  * **第五章** ：买入阶段（超详细）- 融合26位游资智慧\n  * **第六章** ：持有阶段（超详细）- 融合26位游资智慧\n  * **第七章** ：卖出阶段（超详细）- 融合26位游资智慧\n  * **第八章** ：仓位管理（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第九章** ：风险控制（超详细）- 融合26位游资智慧\n  * **第十章** ：心态管理（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第十一章** ：复盘推演（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第十二章** ：交易模式（超详细）- 融合龙行刺心法 + 个人复盘\n  * **第十三章** ：大盘情绪监控（超详细）- 融合个人复盘\n  * **第十四章** ：可执行规则检查清单（超详细）\n\n\n\n* * *\n\n## 第一章：情绪周期判断（超详细操作）\n\n### 📊 判断标准（量化指标）\n\n#### 1\\. 短线情绪周期（龙行刺标准）\n\n  * **01结束** ：主线龙头断板\n  * **02混沌** ：龙头断板，题材四处开花，资金迷茫\n  * **03确认** ：混沌后，主线题材卡位确认\n  * **04加速** ：主线加速，并出现连板跟风助攻\n  * **05高潮** ：板块全面发酵，板块内连板增多，这个时候跟风往往是卖点\n\n\n\n#### 2\\. 中级情绪周期（龙行刺标准）\n\n  * **01开启** ：指数连续下跌后企稳 + 出现打破空间的连板\n  * **02发酵** ：指数横盘震荡 + 空间再次受到压制\n  * **03高潮** ：情绪与指数共振向上 + 连板空间打开，并且数量增多\n  * **04主跌** ：情绪与指数共振下杀 + 空间受到压制，连板数量减少\n\n\n\n#### 3\\. 情绪周期判断标准（个人复盘标准）\n\n  * **冰点** ：昨日涨停板数量 ≤ 10家 + 跌幅榜-9%以上个股 ≥ 6家\n  * **复苏** ：昨日涨停板数量 11-30家 + 跌幅榜-9%以上个股 ≤ 5家\n  * **高潮** ：昨日涨停板数量 ≥ 30家 + 板块强联动\n  * **退潮** ：昨日涨停板急剧减少 + 跌幅榜增加\n\n\n\n#### 4\\. 情绪指标（个人复盘标准）\n\n  * **最高空间板** ：当前市场最高连板数量\n  * **次高板** ：当前市场次高连板数量\n  * **天地板** ：个股从涨停到跌停\n  * **地天板** ：个股从跌停到涨停\n\n\n\n* * *\n\n### 🔍 具体查看方法（一步步教）\n\n#### 步骤1：查看昨日涨停板数量\n\n  1. 打开**东方财富网** （www.eastmoney.com）\n  2. 点击顶部菜单 **\"行情中心\"** → **\"涨跌停\"**\n  3. 查看 **\"涨停\"** 标签页\n  4. 记录：**昨日涨停板数量 = _____ 家**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：昨日涨停板数量 = _____ 家\n\n#### 步骤2：查看昨日跌幅榜情况\n\n  1. 在东方财富网 **\"涨跌停\"** 页面\n  2. 查看 **\"跌停\"** 标签页\n  3. 记录：**昨日跌幅榜-9%以上个股 = _____ 家**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：昨日跌幅榜-9%以上个股 = _____ 家\n\n#### 步骤3：查看板块联动性\n\n  1. 在东方财富网 **\"行情中心\"** → **\"板块热点\"**\n  2. 查看 **\"涨停个股所属板块\"**\n  3. 统计：同一板块涨停个股数量\n  4. 记录：**板块联动性 = _____（强/弱/无）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：板块联动性 = _____（强/弱/无）\n\n#### 步骤4：查看最高空间板、次高板、天地板、地天板\n\n  1. 打开**东方财富网** **\"行情中心\"** → **\"涨跌停\"**\n  2. 查看 **\"涨停\"** 标签页，找出最高连板数量\n  3. 查看 **\"跌停\"** 标签页，找出天地板、地天板个股\n  4. 记录：\n  5. **最高空间板 = _____ 板**\n  6. **次高板 = _____ 板**\n  7. **天地板 = _____（个股名称）**\n  8. **地天板 = _____（个股名称）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：最高空间板 = **___ 板，次高板 = ****_板，天地板 =_** __，地天板 = _____\n\n#### 步骤5：综合判断情绪周期\n\n  1. 根据步骤1-4的记录\n  2. 对照\"判断标准（量化指标）\"\n  3. 判断：**情绪周期 = _____（01结束/02混沌/03确认/04加速/05高潮 或 01开启/02发酵/03高潮/04主跌）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：情绪周期 = _____（01结束/02混沌/03确认/04加速/05高潮 或 01开启/02发酵/03高潮/04主跌）\n\n* * *\n\n### 📖 案例演示\n\n#### 案例1：短线情绪周期 - 混沌期\n\n  * **时间** ：2026年6月14日\n  * **昨日涨停板数量** ：15家（复苏）\n  * **昨日跌幅榜** ：8家（恐慌）\n  * **板块联动性** ：人工智能板块3家涨停（强联动）\n  * **最高空间板** ：5板（中国科传）\n  * **情绪周期判断** ：02混沌（龙头断板，题材四处开花，资金迷茫）\n  * **操作策略** ：低位试错（首板、二板接力）\n\n\n\n#### 案例2：中级情绪周期 - 开启期\n\n  * **时间** ：2026年6月15日\n  * **指数** ：连续下跌后企稳\n  * **空间板** ：出现打破空间的连板（8板）\n  * **情绪周期判断** ：01开启（指数连续下跌后企稳 + 出现打破空间的连板）\n  * **操作策略** ：指数共振板（首日共振板或先于指数企稳共振板）\n\n\n\n#### 案例3：情绪周期 - 高潮期\n\n  * **时间** ：2026年6月16日\n  * **昨日涨停板数量** ：45家（高潮）\n  * **昨日跌幅榜** ：2家（正常）\n  * **板块联动性** ：人工智能板块8家涨停（强联动）\n  * **情绪周期判断** ：05高潮（板块全面发酵，板块内连板增多）\n  * **操作策略** ：龙头格局（第一三周期的时候龙头可以多格局到首阴和反包）\n\n\n\n* * *\n\n### ✅ 可执行规则\n\n#### 规则1：短线情绪周期 - 02混沌期 → 低位试错\n\n  * ✅ **判断标准** ：龙头断板，题材四处开花，资金迷茫\n  * ✅ **操作步骤** ：\n  * 查看昨日涨停板数量\n  * 查看昨日跌幅榜情况\n  * 查看板块联动性\n  * 判断情绪周期\n  * 执行：低位试错（首板、二板接力）\n\n\n\n#### 规则2：中级情绪周期 - 01开启期 → 指数共振板\n\n  * ✅ **判断标准** ：指数连续下跌后企稳 + 出现打破空间的连板\n  * ✅ **操作步骤** ：\n  * 查看指数走势\n  * 查看空间板数量\n  * 判断情绪周期\n  * 执行：指数共振板（首日共振板或先于指数企稳共振板）\n\n\n\n#### 规则3：情绪周期 - 高潮期 → 龙头格局\n\n  * ✅ **判断标准** ：板块全面发酵，板块内连板增多\n  * ✅ **操作步骤** ：\n  * 查看昨日涨停板数量\n  * 查看板块联动性\n  * 判断情绪周期\n  * 执行：龙头格局（第一三周期的时候龙头可以多格局到首阴和反包）\n\n\n\n* * *\n\n### 📝 实战操作记录表\n\n日期 | 昨日涨停板 | 跌幅榜-9%以上 | 板块联动性 | 最高空间板 | 情绪周期 | 操作策略 | 实际仓位  \n---|---|---|---|---|---|---|---  \n6月14日 | 15家 | 8家 | 强 | 5板 | 02混沌 | 低位试错 | _____  \n6月15日 | _____ | _____ | _____ | _____ | 01开启 | 指数共振板 | _____  \n6月16日 | 45家 | 2家 | 强 | _____ | 05高潮 | 龙头格局 | _____  \n  \n* * *\n\n## 第二章：龙头股识别与分类（超详细操作）\n\n### 📊 判断标准（量化指标）\n\n#### 1\\. 龙头股定义（龙行刺标准）\n\n  * **定义** ：某一时期在股票市场的炒作中对同行业板块的其他股票具有影响和号召力的股票，它的涨跌往往对其他行业板块股票的涨跌起引导和示范作用\n\n\n\n#### 2\\. 龙头分类（龙行刺标准）\n\n  * **一字龙** ：未经过换手一路一字涨停的个股\n  * **换手龙** ：一路换手涨停，最具时常参与价值\n  * **卡位龙** ：有篡位或者取代的意思，有时候龙头抛压太大或者后期认可度不高，或者龙头被停牌，或者当时情绪太差，但板块持续发酵，会有龙头来卡位\n  * **日内龙** ：日内最先涨停的个股\n  * **先锋龙** ：先于板块涨停的个股\n  * **板块龙** ：板块中空间最高或者是最早涨停的个股\n  * **分支龙** ：主线中出现其他题材的板块龙头\n  * **反包龙** ：断板后再次反包涨停\n  * **趋势龙** ：一般为趋势股，表现为不停涨，涨不停\n  * **补涨龙** ：大级别风口后期，龙头高高在上，市场资金恐高或者不愿意不敢再去高位接力，板块低位出现的未经炒作的个股\n\n\n\n#### 3\\. 龙头股识别标准（个人复盘标准）\n\n  * **涨幅最大** ：板块内涨幅最大\n  * **涨停最早** ：板块内涨停最早\n  * **人气最高** ：板块内人气最高\n\n\n\n* * *\n\n### 🔍 具体查看方法（一步步教）\n\n#### 步骤1：查看涨幅榜前50名\n\n  1. 打开**东方财富网** （www.eastmoney.com）\n  2. 点击 **\"行情中心\"** → **\"沪深涨幅榜\"**\n  3. 查看 **前50名** 个股\n  4. 记录：**涨幅榜前50名个股 = _____（列出股票代码和名称）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：涨幅榜前50名个股 = _____\n\n#### 步骤2：查看板块联动性\n\n  1. 在东方财富网 **\"行情中心\"** → **\"板块热点\"**\n  2. 查看 **涨幅榜前50名个股所属板块**\n  3. 统计：同一板块个股数量\n  4. 记录：**板块联动性 = _____（强/弱/无）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：板块联动性 = _____（强/弱/无）\n\n#### 步骤3：选择龙头股\n\n  1. 根据步骤2的板块联动性\n  2. 选择 **板块内涨幅最大、涨停最早、人气最高** 的个股\n  3. 记录：**龙头股 = _____（股票代码和名称）**\n  4. 记录：**龙头分类 = _____（一字龙/换手龙/卡位龙/日内龙/先锋龙/板块龙/分支龙/反包龙/趋势龙/补涨龙）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：龙头股 = **___ （股票代码和名称），龙头分类 = **___\n\n#### 步骤4：查看龙头股的地位\n\n  1. 打开 **\"同花顺\"** 或 **\"东方财富\"** 软件\n  2. 输入龙头股 **股票代码**\n  3. 查看 **日K线图**\n  4. 检查：股价是否在5日线、10日线、20日线上方？\n  5. 记录：**龙头股地位 = _____（高/中/低）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：龙头股地位 = _____（高/中/低）\n\n* * *\n\n### 📖 案例演示\n\n#### 案例1：选择换手龙\n\n  * **时间** ：2026年6月14日\n  * **板块** ：人工智能\n  * **板块内个股** ：\n  * 国脉科技（一字龙）：8板，未经过换手\n  * 浙江世宝（换手龙）：10板，一路换手涨停\n  * **龙头分类** \n  2. 判断：涨幅空间\n  3. 记录：**题材涨幅空间 = _____（翻倍起步/大于50%/10-30%）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：题材涨幅空间 = _____（翻倍起步/大于50%/10-30%）\n\n#### 步骤3：查看题材周期\n\n  1. 打开**东方财富网** **\"行情中心\"** → **\"板块热点\"**\n  2. 查看 **当前热点题材的周期**\n  3. 判断：启动期/发酵期/加速期/高潮期/分歧期/反包期/退潮期/冰点期\n  4. 记录：**题材周期 = _____（启动期/发酵期/加速期/高潮期/分歧期/反包期/退潮期/冰点期）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：题材周期 = _____（启动期/发酵期/加速期/高潮期/分歧期/反包期/退潮期/冰点期）\n\n#### 步骤4：选择题材\n\n  1. 根据步骤1-3的判断\n  2. 选择：**当前热点题材 = _____（题材名称）**\n  3. 记录：**选择题材 = _____（题材名称）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：选择题材 = _____（题材名称）\n\n* * *\n\n### 📖 案例演示\n\n#### 案例1：大题材 - 基建地产\n\n  * **时间** ：2026年6月14日\n  * **题材分类** ：大题材（政策类）\n  * **涨幅空间** ：翻倍起步，通常会有二波\n  * **题材周期** ：高潮期\n  * **操作策略** ：龙头格局（浙江建投）\n\n\n\n#### 案例2：中题材 - 中药板块\n\n  * **时间** ：2026年6月15日\n  * **题材分类** ：中题材（大题材细分）\n  * **涨幅空间** ：以周为单位，龙头涨幅空间大于50%\n  * **题材周期** ：发酵期\n  * **操作策略** ：龙头接力（龙津药业）\n\n\n\n#### 案例3：小题材 - 材料涨价\n\n  * **时间** ：2026年6月16日\n  * **题材分类** ：小题材（涨价）\n  * **涨幅空间** ：以日为单位，涨幅空间在10-30%\n  * **题材周期** ：启动期\n  * **操作策略** ：首板或二板接力\n\n\n\n* * *\n\n### ✅ 可执行规则\n\n#### 规则1：选择大题材 → 龙头格局\n\n  * ✅ **判断标准** ：政策类、科技类、基因类\n  * ✅ **操作步骤** ：\n  * 查看题材分类\n  * 判断：大题材/中题材/小题材\n  * 执行：龙头格局\n\n\n\n#### 规则2：选择中题材 → 龙头接力\n\n  * ✅ **判断标准** ：大题材细分\n  * ✅ **操作步骤** ：\n  * 查看题材分类\n  * 判断：大题材/中题材/小题材\n  * 执行：龙头接力\n\n\n\n#### 规则3：选择小题材 → 首板或二板接力\n\n  * ✅ **判断标准** ：炒冷饭、衍生分支、涨价\n  * ✅ **操作步骤** ：\n  * 查看题材分类\n  * 判断：大题材/中题材/小题材\n  * 执行：首板或二板接力\n\n\n\n* * *\n\n### 📝 实战操作记录表\n\n日期 | 题材分类 | 涨幅空间 | 题材周期 | 选择题材 | 操作策略  \n---|---|---|---|---|---  \n6月14日 | 大题材 | 翻倍起步 | 高潮期 | 基建地产 | 龙头格局  \n6月15日 | 中题材 | 大于50% | 发酵期 | 中药板块 | 龙头接力  \n6月16日 | 小题材 | 10-30% | 启动期 | 材料涨价 | 首板或二板接力  \n  \n* * *\n\n## 第四章：选股阶段（超详细操作）\n\n### 📊 判断标准（量化指标）\n\n#### 1\\. 均线系统\n\n  * **多头排列** ：5日线 > 10日线 > 20日线 > 60日线\n  * **均线粘合** ：5日线、10日线、20日线相差 ≤ 5%\n  * **突破均线** ：股价站上5日线、10日线、20日线\n\n\n\n#### 2\\. 成交量\n\n  * **放量** ：成交量 ≥ 5日均量的1.5倍\n  * **缩量** ：成交量 ≤ 5日均量的0.7倍\n  * **温和放量** ：成交量 = 5日均量的1.2-1.5倍\n\n\n\n#### 3\\. 突破关键阻力位\n\n  * **突破前期高点** ：股价创近期新高\n  * **突破平台** ： 易前写交易计划，交易中严格执行，交易后复盘总结\n\n\n\n#### 2\\. 控制回撤比追求暴利更重要（龙行刺标准）\n\n  * **控制回撤** ：单日回撤 ≤ -3%，单周回撤 ≤ -5%，单月回撤 ≤ -10%\n  * **追求暴利** ：单日收益 ≥ +10%，单周收益 ≥ +20%，单月收益 ≥ +30%\n\n\n\n#### 3\\. 耐心是交易者最好的朋友（龙行刺标准）\n\n  * **耐心表现** ：空仓等待、持有等待、卖出等待\n  * **耐心策略** ：严格按照交易体系执行，不随意更改\n\n\n\n#### 4\\. 执行计划（龙行刺标准）\n\n  * **计划交易** ：交易计划，交易计划\n  * **执行策略** ：多做静态交易，按照计划执行\n\n\n\n#### 5\\. 习惯空仓（龙行刺标准）\n\n  * **空仓条件** ：没有确定性的买点坚决空仓\n  * **空仓策略** ：没有踏空之说，错过了等待下一次\n\n\n\n#### 6\\. 积极暗示（龙行刺标准）\n\n  * **积极暗示** ：自我鼓励，每天积极暗示自己一定能行\n  * **积极策略** ：推荐书籍《交易心理分析》《知行合一》《止损》《自控力》《认知觉醒：开启自我改变的原动力》\n\n\n\n* * *\n\n### 🔍 具体查看方法（一步步教）\n\n#### 步骤1：交易前写交易计划\n\n  1. 打开 **《模拟交易日志》**\n  2. 填写：**交易前准备** 、**交易计划制定**\n  3. 记录：**交易计划 = _____（已写/未写）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：交易计划 = _____（已写/未写）\n\n#### 步骤2：交易中严格执行\n\n  1. 打开 **\"同花顺\"** 或 **\"东方财富\"** 交易软件\n  2. 查看 **交易计划**\n  3. 检查：是否严格按照交易计划执行？\n  4. 记录：**严格执行 = _____（是/否）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：严格执行 = _____（是/否）\n\n#### 步骤3：交易后复盘总结\n\n  1. 打开 **《模拟交易复盘》**\n  2. 填写：**复盘与总结**\n  3. 记录：**复盘总结 = _____（已写/未写）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：复盘总结 = _____（已写/未写）\n\n#### 步骤4：执行心态管理\n\n  1. 根据步骤1-3的判断\n  2. 对照\"可执行规则\"\n  3. 执行：**继续 或 调整**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：执行 = _____（继续/调整）\n\n* * *\n\n### 📖 案例演示\n\n#### 案例1：战胜\"小明\"\n\n  * **时间** ：2026年6月14日\n  * **\"小明\"表现** ：贪婪（想满仓买入）\n  * **战胜策略** ：交易前写交易计划（买入仓位20%），交易中严格执行（实际买入仓位20%）\n  * **操作策略** ：成功战胜\"小明\"\n\n\n\n#### 案例2：控制回撤比追求暴利更重要\n\n  * **时间** ：2026年6月15日\n  * **控制回撤** ：单日回撤-2.5%（≤-3%）\n  * **追求暴利** ：单日收益+8.5%（≥+10%）\n  * **操作策略** ：优先控制回撤，不追求暴利\n\n\n\n#### 案例3：耐心是交易者最好的朋友\n\n  * **时间** ：2026年6月16日\n  * **耐心表现** ：空仓等待（市场情绪冰点）\n  * **耐心策略** ：严格按照交易体系执行（空仓等待），不随意更改\n  * **操作策略** ：成功保持耐心\n\n\n\n* * *\n\n### ✅ 可执行规则\n\n#### 规则1：战胜\"小明\" → 交易前写交易计划，交易中严格执行，交易后复盘总结\n\n  * ✅ **判断标准** ：交易前写交易计划，交易中严格执行，交易后复盘总结\n  * ✅ **操作步骤** ：\n  * 交易前写交易计划\n  * 交易中严格执行\n  * 交易后复盘总结\n  * 执行：战胜\"小明\"\n\n\n\n#### 规则2：控制回撤比追求暴利更重要 → 优先控制回撤\n\n  * ✅ **判断标准** ：控制回撤比追求暴利更重要\n  * ✅ **操作步骤** ：\n  * 计算：单日回撤、单周回撤、单月回撤\n  * 检查：是否超过限制？\n  * 执行：优先控制回撤\n\n\n\n#### 规则3：耐心是交易者最好的朋友 → 严格按照交易体系执行\n\n  * ✅ **判断标准** ：严格按照交易体系执行\n  * ✅ **操作步骤** ：\n  * 查看交易体系\n  * 检查：是否严格按照交易体系执行？\n  * 执行：保持耐心\n\n\n\n#### 规则4：执行计划 → 计划交易，交易计划\n\n  * ✅ **判断标准** ：多做静态交易，按照计划执行\n  * ✅ **操作步骤** ：\n  * 交易前写交易计划\n  * 交易中严格执行\n  * 执行：计划交易，交易计划\n\n\n\n#### 规则5：习惯空仓 → 没有确定性的买点坚决空仓\n\n  * ✅ **判断标准** ：没有确定性的买点坚决空仓\n  * ✅ **操作步骤** ：\n  * 查看市场情绪\n  * 查看指数气氛\n  * 判断：是否有确定性的买点？\n  * 执行：习惯空仓\n\n\n\n#### 规则6：积极暗示 → 自我鼓励，每天积极暗示自己一定能行\n\n  * ✅ **判断标准** ：自我鼓励，每天积极暗示自己一定能行\n  * ✅ **操作步骤** ：\n  * 交易前积极暗示\n  * 交易中积极暗示\n  * 交易后积极暗示\n  * 执行：积极暗示\n\n\n\n* * *\n\n### 📝 实战操作记录表\n\n日期 | 交易计划 | 严格执行 | 复盘总结 | 心态管理 | 操作策略  \n---|---|---|---|---|---  \n6月14日 | 已写 | 是 | 已写 | 战胜\"小明\" | 继续  \n6月15日 | 已写 | 是 | 已写 | 控制回撤 | 继续  \n6月16日 | 已写 | 是 | 已写 | 保持耐心 | 继续  \n  \n* * *\n\n## 第十一章：复盘推演（超详细操作）\n\n### 📊 判断标准（量化指标）\n\n#### 1\\. 复盘（龙行刺标准）\n\n  * **复盘定义** ：复盘是复习今天的盘面信息，了解现在情绪周期阶段，指数位置和题材周期，对应的主线热点和分支热点，龙头与补涨，推演明天的市场预期，震荡、加速或是分歧，给到一个预期，然后对应的操作计划该怎么去执行\n\n\n\n#### 2\\. 复盘流程（龙行刺标准）\n\n  * **指数状态** ：高潮、衰退、分歧、震荡\n  * **情绪状态** ：启动、发酵、加速、高潮、分歧、反包、退潮、冰点\n  * **情绪指标** ：最高空间板-次高板-天地板-地天板\n  * **情绪周期** ：分歧、混沌、启动、确认、加速、高潮、分歧\n  * **主流板块树立** ：判断该板块走到什么位置了，是分歧还是加速\n  * **锁定交易目标** ：主线龙、主线分支龙、主线前排跟风、主线中军票、各分支代表龙头、前期有空间代表性的龙头\n  * **推演交易方案** ：目标个股第二天出现哪种情况我会动手，动手条件是什么，仓位怎么上\n\n\n\n* * *\n\n### 🔍 具体查看方法（一步步教）\n\n#### 步骤1：查看指数状态\n\n  1. 打开**东方财富网** 查看 **上证指数** 和 **创业板指** 实时走势\n  2. 判断：高潮/衰退/分歧/震荡\n  3. 记录：**指数状态 = _____（高潮/衰退/分歧/震荡）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：指数状态 = _____（高潮/衰退/分歧/震荡）\n\n#### 步骤2：查看情绪状态\n\n  1. 查看 **昨日涨停板数量**\n  2. 查看 **昨日跌幅榜情况**\n  3. 判断：启动/发酵/加速/高潮/分歧/反包/退潮/冰点\n  4. 记录：**情绪状态 = _____（启动/发酵/加速/高潮/分歧/反包/退潮/冰点）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：情绪状态 = _____（启动/发酵/加速/高潮/分歧/反包/退潮/冰点）\n\n#### 步骤3：查看情绪指标\n\n  1. 查看 **最高空间板**\n  2. 查看 **次高板**\n  3. 查看 **天地板**\n  4. 查看 **地天板**\n  5. 记录：**情绪指标 = 最高空间板** ___ 板，次高板**** _板，天地板_** __，地天板_____**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：情绪指标 = 最高空间板** ___ 板，次高板**** _板，天地板_** __，地天板_____\n\n#### 步骤4：查看情绪周期\n\n  1. 根据步骤1-3的判断\n  2. 判断：分歧/混沌/启动/确认/加速/高潮/分歧\n  3. 记录：**情绪周期 = _____（分歧/混沌/启动/确认/加速/高潮/分歧）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：情绪周期 = _____（分歧/混沌/启动/确认/加速/高潮/分歧）\n\n#### 步骤5：查看主流板块树立\n\n  1. 打开**东方财富网** **\"行情中心\"** → **\"板块热点\"**\n  2. 查看 **当前热点题材**\n  3. 判断：该板块走到什么位置了，是分歧还是加速\n  4. 记录：**主流板块 =**___ （板块名称），板块位置 = **___（分歧/加速）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：主流板块 = **___ （板块名称），板块位置 = **___（分歧/加速）\n\n#### 步骤6：锁定交易目标\n\n  1. 根据步骤5的主流板块\n  2. 选择：主线龙、主线分支龙、主线前排跟风、主线中军票、各分支代表龙头、前期有空间代表性的龙头\n  3. 记录：**交易目标 = _____（股票代码和名称）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：交易目标 = _____（股票代码和名称）\n\n#### 步骤7：推演交易方案\n\n  1. 根据步骤6的交易目标\n  2. 推演：目标个股第二天出现哪种情况我会动手，动手条件是什么，仓位怎么上\n  3. 记录：**交易方案 = _____（详细方案）**\n\n\n\n✅ 已完成 ✅ 未完成\n\n📝 记录：交易方案 = _____（详细方案）\n\n* * *\n\n### 📖 案例演示\n\n#### 案例1：复盘推演（11/29）\n\n  * **日期** ：2026年11月29日\n  * **空间梯队** ：中国科传6板，通润装备5板\n  * **主线** ：国改（中国科传6）\n  * **分支** ：医药（特一药业2）、地产（中国武夷4、中交地产4）、检测（毅昌科技2、泰林生物2）、旅游（峨眉山A2）\n  * **情绪周期** ：加速高潮\n  * **情绪指标** ：中国科传、中交地产、中国武夷\n  * **市场表现** ：指数与情绪共振高潮，国改、地产表现强势，特一、众生带领医药全线穿越，日内热点检测、旅游\n  * **明日预期** ：前排继续加速，后排跟风掉队，紧跟核心，去弱留强\n  * **持有个股** ：中国科传\n  * **交易计划** ：\n  * 情绪指标正反馈的情况下，中国科传继续锁仓\n  * 情绪指标出现负反馈，关注四板的回封卡位，给到三成回封仓位\n\n\n\n* * *\n\n### ✅ 可执行规则\n\n#### 规则1：复盘 → 复习今天的盘面信息\n\n  * ✅ **判断标准** ：复盘是复习今天的盘面信息\n  * ✅ **操作步骤** ：\n  * 查看指数状态\n  * 查看情绪状态\n  * 查看情绪指标\n  * 查看情绪周期\n  * 查看主流板块树立\n  * 锁定交易目标\n  * 推演交易方案\n  * 执行：复盘\n\n\n\n#### 规则2：推演交易方案 → 目标个股第二天出现哪种情况我会动手\n\n  * ✅ **判断标准** ：推演交易方案\n  * ✅ **操作步骤** ：\n  * 锁定交易目标\n  * 推演：目标个股第二天出现哪种情况我会动手\n  * 推演：动手条件是什么\n  * 推演：仓位怎么上\n  * 执行：推演交易方案\n\n\n\n* * *\n\n### 📝 实战操作记录表\n\n日期 | 指数状态 | 情绪状态 | 情绪指标 | 情绪周期 | 主流板块 | 交易目标 | 交易方案  \n---|---|---|---|---|---|---|---  \n11月29日 | 高潮 | 加速 | 中国科传6板 | 加速高潮 | 国改 | 中国科传 | 继续锁仓  \n_____ | _____ | _____ | _____ | _____ | _____ | _____ | _____  \n  \n* * *\n\n## 第十二章：交易模式（超详细操作）\n\n### 📊 判断标准（量化指标）\n\n#### 1\\. 核心思想（龙行刺标准）\n\n  * **买在分歧转一致-弱转强** ：卖在一致转分歧-强转弱\n\n\n\n#### 2\\. 交易模式（龙行刺标准）\n\n  * **连板接力** ：分歧先手（三成）、高开竞价/打板（五成）\n  * **反包二波** ：底分型支撑打板（五成）\n  * **一字板首开** ：平开或爆量上板（三成）\n  * **切换板** ：首板（三成）、二板弱转强（五成）\n  * **地天板*           if (bestIdx > 0) {
            topHtml = html.substring(0, bestIdx);
            midHtml = '<div id="detailMidAd" style="margin:30px auto;text-align:center;min-height:250px;display:flex;align-items:center;justify-content:center;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg-soft);border-radius:8px"></div>';
            botHtml = html.substring(bestIdx);
          } else {
            topHtml = html; midHtml = ''; botHtml = '';
          }
        } else {
          topHtml = html;
        }
        
        const adLabel = '<div style="font-size:11px;color:var(--text-mute);margin-bottom:4px;letter-spacing:1px">— 广告 —</div>';
        
        d.innerHTML = `<div class="detail-content"><button class="mobile-back" onclick="goBack()">← 返回列表</button><h1 class="detail-title">${a.title}</h1><div class="detail-meta">${cn}${sn} · ${a.docType||'笔记'}</div><div id="detailTopAd" style="margin:16px auto;text-align:center;min-height:60px">${adLabel}</div>${topHtml}${midHtml}${botHtml}<div id="detailBottomAd" style="margin:30px auto;text-align:center;min-height:60px">${adLabel}</div></div>`;
      }
      // Load article ads (top/middle/bottom)
        setTimeout(() => {
          if (!a.isPdf && !a.isHtml) {
            loadAdsterra('detailTopAd', '07a2d13b9fb4b43646af5334ff4a60da', 468, 60);
            loadAdsterra('detailBottomAd', '07a2d13b9fb4b43646af5334ff4a60da', 468, 60);
            if ((a.content || '').length > 3000) {
              loadAdsterra('detailMidAd', '3fea37f26fcbda4a0ce245e67d31f438', 300, 250);
            }
          }
        }, 300);
        d.scrollTop = 0;
    }

    function goBack() {
      document.getElementById('listPanel').classList.remove('mobile-hide');
      document.getElementById('detail').classList.remove('mobile-show');
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderList(); return; }
      const res = siteData.articles.filter(a => a.title.toLowerCase().includes(q) || (a.content && a.content.toLowerCase().includes(q)));
      const lc = document.getElementById('listContent');
      document.getElementById('listTitle').textContent = '搜索结果';
      document.getElementById('listCount').textContent = res.length + ' 篇';
      if (!res.length) { lc.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-mute)">未找到相关文章</div>'; return; }
      let h = '';
      res.forEach(a => {
        const pv = a.content ? a.content.substring(0,80).replace(/[#*\n]/g,' ').trim() : (a.isHtml ? '可视化交互内容' : '');
        h += `<div class="note-item" data-id="${a.id}"><div class="note-title"><span class="note-tag ${tagClass(a)}">${tagText(a)}</span><span>${a.title}</span></div><div class="note-preview">${pv}</div></div>`;
      });
      lc.innerHTML = h;
      lc.querySelectorAll('.note-item').forEach(el => el.onclick = () => loadArticle(el.dataset.id));
    });

    renderSidebar();
    renderList();
  
    // Adsterra ad loader
    function loadAdsterra(containerId, key, width, height) {
      var el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = '';
      el.style.width = width + 'px';
      el.style.maxWidth = '100%';
      el.style.height = height + 'px';
      el.style.margin = '20px auto';
      el.style.overflow = 'hidden';
      var ifr = document.createElement('iframe');
      ifr.width = width; ifr.height = height;
      ifr.style.border = 'none'; ifr.style.overflow = 'hidden';
      ifr.setAttribute('scrolling', 'no');
      ifr.setAttribute('frameborder', '0');
      el.appendChild(ifr);
      var doc = ifr.contentWindow ? ifr.contentWindow.document : ifr.contentDocument;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><style>*{margin:0;padding:0}body{overflow:hidden}</style></head><body>');
      doc.write('<scr'+'ipt>window.atOptions={"key":"' + key + '","format":"iframe","height":' + height + ',"width":' + width + ',"params":{}};</scr'+'ipt>');
      doc.write('<scr'+'ipt src="https://pl30122979.effectivecpmnetwork.com/' + key + '/invoke.js"></scr'+'ipt>');
      doc.write('</body></html>');
      doc.close();
    }

    // Download with ad delay
    function downloadWithAd(url) {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 准备下载中...';
      
      // Show ad for 3 seconds before download
      setTimeout(() => {
        window.open(url, '_blank');
        btn.disabled = false;
        btn.textContent = '✅ 下载已开始';
        setTimeout(() => {
          btn.textContent = '📥 再次下载';
        }, 2000);
      }, 3000);
    }
    </script>
</body>
</html>
