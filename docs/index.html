  <style>
    :root {
      --bg: #faf8f4; --bg-elevated: #fff; --bg-subtle: #f3eee5;
      --border: #e3dccd; --border-strong: #c8bfa9;
      --text: #2c241b; --text-soft: #5a5145; --text-mute: #8a8170;
      --accent: #a01a1a; --accent-soft: #a01a1a14;
      --gold: #a07820; --highlight: #fff3a0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px; line-height: 1.65; height: 100vh; overflow: hidden;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    /* Header */
    .header {
      background: var(--bg-elevated); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      height: 52px; padding: 0 16px; flex-shrink: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--text); flex-shrink: 0; }
    .brand-mark { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, var(--accent) 0%, #d63030 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
    .brand-sub { color: var(--text-mute); font-size: 11px; font-weight: 400; margin-left: 2px; }
    .header-search { flex: 1; max-width: 400px; position: relative; }
    .header-search input { width: 100%; height: 34px; border: 1px solid var(--border); background: var(--bg-subtle); border-radius: 17px; padding: 0 14px 0 34px; font-size: 13px; color: var(--text); outline: none; transition: all .15s; }
    .header-search input:focus { border-color: var(--accent); background: var(--bg-elevated); box-shadow: 0 0 0 3px var(--accent-soft); }
    .header-search input::placeholder { color: var(--text-mute); }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; font-size: 14px; }
    .theme-toggle { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 16px; color: var(--text-soft); }
    .theme-toggle:hover { background: var(--bg-subtle); }

    /* 3-panel layout */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 200px; flex-shrink: 0; background: var(--bg-elevated); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 8px; }
    .sidebar-label { color: var(--text-mute); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 8px 10px 4px; }
    .cat-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-soft); transition: all .1s; user-select: none; }
    .cat-item:hover { background: var(--bg-subtle); color: var(--text); }
    .cat-item.active { background: var(--accent); color: #fff; font-weight: 500; }
    .cat-item.active .cat-count { color: #fff; background: rgba(255,255,255,.2); }
    .cat-icon { margin-right: 6px; font-size: 15px; }
    .cat-count { background: var(--bg-subtle); color: var(--text-mute); border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 500; }
    .sub-cats { padding: 2px 0 4px; display: none; }
    .sub-cats.open { display: block; }
    .sub-cat-item { display: flex; align-items: center; gap: 6px; padding: 7px 12px 7px 28px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-soft); transition: all .1s; }
    .sub-cat-item:hover { background: var(--bg-subtle); color: var(--text); }
    .sub-cat-item.active { color: var(--accent); font-weight: 600; }

    /* List panel */
    .list-panel { width: 340px; flex-shrink: 0; background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
    .list-header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 14px 8px; font-size: 12px; color: var(--text-mute); display: flex; align-items: center; justify-content: space-between; }
    .note-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
    .note-item:hover { background: var(--bg-subtle); }
    .note-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 11px; }
    .note-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .note-tag { background: var(--bg-subtle); color: var(--text-soft); border-radius: 8px; padding: 1px 6px; font-size: 10px; font-weight: 500; flex-shrink: 0; }
    .note-tag.viz { color: #1a6fa0; background: #d4eaf5; }
    .note-tag.excel { color: #1a8a3a; background: #d4f5de; }
    .note-tag.mindmap { color: #8a5a1a; background: #f5e8d4; }
    .note-preview { color: var(--text-soft); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Detail */
    .detail { flex: 1; overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }
    .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 40px; color: var(--text-mute); text-align: center; height: 100%; }
    .detail-empty-icon { font-size: 64px; opacity: .3; }
    .detail-content { max-width: 760px; margin: 0 auto; padding: 28px 36px 80px; }
    .detail-title { font-size: 26px; font-weight: 700; color: var(--text); margin: 0 0 8px; letter-spacing: -.5px; }
    .detail-meta { font-size: 12px; color: var(--text-mute); margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .detail-content h1 { font-size: 22px; margin: 32px 0 12px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .detail-content h2 { font-size: 19px; margin: 28px 0 10px; color: var(--accent); }
    .detail-content h3 { font-size: 16px; margin: 20px 0 8px; color: var(--gold); }
    .detail-content p { margin: 10px 0; }
    .detail-content ul, .detail-content ol { padding-left: 24px; margin: 8px 0; }
    .detail-content li { margin: 4px 0; }
    .detail-content blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: var(--bg-subtle); color: var(--text-soft); border-radius: 0 6px 6px 0; }
    .detail-content code { background: var(--bg-subtle); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--accent); }
    .detail-content pre { background: var(--bg-subtle); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); }
    .detail-content pre code { background: none; padding: 0; color: var(--text); }
    .detail-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
    .detail-content th, .detail-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .detail-content th { background: var(--bg-subtle); font-weight: 600; }
    .detail-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .detail-content a { color: var(--accent); text-decoration: none; }
    .detail-content a:hover { text-decoration: underline; }
    .html-frame { width: 100%; height: calc(100vh - 140px); border: none; border-radius: 8px; }

    /* Dark */
    [data-theme="dark"] {
      --bg: #1a1a1a; --bg-elevated: #242424; --bg-subtle: #2a2a2a;
      --border: #3a3a3a; --border-strong: #4a4a4a;
      --text: #e8e0d4; --text-soft: #b0a898; --text-mute: #7a7268;
      --accent: #e05050; --accent-soft: #e0505014;
      --gold: #d4a040;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .list-panel { width: 100%; border-right: none; }
      .detail { display: none; width: 100%; }
      .detail.mobile-show { display: block; }
      .list-panel.mobile-hide { display: none; }
      .mobile-back { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--accent); cursor: pointer; margin-bottom: 12px; }
    }
    @media (min-width: 901px) { .mobile-back { display: none; } }
  
    .download-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102,126,234,0.3);
    }
    .download-btn:active {
      transform: translateY(0);
    }
    [data-theme="dark"] .download-btn {
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
    }
</style>

在分歧转一致-弱转强，卖在一致转分歧-强转弱（反复阅读，必有收获） |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| 手法 | 买点 | 仓位 | 逻辑 | 止损点 |\n| 连板接力 | 分歧低吸 | 三成 | 题材经过爆量分歧，提前预判该题材继续走远，有想象空间，低吸三成 | 次日非弱转强-低开无承接 |\n|  | 高开竞价/打板 | 五成 | 题材经过爆量分歧，次日弱转强带动板块发酵，满仓打板 | 次日非加速-平开/低开 |\n| 反包二波 | 底分型支撑打板 | 五成 | 个股经过洗盘，在0.618取得支撑，调整时间为4-8天，题材再次发酵，前龙走二波 | 跌破支撑 |\n| 一字板首开 | 平开或爆量上板 | 三成 | 龙头昨天首阴分歧，今天一字板个股有补跌风险，但作为次高有空间补涨预期（最好在4进5的时候），次日平开往下杀不过三个点为买点或者是爆量回封打板 | 断板/不及预期 |\n| 切换板 | 首板 | 三成 | 为市场新题材，三成仓位试错 | 不板 |\n|  | 二板弱转强 | 五成 | 判断最高板走弱，新题材次日弱转强满仓 | 非弱转强 |\n| 地天板 | 跟随翘板 | 三成 | 判断次日有分歧预期，但最高或次高仍为一字加速，那么是可以做核按钮的低吸的，必须是快速跌停，个股地位为最高、次高、分支龙头，经过昨天的弱转强或者是爆量分歧更加好 | 地天板失败，次日核按钮 |\n| 同身位低吸 | 低吸 | 两成 | 同为切换板，其中有个股题材为一字加速上去，大单封死，大家都买不到，那么同身位的板块龙是可以跟随打高度的（一般发生在第四板分歧的时候），一般有两次，但不会有第三次 | 断板核按钮 |\n| 可转债 | 竞价 | 三成 | 新题材或者是题材爆发首日，龙头大单封死带动板块效应，可以买可转债 |  |\n| 弱转强错杀低吸 | 回封板 | 三成 | 昨天爆量，今天弱转强，弱转强由于大盘或恐慌炸板是可以低吸的 | 回封失败 |\n| 次高空间接力 | 最高断板，次高低吸 | 二成 | 最高断板，那么受影响，次高昨日加速的板，今天肯定会受情绪影响分歧，犹豫连板不会一次杀完，那么次高是有接力预期的 | 回封失败 |\n| 次新首开 | 情绪有分歧预期 | 三成 | 情绪龙头有分歧预期，并且次新连板高度在六板以下，那么打开当天是可以上三成仓位的，一般次日会换手弱转强，然后第三个板就是卖点 | 不及预期 |\n","isMindmap":false,"docType":"Excel笔记"},{"id":"jiaoyi-01_龙行刺情绪周期交易体系","title":"01_龙行刺情绪周期交易体系","category":"jiao-yi-tixi","subcategory":null,"content":"# 【终极版】龙行刺情绪周期交易体系（超详细实战手册）\n\n> **核心思想**：买在分歧转一致（弱转强），卖在一致转分歧（强转弱）\n> **适用场景**：短线题材炒作、龙头战法、情绪择时\n> **版本**：2025实战修订版（整合26位游资智慧+个人复盘理论）\n\n---\n\n## 📋 使用说明\n\n**这份文档是每个步骤都有详细操作说明的超实战手册！**\n\n- ✅ **每个判断细节都有明确的量化标准**\n- ✅ **每个步骤都有具体的查看方法**\n- ✅ **每个步骤都有详细的执行步骤**\n- ✅ **每个章节都有案例演示**\n- ✅ **每个章节都有实战操作记录表**\n\n**使用方法**：\n1. 打印这份文档，放在电脑旁\n2. 每一步操作前，先查看对应章节\n3. 严格按照文档中的步骤执行\n4. 用不同颜色的笔标记完成情况\n5. 每天复盘时，记录到\"实战操作记录表\"\n\n---\n\n## 目录\n\n1. [情绪周期判断体系](#1-情绪周期判断体系)\n2. [指数气氛判断体系](#2-指数气氛判断体系)\n3. [选股阶段：龙头识别与操作](#3-选股阶段龙头识别与操作)\n4. [买入阶段：9种常用手法详解](#4-买入阶段9种常用手法详解)\n5. [持有阶段：龙头格局与切换](#5-持有阶段龙头格局与切换)\n6. [卖出阶段：卖点判断与执行](#6-卖出阶段卖点判断与执行)\n7. [仓位管理：动态调整策略](#7-仓位管理动态调整策略)\n8. [风险控制：止损与防守](#8-风险控制止损与防守)\n9. [复盘体系：每日-每周-每月](#9-复盘体系每日-每周-每月)\n10. [心态管理：交易心理训练](#10-心态管理交易心理训练)\n11. [题材理解：大-中-小题材分类](#11-题材理解大中小题材分类)\n12. [交易模式：择时-选股-买卖](#12-交易模式择时-选股-买卖)\n13. [龙行刺独家：情绪周期细节](#13-龙行刺独家情绪周期细节)\n14. [实战案例：经典周期复盘](#14-实战案例经典周期复盘)\n15. [错题集与心得](#15-错题集与心得)\n\n---\n\n## 1. 情绪周期判断体系\n\n### 1.1 中级情绪周期（方向性指引）\n\n#### 📊 量化判断标准\n\n| 阶段 | 表现特征 | 量化指标 | 机会策略 | 仓位 | 风险提示 |\n|------|----------|----------|----------|------|----------|\n| **开启** | 1. 指数连续下跌后企稳<br>2. 出现打破空间的连板 | 1. 昨日涨停板数量：≥30家<br>2. 空间板高度：≥6板<br>3. 昨日跌幅榜：≤5家 | 1. 指数共振板（首日共振板或先于指数企稳共振板）<br>2. 分支龙头（情绪加速的空间补涨龙）<br>3. 核心个股的首阴低吸 | 80%-100% | 避免追高旧题材跟风 |\n| **发酵** | 1. 指数横盘震荡<br>2. 空间再次受到压制 | 1. 空间板高度：≤5板<br>2. 连板数量：10-20家<br>3. 昨日跌幅榜：5-10家 | 1. 补涨龙（一阶段的题材低位补涨首板二板）<br>2. 新题材卡位 | 10%-30% | 轮动快，轻仓试错 |\n| **高潮** | 1. 情绪与指数共振向上<br>2. 连板空间打开，并且数量增多 | 1. 空间板高度：≥8板<br>2. 连板数量：≥30家<br>3. 板块涨停：≥10家 | 1. 题材龙接力（这个阶段的题材龙级别越大越往上月共振，围绕核心做）<br>2. 辨识度低吸（分歧低吸或者中军低吸） | 100% | 警惕加速板诱多 |\n| **主跌** | 1. 情绪与指数共振下杀<br>2. 空间受到压制，连板数量减少 | 1. 空间板高度：≤4板<br>2. 连板数量：≤10家<br>3. 昨日跌幅榜：≥15家 | 1. 空仓（亏钱效应严重，空仓是最好的选择）<br>2. 轮动（高度受到压制，做首板或者二板的换手打板） | 1%-10% | 避免接力中位股 |\n\n#### 📝 查看方法\n\n**步骤1：打开东方财富网**\n- 网址：www.eastmoney.com\n- 点击顶部菜单\"行情\" → \"涨跌停\"\n\n**步骤2：查看涨停板数量**\n- 查看\"涨停\"标签页\n- 记录昨日涨停板数量\n- 判断：冰点（≤10家）、复苏（11-30家）、高潮（≥30家）\n\n**步骤3：查看空间板高度**\n- 查看\"涨幅榜\"\n- 记录最高连板数量\n- 判断：冰点（≤3板）、正常（4-5板）、高潮（≥6板）\n\n**步骤4：查看跌幅榜情况**\n- 查看\"跌停\"标签页\n- 记录昨日跌幅榜数量\n- 判断：正常（≤5家）、恐慌（6-15家）、极度恐慌（≥15家）\n\n**步骤5：记录数据**\n- 打开\"大盘情绪监控表.xlsx\"\n- 记录日期、红盘、绿盘、涨停、跌停、炸板率、首板、二板、三板、连板数量\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：打开东方财富网\n- [ ] 步骤2完成：查看涨停板数量（记录：_____家）\n- [ ] 步骤3完成：查看空间板高度（记录：_____板）\n- [ ] 步骤4完成：查看跌幅榜情况（记录：_____家）\n- [ ] 步骤5完成：记录数据到Excel\n\n#### 📖 案例演示\n\n**案例1：中级周期开启阶段（2022年4月）**\n- 涨停板数量：35家 → 判断：高潮\n- 空间板高度：6板（湖南发展） → 判断：突破\n- 跌幅榜：3家 → 判断：正常\n- **操作**：满仓干龙头（湖南发展）\n\n**案例2：中级周期主跌阶段（2022年10月）**\n- 涨停板数量：8家 → 判断：冰点\n- 空间板高度：3板 → 判断：冰点\n- 跌幅榜：18家 → 判断：极度恐慌\n- **操作**：空仓管住手\n\n---\n\n### 1.2 短线情绪周期（操作性策略）\n\n#### 📊 量化判断标准\n\n| 阶段 | 表现特征 | 量化指标 | 机会策略 | 风险提示 |\n|------|----------|----------|----------|----------|\n| **结束** | 主线龙头断板 | 1. 高度压制在3B及以下<br>2. 连板数被压制在个位数<br>3. 次日无脑做高标 | 1. 中位接力补涨（2-3板接力）<br>2. 龙头首阴低吸（中级周期第一、三阶段） | 补涨股次日核按钮 |\n| **混沌** | 龙头断板，题材四处开花，资金迷茫 | 1. 题材散乱<br>2. 资金迷茫 | 1. 中位接力补涨（2-3板接力）<br>2. 龙头反包低吸（中级周期第一、三阶段）<br>3. 低位试错（首板、二板接力） | 试错成本高，成功率低 |\n| **确认** | 混沌后，主线题材卡位确认 | 1. 主线题材卡位<br>2. 资金形成合力 | 龙头接力 | 误判主线导致站错队 |\n| **加速** | 主线加速，并出现连板跟风助攻 | 1. 龙头首次确认加速<br>2. 板块内有连板的助攻 | 1. 龙头接力<br>2. 跟风套利（龙头首次确认加速买不到的时候可以选择龙二套利）<br>3. 老龙反抽（同套利） | 跟风股次日溢价不足 |\n| **高潮** | 板块全面发酵，板块内连板增多 | 1. 板块全面发酵<br>2. 板块内连板增多 | 1. 龙头格局（第一三周期的时候龙头可以多格局到首阴和反包）<br>2. 切换（龙头高潮意味着次日开始分歧，可这个时候注意低位板块） | 跟风股成接盘重灾区 |\n\n#### 📝 查看方法\n\n**步骤1：查看最高空间板**\n- 打开\"涨幅榜\"\n- 查看最高连板数量\n- 记录：_____板\n\n**步骤2：查看次高板**\n- 查看第二高连板数量\n- 记录：_____板\n\n**步骤3：查看天地板-地天板**\n- 查看\"振幅榜\"\n- 记录天地板数量：_____家\n- 记录地天板数量：_____家\n\n**步骤4：判断情绪周期阶段**\n- 根据空间板、次高板、天地板-地天板数量\n- 判断当前处于哪个阶段\n\n**步骤5：记录数据**\n- 打开\"大盘情绪监控表.xlsx\"\n- 记录情绪周期阶段\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：查看最高空间板（记录：_____板）\n- [ ] 步骤2完成：查看次高板（记录：_____板）\n- [ ] 步骤3完成：查看天地板-地天板（记录：天地_____家，地天_____家）\n- [ ] 步骤4完成：判断情绪周期阶段（记录：_________）\n- [ ] 步骤5完成：记录数据到Excel\n\n#### 📖 案例演示\n\n**案例1：短线周期确认阶段（2023年1月）**\n- 最高空间板：6板（通达动力）\n- 次高板：4板\n- 天地板：0家，地天板：1家\n- **判断**：确认阶段\n- **操作**：重仓龙头（通达动力）\n\n**案例2：短线周期高潮阶段（2023年2月）**\n- 最高空间板：7板（鸿博股份）\n- 次高板：5板\n- 板块内连板：≥10家\n- **判断**：高潮阶段\n- **操作**：龙头锁仓，切换低位新题材\n\n---\n\n### 1.3 情绪周期叠加规则（最重要！）\n\n#### ⚠️ 风险警示\n\n**短线情绪周期上在01、02、05阶段是最容易亏钱的阶段**\n- 表现在混沌试错的成本和高潮分歧的后知后觉\n\n**中级情绪周期上在02、04是最容易亏钱的阶段**\n- 表现在轮动非常之快，节奏不好掌握，这个时候一定是不能重仓出击\n\n**双重叠加风险（最危险！）**\n- 当短线周期的混沌阶段 + 中级周期的发酵/主跌阶段\n- 亏钱效应非常炸裂！\n- 可能今天一字涨停，明天就一字跌停\n- **这个时候最好是空仓，或者去做机动性较高的可转债**\n\n#### 📝 查看方法\n\n**步骤1：判断中级情绪周期阶段**\n- 使用\"1.1 中级情绪周期\"的方法\n- 判断当前处于哪个阶段\n\n**步骤2：判断短线情绪周期阶段**\n- 使用\"1.2 短线情绪周期\"的方法\n- 判断当前处于哪个阶段\n\n**步骤3：判断叠加风险**\n- 如果中级周期处于发酵/主跌阶段\n- 并且短线周期处于混沌阶段\n- **立即空仓！**\n\n**步骤4：记录叠加状态**\n- 打开\"大盘情绪监控表.xlsx\"\n- 记录中级周期阶段 + 短线周期阶段\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断中级情绪周期阶段（记录：_________）\n- [ ] 步骤2完成：判断短线情绪周期阶段（记录：_________）\n- [ ] 步骤3完成：判断叠加风险（是否空仓：是/否）\n- [ ] 步骤4完成：记录叠加状态到Excel\n\n---\n\n## 2. 指数气氛判断体系\n\n### 2.1 指数气氛判断\n\n#### 📊 量化判断标准\n\n| 类型 | 特征 | 操作策略 |\n|------|------|----------|\n| **28齐跌** | 1. 上证指数下跌<br>2. 创业板指数下跌<br>3. 涨跌比＜0.5:1 | 空仓观望 |\n| **28齐涨** | 1. 上证指数上涨<br>2. 创业板指数上涨<br>3. 涨跌比＞2:1 | 积极做多 |\n| **28分化** | 1. 上证指数上涨，创业板指数下跌<br>2. 或者相反 | 谨慎操作，关注风格切换 |\n| **小盘股气氛好** | 1. 中证1000指数上涨<br>2. 涨跌比＞1.5:1 | 积极做多小盘股 |\n\n#### 📝 查看方法\n\n**步骤1：打开东方财富网**\n- 网址：www.eastmoney.com\n- 查看首页指数实时行情\n\n**步骤2：查看上证指数**\n- 记录上证指数涨跌幅：_____%\n- 记录上证指数涨跌点数：_____点\n\n**步骤3：查看创业板指数**\n- 记录创业板指数涨跌幅：_____%\n- 记录创业板指数涨跌点数：_____点\n\n**步骤4：计算涨跌比**\n- 查看\"涨跌家数\"\n- 记录上涨家数：_____家\n- 记录下跌家数：_____家\n- 计算涨跌比：上涨家数 ÷ 下跌家数 = _____\n\n**步骤5：判断指数气氛**\n- 根据上证、创业板、涨跌比\n- 判断当前指数气氛类型\n\n**步骤6：记录数据**\n- 打开\"大盘情绪监控表.xlsx\"\n- 记录指数气氛类型\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：打开东方财富网\n- [ ] 步骤2完成：查看上证指数（记录：_____%）\n- [ ] 步骤3完成：查看创业板指数（记录：_____%）\n- [ ] 步骤4完成：计算涨跌比（记录：_____）\n- [ ] 步骤5完成：判断指数气氛（记录：_________）\n- [ ] 步骤6完成：记录数据到Excel\n\n---\n\n## 3. 选股阶段：龙头识别与操作\n\n### 3.1 龙头股定义与特征\n\n#### 📊 龙头股类型\n\n| 类型 | 定义 | 买点 | 卖点 |\n|------|------|------|------|\n| **空间龙** | 市场上连板高度最高的个股 | 爆量分歧日低吸 | 跌破5日线 |\n| **补涨龙** | 主线退潮后低位崛起 | 首板/二板弱转强 | 高度达7板或板块分化 |\n| **反包龙** | 二波突破 | 0.618支撑位首板打板 | 二次断板无承接 |\n| **切换龙** | 新题材卡位 | 板块首次联动首板 | 板块持续性证伪 |\n| **日内龙** | 市场上首先涨停的个股 | 每个板块在某一个阶段，都有一些资金尝试发动行情 | 单日试错为主 |\n| **先手龙** | 突然的利好，导致资金认可，提前涨停启动 | 比板块其它个股领先身位 | 率先启动，相对抛压更小 |\n| **板块龙** | 板块中最先涨停连板身位最高的个股 | 两个都符合的才叫龙，不要求高度 | 板块内最先涨停 |\n| **中军** | 市值超过100亿，交易额在20亿以上的个股 | 一般是大资金的战场 | 容量大，走势稳 |\n\n#### 📝 查看方法\n\n**步骤1：确定主流板块**\n- 使用\"1. 情绪周期判断体系\"的方法\n- 确定当前主流板块\n\n**步骤2：锁定龙头个股**\n- 打开主流板块的涨幅榜\n- 查看哪个股票最先涨停\n- 查看哪个股票连板高度最高\n- 记录龙头个股名称：_________\n\n**步骤3：判断龙头类型**\n- 根据龙头个股的特征\n- 判断属于哪种龙头类型\n\n**步骤4：记录龙头信息**\n- 打开\"捕龙表\"\n- 记录日期、龙头名称、龙头类型、连板高度\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：确定主流板块（记录：_________）\n- [ ] 步骤2完成：锁定龙头个股（记录：_________）\n- [ ] 步骤3完成：判断龙头类型（记录：_________）\n- [ ] 步骤4完成：记录龙头信息到捕龙表\n\n#### 📖 案例演示\n\n**案例1：空间龙（2023年1月）**\n- 主流板块：新能源车\n- 龙头个股：通达动力\n- 龙头类型：空间龙（6板）\n- **操作**：爆量分歧日低吸\n\n**案例2：补涨龙（2023年2月）**\n- 主流板块：AI\n- 龙头个股：鸿博股份\n- 龙头类型：补涨龙（空间龙是汉王科技，鸿博是补涨龙）\n- **操作**：首板/二板弱转强\n\n---\n\n### 3.2 龙头股识别标准（详细）\n\n#### 📊 识别标准\n\n1. **带动板块其他股上涨**\n   - 龙头涨停后，板块内其他股跟随上涨\n   - 板块内涨停家数 ≥ 5家\n\n2. **率先涨停**\n   - 板块内第一个涨停的个股\n   - 具有标志性意义\n\n3. **连板高度最高**\n   - 板块内连板高度最高的个股\n   - 空间板\n\n4. **分歧日承接强**\n   - 爆量分歧日，换手充分\n   - 次日弱转强\n\n5. **板块内中军支撑**\n   - 板块内有中军（大市值、大成交额）\n   - 中军走势稳健\n\n#### 📝 查看方法\n\n**步骤1：打开同花顺**\n- 网址：www.10jqka.com.cn\n- 搜索主流板块名称\n\n**步骤2：查看板块内个股**\n- 查看板块内涨幅榜\n- 查看哪个股票最先涨停\n- 查看哪个股票连板高度最高\n\n**步骤3：查看板块内涨停家数**\n- 查看板块内涨停家数\n- 记录：_____家\n\n**步骤4：判断是否为龙头**\n- 根据\"识别标准\"\n- 判断是否为龙头\n\n**步骤5：记录龙头信息**\n- 打开\"捕龙表\"\n- 记录龙头名称、是否龙头（是/否）\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：打开同花顺\n- [ ] 步骤2完成：查看板块内个股（记录龙头：_________）\n- [ ] 步骤3完成：查看板块内涨停家数（记录：_____家）\n- [ ] 步骤4完成：判断是否为龙头（记录：是/否）\n- [ ] 步骤5完成：记录龙头信息到捕龙表\n\n---\n\n## 4. 买入阶段：9种常用手法详解\n\n### 4.1 手法1：连板接力\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 1. 分歧先手（三成）<br>2. 高开竞价/打板（五成） |\n| **仓位** | 1. 分歧先手：三成<br>2. 高开竞价/打板：五成 |\n| **逻辑** | 1. 分歧先手：题材经过爆量分歧，提前预判该题材继续走远，有想象空间，低吸三成<br>2. 高开竞价/打板：题材经过爆量分歧，次日弱转强带动板块发酵，满仓打板 |\n| **止损点** | 1. 分歧先手：次日非弱转强-低开无承接<br>2. 高开竞价/打板：次日非加速-平开/低开 |\n\n#### 📝 查看方法\n\n**步骤1：判断是否为连板接力**\n- 查看个股是否已经连板\n- 查看个股是否处于分歧日\n- 判断是否为连板接力\n\n**步骤2：判断买点**\n- 如果是分歧先手：低吸三成\n- 如果是高开竞价/打板：打板五成\n\n**步骤3：执行买入**\n- 打开交易软件\n- 输入股票代码\n- 输入买入价格和数量\n- 确认买入\n\n**步骤4：记录交易**\n- 打开\"交易记录表\"\n- 记录日期、股票名称、买点、仓位、逻辑、止损点\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否为连板接力（记录：是/否）\n- [ ] 步骤2完成：判断买点（记录：_________）\n- [ ] 步骤3完成：执行买入（记录：买入价格_____元，数量_____股）\n- [ ] 步骤4完成：记录交易到交易记录表\n\n#### 📖 案例演示\n\n**案例1：分歧先手（2023年1月）**\n- 股票名称：通达动力\n- 买点：6板分歧日\n- 仓位：三成\n- 逻辑：新能源车题材经过爆量分歧，提前预判该题材继续走远\n- 止损点：次日非弱转强-低开无承接\n- **结果**：次日弱转强，盈利30%\n\n---\n\n### 4.2 手法2：反包二波\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 底分型支撑打板（五成） |\n| **仓位** | 五成 |\n| **逻辑** | 个股经过洗盘，在0.618取得支撑，调整时间为4-8天，题材再次发酵，前龙走二波 |\n| **止损点** | 跌破支撑 |\n\n#### 📝 查看方法\n\n**步骤1：判断是否为反包二波**\n- 查看个股是否为前期龙头\n- 查看个股是否在0.618取得支撑\n- 查看调整时间是否为4-8天\n- 判断是否为反包二波\n\n**步骤2：判断买点**\n- 底分型支撑打板\n- 仓位：五成\n\n**步骤3：执行买入**\n- 打开交易软件\n- 输入股票代码\n- 输入买入价格和数量\n- 确认买入\n\n**步骤4：记录交易**\n- 打开\"交易记录表\"\n- 记录日期、股票名称、买点、仓位、逻辑、止损点\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否为反包二波（记录：是/否）\n- [ ] 步骤2完成：判断买点（记录：_________）\n- [ ] 步骤3完成：执行买入（记录：买入价格_____元，数量_____股）\n- [ ] 步骤4完成：记录交易到交易记录表\n\n---\n\n### 4.3 手法3：一字板首开\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 平开或爆量上板（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 龙头昨天首阴分歧，今天一字板个股有补跌风险，但作为次高有空间补涨预期（最好在4进5的时候），次日平开往下杀不过三个点为买点或者是爆量回封打板 |\n| **止损点** | 断板/不及预期 |\n\n---\n\n### 4.4 手法4：切换板\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 首板（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 为市场新题材，三成仓位试错 |\n| **止损点** | 不板 |\n\n---\n\n### 4.5 手法5：地天板\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 跟随翘板（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 判断次日有分歧预期，但最高或次高仍为一字加速，那么是可以做核按钮的低吸的，必须是快速跌停，个股地位为最高、次高、分支龙头，经过昨天的弱转强或者是爆量分歧更加好 |\n| **止损点** | 地天板失败，次日核按钮 |\n\n---\n\n### 4.6 手法6：同身位低吸\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 低吸（两成） |\n| **仓位** | 两成 |\n| **逻辑** | 同为切换板，其中有个股题材为一字加速上去，大单封死，大家都买不到，那么同身位的板块龙是可以跟随打高度的（一般发生在第四板分歧的时候），一般有两次，但不会有第三次 |\n| **止损点** | 断板核按钮 |\n\n---\n\n### 4.7 手法7：可转债\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 竞价（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 新题材或者是题材爆发首日，龙头大单封死带动板块效应，可以买可转债 |\n| **止损点** | 正股炸板 |\n\n---\n\n### 4.8 手法8：弱转强错杀低吸\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 回封板（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 昨天爆量，今天弱转强，弱转强由于大盘或恐慌炸板是可以低吸的 |\n| **止损点** | 回封失败 |\n\n---\n\n### 4.9 手法9：次高空间接力\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 最高断板，次高低吸（两成） |\n| **仓位** | 两成 |\n| **逻辑** | 最高断板，那么受影响，次高昨日加速的板，今天肯定会受情绪影响分歧，犹豫连板不会一次杀完，那么次高是有接力预期的 |\n| **止损点** | 回封失败 |\n\n---\n\n### 4.10 手法10：次新首开\n\n#### 📊 操作细节\n\n| 项目 | 内容 |\n|------|------|\n| **买点** | 情绪有分歧预期（三成） |\n| **仓位** | 三成 |\n| **逻辑** | 情绪龙头有分歧预期，并且次新连板高度在六板以下，那么打开当天是可以上三成仓位的，一般次日会换手弱转强，然后第三个板就是卖点 |\n| **止损点** | 不及预期 |\n\n---\n\n## 5. 持有阶段：龙头格局与切换\n\n### 5.1 龙头格局条件\n\n#### 📊 格局条件\n\n1. **中级周期第一阶段（开启）**\n   - 龙头可以多格局到首阴和反包\n   - 不预测断板\n\n2. **中级周期第三阶段（高潮）**\n   - 龙头可以多格局到首阴和反包\n   - 不预测断板\n\n3. **龙头首次阴线**\n   - 可以低吸\n   - 等待反包\n\n4. **龙头反包**\n   - 可以格局到二波结束\n   - 跌破5日线再卖\n\n#### 📝 查看方法\n\n**步骤1：判断中级周期阶段**\n- 使用\"1.1 中级情绪周期\"的方法\n- 判断当前处于哪个阶段\n\n**步骤2：判断是否格局**\n- 如果处于第一阶段或第三阶段\n- 龙头可以多格局\n\n**步骤3：执行格局**\n- 不预测断板\n- 拿到首阴和反包\n\n**步骤4：记录格局**\n- 打开\"交易记录表\"\n- 记录是否格局（是/否）\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断中级周期阶段（记录：_________）\n- [ ] 步骤2完成：判断是否格局（记录：是/否）\n- [ ] 步骤3完成：执行格局\n- [ ] 步骤4完成：记录格局到交易记录表\n\n---\n\n### 5.2 切换条件\n\n#### 📊 切换条件\n\n1. **龙头高潮意味着次日开始分歧**\n   - 可以注意低位板块\n   - 做切换\n\n2. **板块全面发酵，板块内连板增多**\n   - 这个时候跟风都是卖点\n   - 可以切换低位新题材\n\n3. **有新的板块或题材成为新的主流**\n   - 这个属于板块挤压效应\n   - 在熊市中，资金有限，多线作战，必然导致资金分流，后继无力\n   - 可以切换到新主流\n\n#### 📝 查看方法\n\n**步骤1：判断是否需要切换**\n- 查看龙头是否高潮\n- 查看板块是否全面发酵\n- 查看是否有新的板块或题材成为新的主流\n- 判断是否需要切换\n\n**步骤2：执行切换**\n- 卖出老龙头\n- 买入新龙头\n\n**步骤3：记录切换**\n- 打开\"交易记录表\"\n- 记录是否切换（是/否）\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否需要切换（记录：是/否）\n- [ ] 步骤2完成：执行切换\n- [ ] 步骤3完成：记录切换到交易记录表\n\n---\n\n## 6. 卖出阶段：卖点判断与执行\n\n### 6.1 空间龙头卖点\n\n#### 📊 卖点条件\n\n1. **在赚钱效应回暖和赚钱效应高潮期一直拿住**\n2. **龙头确认断板**\n   - 卖出2/3\n3. **留1/3走完反包破5日线再卖**\n\n#### 📝 查看方法\n\n**步骤1：判断是否为空间龙头**\n- 查看个股是否为空间龙头\n- 判断是否为空间龙头\n\n**步骤2：判断是否卖出**\n- 如果龙头确认断板\n- 卖出2/3\n\n**步骤3：判断是否走完反包**\n- 如果反包破5日线\n- 卖出1/3\n\n**步骤4：记录卖出**\n- 打开\"交易记录表\"\n- 记录卖出日期、股票名称、卖点、仓位\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否为空间龙头（记录：是/否）\n- [ ] 步骤2完成：判断是否卖出（记录：是/否）\n- [ ] 步骤3完成：判断是否走完反包（记录：是/否）\n- [ ] 步骤4完成：记录卖出到交易记录表\n\n---\n\n### 6.2 分支套利卖点\n\n#### 📊 卖点条件\n\n**次日有利润就走**\n\n#### 📝 查看方法\n\n**步骤1：判断是否为分支套利**\n- 查看个股是否为分支套利\n- 判断是否为分支套利\n\n**步骤2：执行卖出**\n- 次日有利润就走\n\n**步骤3：记录卖出**\n- 打开\"交易记录表\"\n- 记录卖出日期、股票名称、卖点、仓位\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否为分支套利（记录：是/否）\n- [ ] 步骤2完成：执行卖出\n- [ ] 步骤3完成：记录卖出到交易记录表\n\n---\n\n### 6.3 分支龙头卖点\n\n#### 📊 卖点条件\n\n1. **当天炸板**\n2. **情绪超预期：对情绪次日判断分歧**\n   - 但最高或者次高依然是一字走加速\n   - 此时分支龙如果平开或者低开快速杀跌的话，是会吃到情绪溢价的，如果持仓，就不着急卖\n\n#### 📝 查看方法\n\n**步骤1：判断是否为分支龙头**\n- 查看个股是否为分支龙头\n- 判断是否为分支龙头\n\n**步骤2：判断是否卖出**\n- 如果当天炸板\n- 执行卖出\n\n**步骤3：判断情绪是否超预期**\n- 如果情绪超预期\n- 不着急卖\n\n**步骤4：记录卖出**\n- 打开\"交易记录表\"\n- 记录卖出日期、股票名称、卖点、仓位\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否为分支龙头（记录：是/否）\n- [ ] 步骤2完成：判断是否卖出（记录：是/否）\n- [ ] 步骤3完成：判断情绪是否超预期（记录：是/否）\n- [ ] 步骤4完成：记录卖出到交易记录表\n\n---\n\n## 7. 仓位管理：动态调整策略\n\n### 7.1 仓位管理规则\n\n#### 📊 仓位管理矩阵\n\n| 周期阶段 | 仓位上限 | 主攻方向 | 风险提示 |\n|----------|----------|----------|----------|\n| **中周期开启** | 100% | 空间龙+共振首板 | 警惕伪空间板（如一字顶板无换手） |\n| **中周期高潮** | 80% | 龙头格局+分支补涨 | 跟风股加速即卖点 |\n| **中周期主跌** | ≤10% | 可转债/次新首开 | 杜绝中位股接力 |\n\n#### 📝 查看方法\n\n**步骤1：判断中级周期阶段**\n- 使用\"1.1 中级情绪周期\"的方法\n- 判断当前处于哪个阶段\n\n**步骤2：确定仓位上限**\n- 根据\"仓位管理矩阵\"\n- 确定仓位上限\n\n**步骤3：执行仓位管理**\n- 根据仓位上限\n- 执行仓位管理\n\n**步骤4：记录仓位**\n- 打开\"交易记录表\"\n- 记录仓位上限、实际仓位\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断中级周期阶段（记录：_________）\n- [ ] 步骤2完成：确定仓位上限（记录：_____%）\n- [ ] 步骤3完成：执行仓位管理（记录：实际仓位_____%）\n- [ ] 步骤4完成：记录仓位到交易记录表\n\n---\n\n## 8. 风险控制：止损与防守\n\n### 8.1 止损规则\n\n#### 📊 止损条件\n\n1. **个股跌破关键支撑**\n   - 如5日线\n   - 立即离场\n\n2. **板块退潮**\n   - 跌停≥5家\n   - 立即离场\n\n3. **龙头断板**\n   - 卖出2/3\n   - 留1/3走完反包破5日线再卖\n\n4. **次日非弱转强**\n   - 低开无承接\n   - 立即离场\n\n#### 📝 查看方法\n\n**步骤1：判断是否止损**\n- 查看个股是否跌破关键支撑\n- 查看板块是否退潮\n- 查看龙头是否断板\n- 查看次日是否非弱转强\n- 判断是否止损\n\n**步骤2：执行止损**\n- 打开交易软件\n- 输入股票代码\n- 输入卖出价格和数量\n- 确认卖出\n\n**步骤3：记录止损**\n- 打开\"交易记录表\"\n- 记录止损日期、股票名称、止损条件、止损价格\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否止损（记录：是/否）\n- [ ] 步骤2完成：执行止损（记录：卖出价格_____元，数量_____股）\n- [ ] 步骤3完成：记录止损到交易记录表\n\n---\n\n### 8.2 空仓原则\n\n#### 📊 空仓条件\n\n1. **中级周期第四阶段（主跌）+ 短线混沌期**\n   - 强制空仓3日以上\n\n2. **双重叠加风险**\n   - 当短线周期的混沌阶段 + 中级周期的发酵/主跌阶段\n   - 立即空仓！\n\n3. **连板高度压至4板以下**\n   - 空仓\n\n4. **跌停家数＞20家**\n   - 空仓\n\n#### 📝 查看方法\n\n**步骤1：判断是否空仓**\n- 查看中级周期阶段\n- 查看短线情绪周期阶段\n- 查看连板高度\n- 查看跌停家数\n- 判断是否空仓\n\n**步骤2：执行空仓**\n- 卖出所有持仓\n- 空仓等待\n\n**步骤3：记录空仓**\n- 打开\"交易记录表\"\n- 记录空仓日期、空仓原因\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：判断是否空仓（记录：是/否）\n- [ ] 步骤2完成：执行空仓\n- [ ] 步骤3完成：记录空仓到交易记录表\n\n---\n\n## 9. 复盘体系：每日-每周-每月\n\n### 9.1 每日复盘流程\n\n#### 📊 复盘模板\n\n```\n日期：_____\n空间梯队：_____\n最高板：_____\n次高板：_____\n主线：_____\n主线龙头：_____\n分支：_____\n分支龙头：_____\n情绪周期：_____\n情绪指标：_____\n市场表现：_____\n明日预期：_____\n持有个股：_____\n交易计划：_____\n```\n\n#### 📝 查看方法\n\n**步骤1：填写复盘模板**\n- 打开\"复盘模板\"\n- 填写所有字段\n\n**步骤2：推演明日交易计划**\n- 根据复盘模板\n- 推演明日交易计划\n\n**步骤3：记录复盘**\n- 打开\"复盘日记.xlsx\"\n- 记录复盘内容\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：填写复盘模板\n- [ ] 步骤2完成：推演明日交易计划\n- [ ] 步骤3完成：记录复盘到复盘日记\n\n---\n\n### 9.2 每周复盘流程\n\n#### 📊 复盘内容\n\n1. **周期定位校验**\n   - 对比历史相似周期\n\n2. **账户回撤分析**\n   - 统计亏损交易中的周期误判比例\n\n3. **本周交易总结**\n   - 总结本周交易得失\n\n#### 📝 查看方法\n\n**步骤1：校验周期定位**\n- 对比历史相似周期\n- 校验周期定位\n\n**步骤2：分析账户回撤**\n- 统计亏损交易中的周期误判比例\n- 分析账户回撤\n\n**步骤3：总结本周交易**\n- 总结本周交易得失\n\n**步骤4：记录复盘**\n- 打开\"每周复盘.xlsx\"\n- 记录复盘内容\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：校验周期定位\n- [ ] 步骤2完成：分析账户回撤\n- [ ] 步骤3完成：总结本周交易\n- [ ] 步骤4完成：记录复盘到每周复盘\n\n---\n\n### 9.3 每月复盘流程\n\n#### 📊 复盘内容\n\n1. **月度交易总结**\n   - 总结月度交易得失\n\n2. **交易体系优化**\n   - 优化交易体系\n\n3. **下月交易计划**\n   - 制定下月交易计划\n\n#### 📝 查看方法\n\n**步骤1：总结月度交易**\n- 总结月度交易得失\n\n**步骤2：优化交易体系**\n- 优化交易体系\n\n**步骤3：制定下月交易计划**\n- 制定下月交易计划\n\n**步骤4：记录复盘**\n- 打开\"每月复盘.xlsx\"\n- 记录复盘内容\n\n#### ✅ 检查清单\n\n- [ ] 步骤1完成：总结月度交易\n- [ ] 步骤2完成：优化交易体系\n- [ ] 步骤3完成：制定下月交易计划\n- [ ] 步骤4完成：记录复盘到每月复盘\n\n---\n\n## 10. 心态管理：交易心理训练\n\n### 10.1 心态管理原则\n\n#### 📊 心态管理原则\n\n1. **赚钱的时候明白是市场行情给的**\n2. **亏钱：控制好仓位、模式内的操作可以接受、不能使操作变形**\n3. **积极的心态足以让你做成任何事情**\n4. **交易之道在人心，人心之道生情绪。掌控自己，才能不被市场掌控，否则会有踩不完的坑**\n\n#### 📝 训练方式\n\n1. **执行计划**\n   - 计划交易，交易计划\n   - 多做静态交易，按照计划执行\n\n2. **习惯空仓**\n   - 没有确定性的买点坚决空仓\n\n3. **没有踏空**\n   - 没有踏空之说，错过了等待下一次\n\n4. **积极暗示**\n   - 自我鼓励，每天积极暗示自己一定能行\n\n#### 📚 推荐书籍\n\n1. **《交易心理分析》**\n2. **《知行合一》**\n3. **《止损》**\n4. **《自控力》**\n5. **《认知觉醒：开启自我改变的原动力》**\n\n---\n\n## 11. 题材理解：大-中-小题材分类\n\n### 11.1 题材分类\n\n#### 📊 题材分类\n\n| 类型 | 细分 | 涨幅空间 | 持续时间 |\n|------|------|----------|----------|\n| **大题材** | 1. 政策类<br>2. 科技类<br>3. 基因类 | 以月为单位，翻倍起步，通常会有二波（如今年基建地产-浙江建投） | 2-6个月 |\n| **中题材** | 1. 炒冷饭<br>2. 衍生分支<br>3. 涨价 | 以周为单位，龙头涨幅空间大于50%，如基建分支地产，医药分支中药 | 2-4周 |\n| **小题材** |  | 以日为单位，通常是消息刺激，产品涨价等，涨幅空间在10-30%，如材料涨价，期货暴涨，突发消息等 | 1-3天 |\n\n---\n\n## 12. 交易模式：择时-选股-买卖\n\n### 12.1 择时\n\n#### 📊 择时规则\n\n1. **赚钱效应回暖：打空间板**\n2. **赚钱效应低迷：控制仓位**\n3. **赚钱效应高潮：持有龙头**\n4. **亏钱效应：空仓**\n\n---\n\n### 12.2 选股\n\n#### 📊 选股规则\n\n1. **空间龙头**\n2. **分支龙头**\n3. **反包龙头**\n\n---\n\n### 12.3 买卖操作\n\n#### 📊 买卖操作规则\n\n**核心思想：买在分歧转一致-弱转强，卖在一致转分歧-强转弱（反复阅读，必有收获）**\n\n---\n\n## 13. 龙行刺独家：情绪周期细节\n\n### 13.1 情绪周期细节\n\n#### 📊 情绪周期细节\n\n**中级情绪周期：**\n\n1. **开启**\n   - 表现：1. 指数连续下跌后企稳 2. 出现打破空间的连板\n   - 机会：1. 指数共振板（首日共振板或先于指数企稳共振板） 2. 分支龙头（情绪加速的空间补涨龙） 3. 核心个股的首阴低吸（题材趋势中军或者板块老龙）\n\n2. **发酵**\n   - 表现：1. 指数横盘震荡 2. 空间再次受到压制\n   - 机会：1. 补涨龙（一阶段的题材低位补涨首板二板） 2. 新题材卡位\n\n3. **高潮**\n   - 表现：1. 情绪与指数共振向上 2. 连板空间打开，并且数量增多\n   - 机会：1. 题材龙接力（这个阶段的题材龙级别越大越往上月共振，围绕核心做） 2. 辨识度低吸（分歧低吸或者中军低吸）\n\n4. **主跌**\n   - 表现：1. 情绪与指数共振下杀 2. 空间受到压制，连板数量减少\n   - 机会：1. 空仓（亏钱效应严重，空仓是最好的选择） 2. 轮动（高度受到压制，做首板或者二板的换手打板）\n\n**短线情绪周期：**\n\n1. **结束**\n   - 表现：主线龙头断板\n   - 机会：1. 中位接力补涨（2-3板接力） 2. 龙头首阴低吸（中级周期第一、三阶段）\n\n2. **混沌**\n   - 表现：龙头断板，题材四处开花，资金迷茫\n   - 机会：1. 中位接力补涨（2-3板接力） 2. 龙头反包低吸（中级周期第一、三阶段） 3. 低位试错（首板、二板接力）\n\n3. **确认**\n   - 表现：混沌后，主线题材卡位确认\n   - 机会：龙头接力\n\n4. **加速**\n   - 表现：主线加速，并出现连板跟风助攻\n   - 机会：1. 龙头接力 2. 跟风套利（龙头首次确认加速买不到的时候可以选择龙二套利） 3. 老龙反抽（同套利）\n\n5. **高潮**\n   - 表现：板块全面发酵，板块内连板增多，这个时候跟风往往是卖点\n   - 机会：1. 龙头格局（第一三周期的时候龙头可以多格局到首阴和反包） 2. 切换（龙头高潮意味着次日开始分歧，可这个时候注意低位板块）\n\n---\n\n## 14. 实战案例：经典周期复盘\n\n### 14.1 案例1：2022年4月-7月 基建地产周期（湖南发展-浙江建投）\n\n#### 📊 周期复盘\n\n1. **中级周期开启阶段**\n   - 指数连续下跌后企稳\n   - 湖南发展打出6板空间\n   - 操作：满仓干龙头（湖南发展）\n\n2. **中级周期高潮阶段**\n   - 浙江建投走二波\n   - 板块全面发酵\n   - 操作：龙头锁仓，等待反包\n\n3. **中级周期主跌阶段**\n   - 龙头断板\n   - 亏钱效应严重\n   - 操作：空仓管住手\n\n---\n\n### 14.2 案例2：2023年1月-2月 AI周期（汉王科技-鸿博股份）\n\n#### 📊 周期复盘\n\n1. **中级周期开启阶段**\n   - AI题材爆发\n   - 汉王科技打出7板空间\n   - 操作：满仓干龙头（汉王科技）\n\n2. **中级周期高潮阶段**\n   - 鸿博股份走补涨\n   - 板块全面发酵\n   - 操作：龙头锁仓，切换补涨龙（鸿博股份）\n\n3. **中级周期主跌阶段**\n   - 龙头断板\n   - 亏钱效应严重\n   - 操作：空仓管住手\n\n---\n\n## 15. 错题集与心得\n\n### 15.1 错题集\n\n1. **龙头首阴必反包 → 退潮期反包失败率＞80%**\n2. **冰点次日必反转 → 需确认情绪修复信号（如反核涨停）**\n3. **盲目格局 → 破5日线无条件止损**\n4. **杂毛补涨幻想 → 非龙头属性对标股淘汰率＞90%**\n\n---\n\n### 15.2 心得\n\n1. **计划交易，交易计划**\n2. **没有确定性的买点坚决空仓**\n3. **没有踏空之说，错过了等待下一次**\n4. **自我鼓励，每天积极暗示自己一定能行**\n5. **掌控自己，才能不被市场掌控**\n\n---\n\n## 16. 实战操作记录表\n\n### 16.1 每日实战操作记录表\n\n| 日期 | 情绪周期 | 指数气氛 | 主流板块 | 龙头个股 | 买点 | 仓位 | 卖点 | 盈利 | 备注 |\n|------|----------|----------|----------|----------|------|------|------|------|------|\n|      |          |          |          |          |      |      |      |      |      |\n\n---\n\n### 16.2 每周实战操作记录表\n\n| 周数 | 交易次数 | 盈利次数 | 亏损次数 | 胜率 | 总盈利 | 总亏损 | 净盈利 | 备注 |\n|------|----------|----------|----------|------|--------|--------|--------|------|\n|      |          |          |          |      |        |        |        |      |\n\n---\n\n### 16.3 每月实战操作记录表\n\n| 月份 | 交易次数 | 盈利次数 | 亏损次数 | 胜率 | 总盈利 | 总亏损 | 净盈利 | 备注 |\n|------|----------|----------|----------|------|--------|--------|--------|------|\n|      |          |          |          |      |        |        |        |      |\n\n---\n\n## 17. 总结\n\n**龙行刺情绪周期交易体系以\"周期定位-题材拆解-龙头狙击\"为轴，需结合每日复盘动态修正。建议从中级周期判断切入，例如当前若处于\"中级-P1（开启）\"，则优先试错共振题材首板；若处于\"中级-P4（主跌）\"，则专注可转债日内套利。最终通过100次以上周期轮回验证，形成肌肉记忆。**\n\n---\n\n**祝你交易顺利！📈**\n\n---\n\n**文档版本**：2025实战修订版\n**最后更新**：2026年6月15日\n**作者**：龙行刺\n**整合者**：AI助手（整合26位游资智慧+个人复盘理论）\n","isMindmap":false,"docType":"笔记"},{"id":"viz-15位游资深度研读报告_可视化","title":"15位游资深度研读报告","category":"keshihua","subcategory":null,"content":"","isMindmap":false,"docType":"可视化","isHtml":true,"htmlFile":"viz-15位游资深度研读报告_可视化.html"},{"id":"viz-26位游资深度研读报告_完整总结","title":"26位游资深度研读报告_完整总结","category":"keshihua","subcategory":null,"content":"","isMindmap":false,"docType":"可视化","isHtml":true,"htmlFile":"viz-26位游资深度研读报告_完整总结.html"},{"id":"viz-28位游资心法学习笔记_可视化","title":"28位游资心法学习笔记","category":"keshihua","subcategory":null,"content":"","isMindmap":false,"docType":"可视化","isHtml":true,"htmlFile":"viz-28位游资心法学习笔记_可视化.html"},{"id":"viz-【终极版】龙行刺情绪周期交易体系（可视化）","title":"【终极版】龙行刺情绪周期交易体系（可视化）","category":"keshihua","subcategory":null,"content":"","isMindmap":false,"docType":"可视化","isHtml":true,"htmlFile":"viz-【终极版】龙行刺情绪周期交易体系（可视化）.html"},{"id":"viz-交易体系_三位游资深度精华版_可视化","title":"我的交易体系 - 三位游资深度精华版","category":"keshi - 学习笔记\n\n> **学习说明**：本文档为92科比心法的详细学习笔记，共15章，包含核心要点、实战方法、案例分析、自我测评等内容。\n\n---\n\n## 第1章：92科比简介与成长历程\n\n### 1.1 个人背景\n- **身份**：新生代首板高手\n- **参赛成绩**：半年度实盘赛第三名\n  - 和前两名的差距微弱\n  - 再给两个交易日时间，就能反超\n- **交易特点**：模式不固定，灵活多变\n\n### 1.2 交易模式多样性\n**交割单分析发现**：\n- 低吸\n- 追涨\n- 打板\n- 做首板\n- 做1进2\n- 做龙头\n- 低吸科创\n- 低吸龙头\n- 早盘竞价买\n- 尾盘竞价买\n\n**各种模式买点都有**\n\n### 1.3 投资哲学\n> \"真正的悟道，绝对不是仅仅限制于某种手法的操作。这是一种初级盈利的玩家的阶段。那么如果要晋级，做到大道无形，买入即是赚钱的点。\"\n\n### 1.4 核心启示\n- 半年度实盘赛第三名\n- 模式不固定，灵活多变\n- 大道无形的境界\n- 买入即是赚钱的点\n\n---\n\n## 第2章：大道无形的交易理念\n\n### 2.1 悟道的三个阶段\n\n#### 第一阶段：初级盈利玩家\n- **特点**：限制于某种手法的操作\n- **表现**：只会一种或几种固定模式\n- **局限**：无法适应市场变化\n\n#### 第二阶段：大道无形\n- **特点**：买入即是赚钱的点\n- **表现**：不局限于某种手法\n- **境界**：各种模式都能熟练运用\n\n#### 第三阶段：稳定盈利\n- **特点**：收益曲线稳定三到六个月\n- **表现**：每个月没有大起大落\n- **境界**：长期坚持下来，越来越有把握\n\n### 2.2 大道无形的基础能力\n\n#### 核心能力一：情绪周期的理解\n- **短线情绪周期**：分为四个阶段\n  1. 低位震荡\n  2. 主升\n  3. 高位震荡\n  4. 主跌\n\n#### 核心能力二：题材预判能力\n- **定义**：你认为的这个故事能讲多大，能不能持续\n- **重要性**：影响着你做龙头的坚决程度\n- **培养方法**：\n  - 要有足够的信息渠道\n  - 大量无用信息去过滤\n  - 一步一步找到自己有用的去发现\n  - 去判断市场是否会发酵，是否有利润空间\n\n### 2.3 股票的本质理解\n\n#### 核心观点一：股票是筹码交换的游戏\n> \"股票就是筹码交换的游戏。所谓的逻辑和基本面，就是用了骗取更多接力筹码的吹票手段。\"\n\n**理解要点**：\n- 看透本质唯一做法：只能在接力的时候，一定要看这个故事是否有更多的人来接盘\n- 股票股票，本质就是讲故事，然后卖给信故事的人\n- 小资金讲小故事，大资金讲大故事\n- 有的周期短，有的周期长而已\n- 本质没有多大区别\n- 循环往复，恒古不变\n\n#### 核心观点二：短线最核心的东西是人气带来的流动性溢价\n> \"短线最核心的东西就是人气带来的流动性溢价，仅此而已。\"\n\n### 2.4 核心要点总结\n1. 悟道不是限制于某种手法\n2. 大道无形：买入即是赚钱的点\n3. 基础能力：情绪周期理解 + 题材预判能力\n4. 股票本质：筹码交换的游戏\n5. 短线核心：人气带来的流动性溢价\n\n---\n\n## 第3章：情绪周期四阶段理论\n\n### 3.1 四个阶段详解\n\n#### 第一阶段：低位震荡（试错期）\n- **特点**：接着前面一个主跌的亏钱阶段\n- **策略**：低位试错，要有一定的勇气\n- **时机**：一般龙头见顶杀高位的阶段，往往是最好的布局低位新题材的时机\n- **模式**：高低切模式\n\n**实战案例**：\n- 轴研科技：2板切入，吃了4个板\n- 宏润建设：3板隔夜顶的一字，也吃了4个板\n\n#### 第二阶段：主升阶段\n- **特点**：利润最丰厚的阶段\n- **操作**：看你介入的点，敢于大胆的在分歧的时候介入\n- **介入方式**：不在乎是打板，还是低吸的。看好，分歧，买入。\n\n**实战案例**：\n- 星期六\n- 省广集团\n- 王府井\n\n#### 第三阶段：高位震荡\n- **特点**：会有两个结果\n  1. 直接转亏钱效应，走主跌\n  2. 走二波（穿越）\n\n- **策略**：不建议博弈穿越，因为性价比着实是低\n- **操作**：一般高位震荡阶段，会选择轻仓去应对\n\n#### 第四阶段：主跌阶段\n- **特点**：第一天杀跌是很恐怖的\n- **策略**：\n  - 第二天的杀跌，如果还是持续的话，尾盘就可以找买点\n  - 第三天肯定会有情绪的修复\n\n### 3.2 周期循环\n**完整循环**：低位震荡 → 主升 → 高位震荡 → 主跌 → 低位震荡\n\n### 3.3 不同阶段的策略选择\n\n| 阶段 | 特点 | 策略 | 仓位 |\n|------|------|------|------|\n| **低位震荡** | 试错期 | 布局低位新题材 | 轻仓试错 |\n| **主升** | 利润最丰厚 | 大胆在分歧时介入 | 重仓 |\n| **高位震荡** | 可能穿越或主跌 | 轻仓应对 | 轻仓 |\n| **主跌** | 杀跌恐怖 | 第二天尾盘找买点 | 空仓或轻仓 |\n\n### 3.4 核心要点总结\n1. 情绪周期分为四个阶段\n2. 低位震荡是试错期，要有勇气\n3. 主升阶段大胆在分歧时介入\n4. 高位震荡不建议博弈穿越\n5. 主跌阶段第二天尾盘找买点\n6. 第三天肯定会有情绪修复\n\n---\n\n## 第4章：题材预判能力培养\n\n### 4.1 题材预判的重要性\n- **影响**：影响着你做龙头的坚决程度\n- **关键**：你认为的这个故事能讲多大，能不能持续\n- **基础**：买入之后，还能否持续\n\n### 4.2 认识过深 vs 认识过浅\n\n#### 认识过深\n- **表现**：容易套住不走\n- **结果**：最终亏损\n- **原因**：对题材理解过深，不肯止损\n\n#### 认识过浅\n- **表现**：非常容易错失龙头\n- **结果**：踏空\n- **原因**：对题材理解过浅，不敢介入\n\n#### 正确做法\n> \"对题材深度，可发掘程度的预期，是你对龙头介入，持有和卖出的基础。\"\n\n### 4.3 如何预判题材\n\n#### 第一步：信息渠道\n- 要有足够的信息渠道\n- 关注新闻\n- 找完新闻，找相关个股\n- 看该股各个方面综合筛选，盘子大小等等\n\n#### 第二步：过滤信息\n- 大量无用信息去过滤\n- 一步一步找到自己有用的去发现\n- 去判断市场是否会发酵\n- 是否有利润空间\n\n#### 第三步：判断发酵程度\n- 这个故事能讲多大？\n- 能不能持续？\n- 是否有更多的人来接盘？\n\n### 4.4 先于市场发现可发酵的舆论事件\n> \"先于市场发现可发酵的舆论事件，是一种高效的赚钱模式。\"\n\n**实战意义**：\n- 高效赚钱模式\n- 需要敏锐的新闻敏感度\n- 需要大量的信息过滤能力\n- 需要判断市场是否会发酵\n\n### 4.5 核心要点总结\n1. 题材预判影响做龙头的坚决程度\n2. 认识过深容易套住，认识过浅容易错失\n3. 预判题材需要三步：信息渠道 → 过滤信息 → 判断发酵程度\n4. 先于市场发现可发酵的舆论事件是高效率钱模式\n5. 对题材深度的预期是介入、持有和卖出的基础\n\n---\n\n## 第5章：首板战法技巧\n\n### 5.1 92科比的首板理念\n- **模式多样**：做首板，做1进2，做龙头，低吸科创，低吸龙头\n- **不打板**：现在打首板不好打，因为AI太强大了，抢筹码太快\n\n### 5.2 首板技巧\n\n#### 技巧一：对新闻要有敏感度\n- 要自己去关注\n- 找完新闻，找相关个股\n- 看该股各个方面综合筛选，盘子大小等等\n\n#### 技巧二：接力股关键看人气\n- 有没有人气\n- 人气会让他反包\n\n#### 技巧三：试错要积极\n- 再妖的股也是从首板开始\n- 试错要积极，再妖的股也是从首板开始\n\n### 5.3 首板的风险\n- **现在难打**：因为AI太强大了，抢筹码太快\n- **封不住**：然后就是首板封不住\n- **没有溢价**：慢慢的三板没溢价，二板没溢价\n\n### 5.4 首板的时机选择\n- **低位试错期**：一般龙头见顶杀高位的阶段，往往是最好的布局低位新题材的时机\n- **情绪修复期**：主跌阶段第二天尾盘可以找买点\n- **新题材爆发期**：先于市场发现可发酵的舆论事件\n\n### 5.5 核心要点总结\n1. 对新闻要有敏感度\n2. 接力股关键看人气\n3. 试错要积极\n4. 现在首板不好打，AI抢筹码太快\n5. 首板要从低位试错期、情绪修复期、新题材爆发期选择时机\n\n---\n\n## 第6章：龙头战法精髓\n\n### 6.1 92科比的龙头理念\n- **介入方式**：不在乎是打板，还是低吸的。看好，分歧，买入。\n- **持有基础**：对题材深度，可发掘程度的预期\n- **卖出时机**：取决于你的预期，每个人预期不一样\n\n### 6.2 做龙头的关键\n\n#### 关键一：脖子要硬\n> \"做龙头，是缩量板做还是放量板做都不重要，关键是要'脖子'硬。\"\n\n#### 关键二：市场都认为是龙头的时候，你就买就行了\n- 当市场都认为是龙头的时候，你就买就行了\n- 龙头的命硬\n\n#### 关键三：参与龙头需要体验\n- 需要参与龙头股，可以小仓位参与\n- 积累经验\n- 没有真实经验的积累，不行的\n- 把感觉记录下来，下一次自己就有感觉了\n\n### 6.3 龙头的持有与卖出\n\n#### 持有时机\n- 对题材深度，可发掘程度的预期\n- 你觉得这个题材的故事还能讲，要敢于大胆的在分歧的时候介入\n\n#### 卖出时机\n- 取决于你的预期，每个人预期不一样\n- 卖点就不一样\n\n**实战案例**：\n- 朗姿为什么拿那么久：主要是看别人文章看激动上头了，然后也没什么可做的票\n\n### 6.4 龙头的命硬\n- 龙头的命硬\n- 朗姿为什么拿那么久\n- 主要是看别人文章看激动上头了\n\n### 6.5 核心要点总结\n1. 做龙头关键是'脖子'硬\n2. 市场都认为是龙头的时候，你就买就行了\n3. 参与龙头需要体验，小仓位参与，积累经验\n4. 持有基础是对题材深度的预期\n5. 卖出时机取决于你的预期\n\n---\n\n## 第7章：补涨与切换战术\n\n### 7.1 短线世界观\n> \"短线世界观：龙头、补涨、切换（在里面不停的加东西去充沛它的内容）\"\n\n### 7.2 补涨战术\n\n#### 补涨时机\n- 什么时候做补涨\n- 高位做，低位做\n\n#### 补涨也是你要挖掘什么时候补涨的\n- 你要填满世界观\n- 过去经验中他各个炒作的节奏，是怎么走出来的\n- 你要去总结体会感悟\n- 填满世界观\n\n#### 补涨周期\n- 想买的人多了就是一字板了\n- 乾景园林就是补涨周期\n\n### 7.3 切换战术\n\n#### 切换分为两种\n1. **补涨**\n2. **其他题材**\n\n#### 切换的手法通常在市场分歧的时候做\n- 在其他主流题材出现亏钱效应的时候，做注册制次新股，合力会比较较强\n\n#### 切换的时机\n- 去复盘看每一次，切换的实际点\n- 比如仁东控股什么时候开始涨的\n- 你要去理解没有参与过得，要试着去理解他\n- 即使没有参与过，这样下一个龙头出来，你才能从上次龙头走出来的特点，从中感觉得出来这一次龙头\n\n### 7.4 要么做高，要么做低，中位股的风险较大\n> \"要么做高，要么做低，中位股的风险较大\"\n\n**实战意义**：\n- 中位股不容易成功\n- 做高位或低位\n- 要么做切换，要做新的题材要有新闻做配合\n- 同题材的中位股亏钱效应是很高的\n\n### 7.5 核心要点总结\n1. 短线世界观：龙头、补涨、切换\n2. 补涨时机：高位做，低位做\n3. 切换分为两种：补涨和其他题材\n4. 切换手法通常在市场分歧的时候做\n5. 要么做高，要么做低，中位股的风险较大\n\n---\n\n## 第8章：量价形态与记忆形成\n\n### 8.1 92科比的观点\n> \"量价，形态，是没有固定的标准的，这些东西是靠大量的记忆形成的。\"\n\n### 8.2 量价分析的核心\n\n#### 核心理解\n- 量价，形态，是没有固定的标准的\n- 这些东西是靠大量的记忆形成的\n- 需要大量的复盘和记忆\n\n#### 成交量分析\n- 放量上涨\n- 缩量下跌\n- 天量天价\n- 地量地价\n\n#### 价格形态分析\n- K线形态\n- 分时走势\n- 盘口语言\n\n### 8.3 记忆形成的重要性\n\n#### 为什么要大量记忆\n- 量价，形态，是没有固定的标准的\n- 这些东西是靠大量的记忆形成的\n- 需要大量的复盘和记忆\n\n#### 如何形成记忆\n- 把过去几年龙头股去复盘总结\n- 填满理解力\n- 去复盘看每一次，切换的实际点\n- 你要去理解没有参与过得，要试着去理解他\n\n### 8.4 核心要点总结\n1. 量价，形态，是没有固定的标准的\n2. 这些东西是靠大量的记忆形成的\n3. 需要大量的复盘和记忆\n4. 把过去几年龙头股去复盘总结\n5. 填满理解力\n\n---\n\n## 第9章：弱转强战法\n\n### 9.1 什么是弱转强\n> \"烂板一般第二天竞价会很低，但是开盘后买盘很凶，溢价预期很低的股票，第二天表现优异，就是弱转强\"\n\n### 9.2 弱转强的理想状态\n> \"弱转强最好不要体现在竞价上，最要是小低开或者平开后资金买盘 调整，不断在打脸中，修正自己，提高自己\"\n\n### 12.2 悟道的标准\n> \"你长期做股票，你发现收益曲线稳定了，三到六个月，关键在于稳定，做股票不要追捧梭哈一个票，如果赚了容易让自己狂妄，买别的票你也容易梭哈其他票，所以短线选手要明白赚钱是行情给与的，不要重仓去赌，很多人一输就没有赌的资本了，所以融资选手需要做到心态很好。\"\n\n### 12.3 不要梭哈\n> \"所以反对梭哈，梭哈大亏会让你心态崩了\"\n\n**原因**：\n- 如果赚了容易让自己狂妄\n- 买别的票你也容易梭哈其他票\n- 短线选手要明白赚钱是行情给与的\n- 不要重仓去赌\n- 很多人一输就没有赌的资本了\n- 梭哈大亏会让你心态崩了\n\n### 12.4 做短线需要天赋和理解力\n> \"做短线需要天赋和理解力的，做短线要做出来：首先模式是对的，天天换模式是不行的，要不断修正调整自己，做股票好的人总能够找到规律，善于总结\"\n\n### 12.5 核心要点总结\n1. 做短线就是不断自我否定，不断修正自己\n2. 悟道的标准是收益曲线稳定三到六个月\n3. 不要梭哈，梭哈大亏会让你心态崩了\n4. 做短线需要天赋和理解力\n5. 做股票好的人总能够找到规律，善于总结\n\n---\n\n## 第13章：实战案例分析\n\n### 13.1 案例一：轴研科技（高低切模式）\n- **操作**：2板切入\n- **收益**：吃了4个板\n- **模式**：高低切模式\n- **成功关键**：\n  - 低位试错\n  - 敢于在2板切入\n  - 题材预判准确\n\n### 13.2 案例二：宏润建设（高低切模式）\n- **操作**：3板隔夜顶的一字\n- **收益**：也吃了4个板\n- **模式**：高低切模式\n- **成功关键**：\n  - 敢于顶一字\n  - 题材预判准确\n  - 持有决心强\n\n### 13.3 案例三：星期六（主升阶段）\n- **操作**：主升阶段介入\n- **模式**：龙头战法\n- **成功关键**：\n  - 敢于大胆的在分歧的时候介入\n  - 对题材深度有预期\n  - 持有和卖出基于预期\n\n### 13.4 案例四：省广集团（主升阶段）\n- **操作**：主升阶段介入\n- **模式**：龙头战法\n- **成功关键**：\n  - 敢于大胆的在分歧的时候介入\n  - 对题材深度有预期\n\n### 13.5 案例五：王府井（主升阶段）\n- **操作**：主升阶段介入\n- **模式**：龙头战法\n- **成功关键**：\n  - 敢于大胆的在分歧的时候介入\n  - 对题材深度有预期\n\n### 13.6 核心要点总结\n1. 轴研科技：2板切入，吃了4个板\n2. 宏润建设：3板隔夜顶的一字，吃了4个板\n3. 星期六、省广集团、王府井：主升阶段介入\n4. 成功关键：敢于在分歧时介入，对题材深度有预期\n5. 模式：高低切模式、龙头战法\n\n---\n\n## 第14章：常见误区与纠正\n\n### 14.1 误区一：认为悟道就是限制于某种手法\n- **错误理解**：悟道就是限制于某种手法的操作\n- **正确理解**：\n  - 真正的悟道，绝对不是仅仅限制于某种手法的操作\n  - 这是一种初级盈利的玩家的阶段\n  - 如果要晋级，做到大道无形，买入即是赚钱的点\n\n### 14.2 误区二：量价，形态，有固定的标准\n- **错误理解**：量价，形态，有固定的标准\n- **正确理解**：\n  - 量价，形态，是没有固定的标准的\n  - 这些东西是靠大量的记忆形成的\n\n### 14.3 误区三：盲目追高\n- **错误表现**：不判断市场情绪，盲目追高\n- **正确做法**：\n  - 不可追太高\n  - 除非市场情绪很好，龙头可追\n\n### 14.4 误区四：对于已经淘汰的题材，反弹不走\n- **错误表现**：对于已经淘汰的题材，反弹不走，在里面干等\n- **正确做法**：\n  - 对于已经淘汰的题材做短线，反弹就赶紧走\n  - 一旦不及预期的走势就赶紧割肉\n  - 因为超短就是做隔日，一旦不达预期就是走人\n  - 在里面干等不是合理的，更不应该套里面三四天，必须要杀伐果断\n\n### 14.5 误区五：梭哈一个票\n- **错误表现**：全部重仓做一只票\n- **正确做法**：\n  - 小资金也要分仓，也不加杠杆\n  - 做股票是长期活动，不能把账户压在一只票上\n  - 反对梭哈，梭哈大亏会让你心态崩了\n\n### 14.6 核心要点总结\n1. 悟道不是限制于某种手法，而是大道无形\n2. 量价，形态，是没有固定的标准的，靠大量记忆形成\n3. 不可盲目追高\n4. 对于已经淘汰的题材，反弹就赶紧走\n5. 小资金也要分仓，也不加杠杆，反对梭哈\n\n---\n\n## 第15章：总结与行动计划\n\n### 15.1 92科比心法核心总结\n\n#### 成长历程\n- 新生代首板高手\n- 半年度实盘赛第三名\n- 模式不固定，灵活多变\n\n#### 核心交易理念\n1. 真正的悟道，绝对不是仅仅限制于某种手法的操作\n2. 大道无形：买入即是赚钱的点\n3. 基础能力：情绪周期理解 + 题材预判能力\n4. 股票本质：筹码交换的游戏\n5. 短线核心：人气带来的流动性溢价\n\n#### 情绪周期四阶段理论\n1. 低位震荡（试错期）\n2. 主升阶段（利润最丰厚）\n3. 高位震荡（可能穿越或主跌）\n4. 主跌阶段（第二天尾盘找买点）\n\n#### 短线世界观\n1. 龙头\n2. 补涨\n3. 切换\n\n#### 交易模式\n- 低吸\n- 追涨\n- 打板\n- 做首板\n- 做1进2\n- 做龙头\n- 低吸科创\n- 低吸龙头\n- 早盘竞价买\n- 尾盘竞价买\n\n### 15.2 给初学者的建议\n\n#### 第一阶段：打好基础（1-3个月）\n1. 理解情绪周期四阶段理论\n2. 学习基本的技术分析\n3. 培养新闻敏感度\n4. 小资金练手\n\n#### 第二阶段：形成模式（3-6个月）\n1. 找到适合自己的交易模式\n2. 确立选股标准\n3. 建立交易系统\n4. 不断复盘总结\n\n#### 第三阶段：稳定盈利（6-12个月）\n1. 严格执行交易系统\n2. 控制回撤\n3. 保持稳定心态\n4. 逐步形成自己的风格\n\n#### 第四阶段：大道无形（1年以上）\n1. 不局限于某种手法\n2. 买入即是赚钱的点\n3. 不断学优秀的游资\n4. 适应市场变化\n\n### 15.3 每日自我训练计划\n\n#### 盘前准备（30分钟）\n- [ ] 查看隔夜消息\n- [ ] 分析昨日涨停板\n- [ ] 预判今日热点\n- [ ] 制定操作计划\n\n#### 盘中观察（4小时）\n- [ ] 观察大盘走势\n- [ ] 捕捉热点题材\n- [ ] 跟踪龙头个股\n- [ ] 记录盘口语言\n\n#### 盘后复盘（1-2小时）\n- [ ] 总结今日操作\n- [ ] 分析成功与失败案例\n- [ ] 更新股票池\n- [ ] 制定明日计划\n\n#### 每周总结（周日2-3小时）\n- [ ] 回顾本周操作\n- [ ] 统计胜率、收益率\n- [ ] 分析存在的问题\n- [ ] 调整操作策略\n\n#### 每月提升（月末3-4小时）\n- [ ] 深度复盘本月操作\n- [ ] 学一位游资的心法\n- [ ] 优化交易系统\n- [ ] 设定下月目标\n\n### 15.4 核心要点总结\n1. 92科比心法核心是大道无形\n2. 初学者需要循序渐进\n3. 每日训练计划很重要\n4. 不断学、不断进化\n5. 最终形成自己的交易系统\n\n---\n\n## 附录：快速参考指南\n\n### A. 92科比心法速查表\n\n| 类别 | 核心内容 | 关键点 |\n|------|----------|--------|\n| **成长历程** | 新生代首板高手，半年度实盘赛第三名 | 模式不固定，灵活多变 |\n| **交易理念** | 大道无形，买入即是赚钱的点 | 不局限于某种手法 |\n| **情绪周期** | 四阶段：低位震荡、主升、高位震荡、主跌 | 不同阶段不同策略 |\n| **短线世界观** | 龙头、补涨、切换 | 要么做高，要么做低 |\n| **题材预判** | 先于市场发现可发酵的舆论事件 | 对题材深度的预期 |\n| **风险控制** | 小资金也要分仓，也不加杠杆 | 反对梭哈 |\n| **心态管理** | 做短线就是不断自我否定 | 不断修正自己 |\n| **股票本质** | 筹码交换的游戏 | 讲故事，卖给信故事的人 |\n\n### B. 每日操作检查清单\n\n#### 盘前检查\n- [ ] 隔夜消息是否重大？\n- [ ] 昨日涨停板质量如何？\n- [ ] 今日可能热点是什么？\n- [ ] 操作计划是否制定？\n\n#### 盘中检查\n- [ ] 大盘走势是否符合预期？\n- [ ] 热点题材是否持续？\n- [ ] 龙头个股表现如何？\n- [ ] 是否按计划操作？\n\n#### 盘后检查\n- [ ] 今日操作是否成功？\n- [ ] 成功/失败的原因是什么？\n- [ ] 明日计划是否制定？\n- [ ] 需要改进的地方是什么？\n\n### C. 常见错误与纠正\n\n| 常见错误 | 表现 | 纠正方法 |\n|----------|------|----------|\n| 局限于某种手法 | 只会一种或几种固定模式 | 做到大道无形，买入即是赚钱的点 |\n| 量价形态有固定标准 | 死记硬背固定形态 | 靠大量记忆形成，没有固定标准 |\n| 盲目追高 | 不看市场情绪就追高 | 除非市场情绪很好，龙头可追 |\n| 反弹不走 | 对于已经淘汰的题材，反弹不走 | 反弹就赶紧走，杀伐果断 |\n| 梭哈一个票 | 全部重仓做一只票 | 小资金也要分仓，反对梭哈 |\n\n### D. 进阶学资源\n\n#### 同类型游资心法\n1. **小鳄鱼**：超短线核心、二板战法\n2. **赵老哥**：连板战法、题材炒作本质\n3. **炒股养家**：情绪周期、洞悉市场\n4. **Asking**：等待机会、控制回撤\n\n#### 推荐学顺序\n1. 先学92科比（大道无形）\n2. 再学小鳄鱼（超短线核心）\n3. 然后学赵老哥（连板战法）\n4. 最后学炒股养家（情绪周期）\n\n#### 实践建议\n1. 小资金开始练\n2. 不断复盘总结\n3. 学优秀游资\n4. 形成自己的模式\n\n---\n\n**笔记完成时间**：2026年X月X日  \n**学进度**：第11/28位游资  \n**下次学**：瑞鹤仙（熊市出英雄）\n\n---\n\n**温馨提示**：\n1. 本笔记为详细学笔记，建议打印或保存到常用设备\n2. 重点内容建议反复阅读并实践验证\n3. 可以配合92科比的实际操作案例加深理解\n4. 建议每周复习一次，巩固记忆\n5. 实践是检验真理的唯一标准，多实战、多复盘、多总结\n","isMindmap":false,"docType":"笔记"},{"id":"youzi-92科比-mindmap","title":"思维导图","category":"youzi-xinfa","subcategory":"youzi-92科比","content":"【思维导图文件，请下载查看】","isMindmap":true,"docType":"思维导图"},{"id":"youzi-92科比-深度研读报告","title":"深度研读报告","category":"youzi-xinfa","subcategory":"youzi-92科比","content":"# 92科比心法_深度研读报告\n\n> **研读说明**：本文档为92科比心法的深度研读报告，共8章，提取核心要点、可执行细节规则，并与你的交易体系深度融合。\n\n---\n\n## 第1章：92科比心法核心思想深度解析\n\n### 1.1 大道无形的交易理念\n\n#### 核心观点\n> \"真正的悟道，绝对不是仅仅限制于某种手法的操作。这是一种初级盈利的玩家的阶段。那么如果要晋级，做到大道无形，买入即是赚钱的点。\"\n\n#### 深度解析\n\n**1. 悟道的三个阶段**\n\n**第一阶段：初级盈利玩家**\n- 特点：限制于某种手法的操作\n- 表现：只会一种或几种固定模式\n- 局限：无法适应市场变化\n\n**第二阶段：大道无形**\n- 特点：买入即是赚钱的点\n- 表现：不局限于某种手法\n- 境界：各种模式都能熟练运用\n\n**第三阶段：稳定盈利**\n- 特点：收益曲线稳定三到六个月\n- 表现：每个月没有大起大落\n- 境界：长期坚持下来，越来越有把握\n\n**2. 大道无形的基础能力**\n\n**核心能力一：情绪周期的理解**\n- 短线情绪周期：分为四个阶段\n  1. 低位震荡\n  2. 主升\n  3. 高位震荡\n  4. 主跌\n\n**核心能力二：题材预判能力**\n- 定义：你认为的这个故事能讲多大，能不能持续\n- 重要性：影响着你做龙头的坚决程度\n- 培养方法：\n  - 要有足够的信息渠道\n  - 大量无用信息去过滤\n  - 一步一步找到自己有用的去发现\n  - 去判断市场是否会发酵，是否有利润空间\n\n**3. 股票的本质理解**\n\n**核心观点一：股票是筹码交换的游戏**\n> \"股票就是筹码交换的游戏。所谓的逻辑和基本面，就是用了骗取更多接力筹码的吹票手段。\"\n\n**理解要点**：\n- 看透本质唯一做法：只能在接力的时候，一定要看这个故事是否有更多的人来接盘\n- 股票股票，本质就是讲故事，然后卖给信故事的人\n- 小资金讲小故事，大资金讲大故事\n- 有的周期短，有的周期长而已\n- 本质没有多大区别\n- 循环往复，恒古不变\n\n**核心观点二：短线最核心的东西是人气带来的流动性溢价**\n> \"短线最核心的东西就是人气带来的流动性溢价，仅此而已。\"\n\n#### 可执行细节规则\n\n**✅ 规则1：悟道三阶段自测表**\n```\n自测你的悟道阶段：\n[ ] 第一阶段：限制于某种手法的操作（初级盈利玩家）\n[ ] 第二阶段：买入即是赚钱的点（大道无形）\n[ ] 第三阶段：收益曲线稳定三到六个月（稳定盈利）\n```\n\n**✅ 规则2：大道无形能力检查清单**\n```\n你的基础能力是否具备：\n[ ] 情绪周期的理解：能否判断四个阶段？\n[ ] 题材预判能力：能否预判题材能否持续？\n[ ] 各种模式是否都能熟练运用？\n[ ] 买入即是赚钱的点？\n```\n\n**✅ 规则3：股票本质理解检查清单**\n```\n你是否理解股票本质：\n[ ] 股票是筹码交换的游戏？\n[ ] 逻辑和基本面是骗取更多接力筹码的吹票手段？\n[ ] 讲故事，然后卖给信故事的人？\n[ ] 短线最核心的东西就是人气带来的流动性溢价？\n```\n\n### 1.2 交易模式多样性\n\n#### 核心观点\n> \"各种模式买点都有\"\n\n#### 深度解析\n\n**1. 交割单分析发现**\n- 低吸\n- 追涨\n- 打板\n- 做首板\n- 做1进2\n- 做龙头\n- 低吸科创\n- 低吸龙头\n- 早盘竞价买\n- 尾盘竞价买\n\n**2. 各种模式买点都有**\n- 不局限于某种手法\n- 根据市场情况灵活选择\n- 大道无形的境界\n\n#### 可执行细节规则\n\n**✅ 规则4：交易模式多样性检查清单**\n```\n你的交易模式是否多样：\n[ ] 低吸\n[ ] 追涨\n[ ] 打板\n[ ] 做首板\n[ ] 做1进2\n[ ] 做龙头\n[ ] 低吸科创\n[ ] 低吸龙头\n[ ] 早盘竞价买\n[ ] 尾盘竞价买\n```\n\n### 1.3 核心要点总结\n\n1. 悟道不是限制于某种手法\n2. 大道无形：买入即是赚钱的点\n3. 基础能力：情绪周期理解 + 题材预判能力\n4. 股票本质：筹码交换的游戏\n5. 短线核心：人气带来的流动性溢价\n\n---\n\n## 第2章：情绪周期四阶段理论深度解析\n\n### 2.1 四个阶段详解\n\n#### 核心观点\n> \"短线情绪周期：分为四个阶段：低位震荡、主升、高位震荡、主跌\"\n\n#### 深度解析\n\n**1. 第一阶段：低位震荡（试错期）**\n\n**特点**：\n- 接着前面一个主跌的亏钱阶段\n- 低位试错\n- 要有一定的勇气\n\n**策略**：\n- 低位试错，要有一定的勇气\n- 一般龙头见顶杀高位的阶段，往往是最好的布局低位新题材的时机\n- 模式：高低切模式\n\n**实战案例**：\n- 轴研科技：2板切入，吃了4个板\n- 宏润建设：3板隔夜顶的一字，也吃了4个板\n\n**2. 第二阶段：主升阶段**\n\n**特点**：\n- 利润最丰厚的阶段\n- 敢于大胆的在分歧的时候介入\n\n**操作**：\n- 看你介入的点，敢于大胆的在分歧的时候介入\n- 不在乎是打板，还是低吸的。看好，分歧，买入。\n\n**实战案例**：\n- 星期六\n- 省广集团\n- 王府井\n\n**3. 第三阶段：高位震荡**\n\n**特点**：\n- 会有两个结果\n  1. 直接转亏钱效应，走主跌\n  2. 走二波（穿越）\n\n**策略**：\n- 不建议博弈穿越，因为性价比着实是低\n- 一般高位震荡阶段，会选择轻仓去应对\n\n**4. 第四阶段：主跌阶段**\n\n**特点**：\n- 第一天杀跌是很恐怖的\n\n**策略**：\n- 第二天的杀跌，如果还是持续的话，尾盘就可以找买点\n- 第三天肯定会有情绪的修复\n\n#### 可执行细节规则\n\n**✅ 规则5：情绪周期四阶段判断表**\n```\n判断当前市场处于哪个阶段：\n[ ] 低位震荡（试错期）：接着前面一个主跌的亏钱阶段\n[ ] 主升阶段（利润最丰厚）：敢于大胆的在分歧的时候介入\n[ ] 高位震荡（可能穿越或主跌）：不建议博弈穿越，轻仓应对\n[ ] 主跌阶段（第一天杀跌很恐怖）：第二天尾盘找买点，第三天肯定会有情绪的修复\n```\n\n**✅ 规则6：不同阶段策略选择表**\n```\n| 阶段 | 特点 | 策略 | 仓位 |\n|------|------|------|------|\n| **低位震荡** | 试错期 | 布局低位新题材 | 轻仓试错 |\n| **主升** | 利润最丰厚 | 大胆在分歧时介入 | 重仓 |\n| **高位震荡** | 可能穿越或主跌 | 轻仓应对 | 轻仓 |\n| **主跌** | 杀跌恐怖 | 第二天尾盘找买点 | 空仓或轻仓 |\n```\n\n### 2.2 周期循环\n\n#### 核心观点\n> \"完整循环：低位震荡 → 主升 → 高位震荡 → 主跌 → 低位震荡\"\n\n#### 深度解析\n\n**1. 周期循环**\n- 低位震荡 → 主升 → 高位震荡 → 主跌 → 低位震荡\n- 循环往复，恒古不变\n\n**2. 周期循环的应用**\n- 判断当前处于哪个阶段\n- 根据不同阶段选择不同策略\n- 不要在不同阶段用错策略\n\n#### 可执行细节规则\n\n**✅ 规则7：周期循环应用检查清单**\n```\n你是否应用周期循环：\n[ ] 判断当前处于哪个阶段？\n[ ] 根据不同阶段选择不同策略？\n[ ] 不在不同阶段用错策略？\n```\n\n### 2.3 不同阶段的策略选择\n\n#### 核心观点\n> \"低位震荡是试错期，要有勇气；主升阶段大胆在分歧时介入；高位震荡不建议博弈穿越；主跌阶段第二天尾盘找买点\"\n\n#### 深度解析\n\n**1. 低位震荡（试错期）**\n- 要有一定的勇气\n- 一般龙头见顶杀高位的阶段，往往是最好的布局低位新题材的时机\n- 模式：高低切模式\n\n**2. 主升阶段**\n- 利润最丰厚的阶段\n- 看你介入的点，敢于大胆的在分歧的时候介入\n- 不在乎是打板，还是低吸的。看好，分歧，买入。\n\n**3. 高位震荡**\n- 会有两个结果\n  1. 直接转亏钱效应，走主跌\n  2. 走二波（穿越）\n- 不建议博弈穿越，因为性价比着实是低\n- 一般高位震荡阶段，会选择轻仓去应对\n\n**4. 主跌阶段**\n- 第一天杀跌是很恐怖的\n- 第二天的杀跌，如果还是持续的话，尾盘就可以找买点\n- 第三天肯定会有情绪的修复\n\n#### 可执行细节规则\n\n**✅ 规则8：不同阶段策略执行表**\n```\n执行不同阶段的策略：\n[ ] 低位震荡：要有勇气，布局低位新题材\n[ ] 主升阶段：敢于大胆的在分歧的时候介入\n[ ] 高位震荡：不建议博弈穿越，轻仓应对\n[ ] 主跌阶段：第二天尾盘找买点\n```\n\n### 2.4 核心要点总结\n\n1. 情绪周期分为四个阶段\n2. 低位震荡是试错期，要有勇气\n3. 主升阶段大胆在分歧时介入\n4. 高位震荡不建议博弈穿越\n5. 主跌阶段第二天尾盘找买点\n6. 第三天肯定会有情绪修复\n\n---\n\n## 第3章：题材预判能力培养深度解析\n\n### 3.1 题材预判的重要性\n\n#### 核心观点\n> \"题材预判影响做龙头的坚决程度\"\n> \"你认为的这个故事能讲多大，能不能持续\"\n\n#### 深度解析\n\n**1. 题材预判的重要性**\n- 影响：影响着你做龙头的坚决程度\n- 关键：你认为的这个故事能讲多大，能不能持续\n- 基础：买入之后，还能否持续\n\n**2. 认识过深 vs 认识过浅**\n\n**认识过深**\n- 表现：容易套住不走\n- 结果：最终亏损\n- 原因：对题材理解过深，不肯止损\n\n**认识过浅**\n- 表现：非常容易错失龙头\n- 结果：踏空\n- 原因：对题材理解过浅，不敢介入\n\n**正确做法**\n> \"对题材深度，可发掘程度的预期，是你对龙头介入，持有和卖出的基础。\"\n\n#### 可执行细节规则\n\n**✅ 规则9：题材预判重要性检查清单**\n```\n你是否理解题材预判的重要性：\n[ ] 影响着你做龙头的坚决程度？\n[ ] 你认为的这个故事能讲多大，能不能持续？\n[ ] 买入之后，还能否持续？\n```\n\n**✅ 规则10：认识过深 vs 认识过浅自测表**\n```\n自测你的认识深度：\n[ ] 认识过深：容易套住不走，最终亏损\n[ ] 认识过浅：非常容易错失龙头，踏空\n[ ] 正确做法：对题材深度，可发掘程度的预期，是你对龙头介入，持有和卖出的基础\n```\n\n### 3.2 如何预判题材\n\n#### 核心观点\n> \"如何预判题材：信息渠道 → 过滤信息 → 判断发酵程度\"\n\n#### 深度解析\n\n**1. 第一步：信息渠道**\n- 要有足够的信息渠道\n- 关注新闻\n- 找完新闻，找相关个股\n- 看该股各个方面综合筛选，盘子大小等等\n\n**2. 第二步：过滤信息**\n- 大量无用信息去过滤\n- 一步一步找到自己有用的去发现\n- 去判断市场是否会发酵\n- 是否有利润空间\n\n**3 \n1. **情绪周期四阶段判断**（✅ 新增）\n   ```\n   [ ] 低位震荡（试错期）：接着前面一个主跌的亏钱阶段\n   [ ] 主升阶段（利润最丰厚）：敢于大胆的在分歧的时候介入\n   [ ] 高位震荡（可能穿越或主跌）：不建议博弈穿越，轻仓应对\n   [ ] 主跌阶段（第一天杀跌很恐怖）：第二天尾盘找买点，第三天肯定会有情绪的修复\n   ```\n\n2. **不同阶段策略选择**（✅ 新增）\n   ```\n   | 阶段 | 特点 | 策略 | 仓位 |\n   |------|------|------|------|\n   | **低位震荡** | 试错期 | 布局低位新题材 | 轻仓试错 |\n   | **主升** | 利润最丰厚 | 大胆在分歧时介入 | 重仓 |\n   | **高位震荡** | 可能穿越或主跌 | 轻仓应对 | 轻仓 |\n   | **主跌** | 杀跌恐怖 | 第二天尾盘找买点 | 空仓或轻仓 |\n   ```\n\n3. **首板时机选择**（✅ 新增）\n   ```\n   [ ] 低位试错期：一般龙头见顶杀高位的阶段，往往是最好的布局低位新题材的时机\n   [ ] 情绪修复期：主跌阶段第二天尾盘可以找买点\n   [ ] 新题材爆发期：先于市场发现可发酵的舆论事件\n   ```\n\n4. **龙头介入方式**（✅ 新增）\n   ```\n   [ ] 不在乎是打板，还是低吸的。看好，分歧，买入。\n   [ ] 做龙头关键是'脖子'硬\n   [ ] 市场都认为是龙头的时候，你就买就行了\n   [ ] 参与龙头需要体验，小仓位参与，积累经验\n   ```\n\n### 8.3 持有与卖出完善（融入92科比智慧）\n\n#### 原有体系（基于炒股养家、ASKING、职业炒手、小鳄鱼）\n1. **卖出时机决定获利度**\n2. **5日线上持有**\n3. **达到预期收益就卖**\n4. **不及预期就卖**\n5. **不参与任何性质整理**（✅ 来自小鳄鱼）\n6. **持股时间管理**（✅ 来自小鳄鱼）\n\n#### 融入92科比智慧后的完善体系\n\n**新增核心规则（来自92科比）**：\n\n1. **龙头持有基础**（✅ 新增）\n   ```\n   [ ] 对题材深度，可发掘程度的预期\n   [ ] 你觉得这个题材的故事还能讲，要敢于大胆的在分歧的时候介入\n   ```\n\n2. **龙头卖出时机**（✅ 新增）\n   ```\n   [ ] 取决于你的预期，每个人预期不一样\n   [ ] 卖点就不一样\n   ```\n\n3. **补涨与切换战术**（✅ 新增）\n   ```\n   [ ] 短线世界观：龙头、补涨、切换\n   [ ] 补涨时机：高位做，低位做\n   [ ] 切换分为两种：补涨和其他题材\n   [ ] 要么做高，要么做低，中位股的风险较大\n   ```\n\n### 8.4 仓位管理完善（融入92科比智慧）\n\n#### 原有体系（基于炒股养家、ASKING、职业炒手、小鳄鱼）\n1. **半仓买入，确认后加仓**\n2. **分仓操作，越涨越卖**\n3. **永远不要满仓**\n4. **根据大盘调整仓位**\n5. **不同市况仓位管理**（✅ 来自小鳄鱼）\n\n#### 融入92科比智慧后的完善体系\n\n**新增核心规则（来自92科比）**：\n\n1. **小资金也要分仓，也不加杠杆**（✅ 新增）\n   ```\n   [ ] 小资金也要分仓，也不加杠杆\n   [ ] 做股票是长期活动，不能把账户压在一只票上\n   [ ] 小资金做大需要稳定的成功率\n   [ ] 如果全部重仓做一只票，模式是不稳定的，容易大赚大亏\n   ```\n\n2. **分仓的原则**（✅ 新增）\n   ```\n   [ ] 不能把账户压在一只票上\n   [ ] 小资金做大需要稳定的成功率\n   [ ] 如果全部重仓做一只票，模式是不稳定的，容易大赚大亏\n   ```\n\n### 8.5 风险控制完善（融入92科比智慧）\n\n#### 原有体系（基于炒股养家、ASKING、职业炒手、小鳄鱼）\n1. **严格止损：-3%至-5%**\n2. **大盘破位清仓**\n3. **个股破5日线卖出**\n4. **连续止损3次，停止交易**\n5. **弱市操作要谨慎**（✅ 来自小鳄鱼）\n6. **管住自己的手**（✅ 来自小鳄鱼）\n\n#### 融入92科比智慧后的完善体系\n\n**新增核心规则（来自92科比）**：\n\n1. **对于已经淘汰的题材做短线反弹就赶紧走**（✅ 新增）\n   ```\n   [ ] 对于已经淘汰的题材做短线，反弹就赶紧走\n   [ ] 一旦不及预期的走势就赶紧割肉\n   [ ] 后面如果万一涨起来，你就不用去否认自己\n   [ ] 因为超短就是做隔日，一旦不达预期就是走人\n   [ ] 在里面干等不是合理的，更不应该套里面三四天，必须要杀伐果断\n   ```\n\n2. **做短线就是不断自我否定，不断修正自己**（✅ 新增）\n   ```\n   [ ] 做短线就是不断自我否定，不断修正自己的地方\n   [ ] 不要以一来股市把自己放在很高的位置\n   [ ] 做短线需要不断否定自己，不断不断的调整，不断在打脸中，修正自己，提高自己\n   ```\n\n### 8.6 心态管理完善（融入92科比智慧）\n\n#### 原有体系（基于炒股养家、ASKING、职业炒手、小鳄鱼）\n1. **心态占7分，技术占3分**\n2. **平和、冷静**\n3. **不要被情绪左右**\n4. **钢铁一样的神经**\n5. **买点的舒适感**（✅ 来自小鳄鱼）\n6. **心态管理**（✅ 来自小鳄鱼）\n\n#### 融入92科比智慧后的完善体系\n\n**新增核心规则（来自92科比）**：\n\n1. **做短线需要天赋和理解力**（✅ 新增）\n   ```\n   [ ] 做短线需要天赋和理解力的\n   [ ] 做短线要做出来：首先模式是对的，天天换模式是不行的\n   [ ] 要不断修正调整自己\n   [ ] 做股票好的人总能够找到规律，善于总结\n   ```\n\n2. **悟道的标准是收益曲线稳定三到六个月**（✅ 新增）\n   ```\n   [ ] 你长期做股票，你发现收益曲线稳定了，三到六个月\n   [ ] 关键在于稳定\n   [ ] 做股票不要追捧梭哈一个票\n   [ ] 如果赚了容易让自己狂妄，买别的票你也容易梭哈其他票\n   [ ] 所以短线选手要明白赚钱是行情给与的，不要重仓去赌\n   [ ] 很多人一输就没有赌的资本了\n   [ ] 所以融资选手需要做到心态很好\n   ```\n\n3. **不要梭哈**（✅ 新增）\n   ```\n   [ ] 所以反对梭哈，梭哈大亏会让你心态崩了\n   [ ] 如果赚了容易让自己狂妄\n   [ ] 买别的票你也容易梭哈其他票\n   [ ] 短线选手要明白赚钱是行情给与的\n   [ ] 不要重仓去赌\n   [ ] 很多人一输就没有赌的资本了\n   [ ] 梭哈大亏会让你心态崩了\n   ```\n\n### 8.7 核心要点总结\n\n1. 选股体系完善：新增大道无形检查、股票本质理解检查、题材预判能力检查、短线世界观检查、量价形态记忆检查\n2. 买入时机完善：新增情绪周期四阶段判断、不同阶段策略选择、首板时机选择、龙头介入方式\n3. 持有与卖出完善：新增龙头持有基础、龙头卖出时机、补涨与切换战术\n4. 仓位管理完善：新增小资金也要分仓也不加杠杆、分仓的原则\n5. 风险控制完善：新增对于已经淘汰的题材做短线反弹就赶紧走、做短线就是不断自我否定不断修正自己\n6. 心态管理完善：新增做短线需要天赋和理解力、悟道的标准是收益曲线稳定三到六个月、不要梭哈\n\n---\n\n## 附录：92科比心法速查表\n\n### A. 92科比心法核心要点\n\n| 类别 | 核心内容 | 关键点 |\n|------|----------|--------|\n| **成长历程** | 新生代首板高手，半年度实盘赛第三名 | 模式不固定，灵活多变 |\n| **交易理念** | 大道无形，买入即是赚钱的点 | 不局限于某种手法 |\n| **情绪周期** | 四阶段：低位震荡、主升、高位震荡、主跌 | 不同阶段不同策略 |\n| **短线世界观** | 龙头、补涨、切换 | 要么做高，要么做低 |\n| **题材预判** | 先于市场发现可发酵的舆论事件 | 对题材深度的预期 |\n| **风险控制** | 小资金也要分仓，也不加杠杆 | 反对梭哈 |\n| **心态管理** | 做短线就是不断自我否定 | 不断修正自己 |\n| **股票本质** | 筹码交换的游戏 | 讲故事，卖给信故事的人 |\n\n### B. 每日操作检查清单\n\n#### 盘前检查\n- [ ] 隔夜消息是否重大？\n- [ ] 昨日涨停板质量如何？\n- [ ] 今日可能热点是什么？\n- [ ] 操作计划是否制定？\n- [ ] 大道无形能力是否具备？\n- [ ] 情绪周期阶段是否判断？\n\n#### 盘中检查\n- [ ] 大盘走势是否符合预期？\n- [ ] 热点题材是否持续？\n- [ ] 龙头个股表现如何？\n- [ ] 是否按计划操作？\n- [ ] 是否在做龙头、补涨或切换？\n- [ ] 是否敢于在分歧时介入？\n\n#### 盘后检查\n- [ ] 今日操作是否成功？\n- [ ] 成功/失败的原因是什么？\n- [ ] 明日计划是否制定？\n- [ ] 需要改进的地方是什么？\n- [ ] 是否对于已经淘汰的题材做短线反弹就赶紧走？\n- [ ] 是否做短线就是不断自我否定，不断修正自己？\n\n---\n\n**报告完成时间**：2026年6月11日  \n**研读游资**：92科比（新生代四人组第二位）  \n**下次研读**：瑞鹤仙（熊市出英雄）  \n\n---\n\n**温馨提示**：\n1. 本报告中所有✅标记的规则，都是可以立即执行的细节规则\n2. 建议将本报告打印或保存到常用设备，随时查阅\n3. 重点是**执行**，而不是**知道**\n4. 从今天开始，严格执行这些规则\n5. 实践是检验真理的唯一标准，多实战、多复盘、多总结\n","isMindmap":false,"docType":"笔记"},{"id":"youzi-ASKING-学习笔记","title":"学习笔记","category":"youzi-xinfa","subcategory":"youzi-ASKING","content":"# ASKING（邱宝裕）心法 - A股之神\n\n> **核心宗旨**：只做超强势股的追涨和守株待兔。等待需要绝对的耐心，发现需要经验来确认，跟随则是最次要的买入动作了！\n\n---\n\n## 第1章：ASKING简介与成长历程\n\n### 1.1 个人背景\n- **真名**：邱宝裕\n- **网名**：ASKING（A股之神）\n- **出生年代**：1970年代\n- **籍贯**：福建福州\n- **入市时间**：1994年\n- **初始资金**：10几万（借的，一分半利息，他妈帮他借的）\n- **当前资金**：数亿级别（不可复制的传奇人物）\n\n### 1.2 资金增长历程\n- **1994年**：第一次入市，上证指数从1500点一直绵绵下跌\n- **1997年**：期货打暴，钱没了，只好再杀回股市\n- **1998年春节后**：第三次重返股市，借了10几万\n- **2003年下半年**：资金量达到一定的规模\n- **2004年**：资金从10几万到几千万，成交量从两三百万到7,8个亿\n- **至今**：资金量估计在数亿级别，成为A股市场的传奇人物\n\n### 1.3 操盘席位\n- **席位**：兴业证券股份有限公司福州湖东路证券营业部\n- **操作特点**：专做人气股、领涨股、龙头股\n\n### 1.4 成长关键词\n- **超短线**：从1998年到2006年7月23日，专注超短线\n- **龙头战法**：只做人气股、领涨股、龙头股\n- **守株待兔**：短线介入点，等待最强的那只股票出现\n- **仓位管理**：半仓操作，确认后加仓到全仓\n- **心态控制**：十分里边，心态、控制力占7分，技术占3分\n\n---\n\n## 第2章：核心交易理念\n\n### 2.1 对市场的理解力\n> **等待需要绝对的耐心，发现需要经验来确认，跟随则是最次要的买入动作了。**\n\n**深度解析**：\n- 交易是所有分析以后的结果，并不是盘口随意的追涨\n- 做人气股、领涨股时资金最安全，效率最高\n- 人气股不仅仅是热点，还是热点中的焦点\n- 一般的资金只是发现和跟随，宁波解放南路是发掘和引导，技术含量要高得多\n\n### 2.2 下决心付诸行动的决断力\n> **97年期货打暴以后，休息了几个月，钱没了，再去上班赚千把块钱也没这心情了。怎么办，以后路怎么走，想想只能再去炒股了。**\n\n**深度解析**：\n- 邱宝裕在1997年期货打暴，钱没了\n- 他妈很支持他，到处张罗，总算凑了10来万\n- 于是1998年春节后，他又杀回来了\n- 其实这是他第三次重返股市了，最早要从1994年说起\n\n### 2.3 核心操作观念\n> **只做超强势股的追涨和守株待兔（仓位管理必不可少，否则会做电梯）**\n\n**深度解析**：\n- 选股很重要，是决定性的前提，但选股还不是全部\n- 任何一种操作方法，哪怕是做下跌通道的一个小反抽，只要是不参与任何级别调整，买了就为了马上挣钱，这种方法都是短线\n- 说白了，不参与任何性质整理！\n- 所以，就我的看法，荣展做的只是超强势股，并非真正的龙头，我和职业炒手兄所找的才是龙头\n\n### 2.4 龙头战法\n> **龙头需要技术吗，不需要，要的是临阵时的果敢和勇气。如果你操作的一直都是市场各阶段最强的股票，那你自然就能做到龙头。**\n\n**深度解析**：\n- 我们赚大钱，全是符合这样的条件，而亏钱基本都是不符合而去强做\n- 我的追涨操作为什么都出现在大盘已大涨的情况下。原因很简单，我不能确认每一次大盘是否能继续向上，所以就挑最强的股票上\n- 大盘如果还向好，最强的股票就会再次大幅向上；大盘如果不行，则最强的股票通常还能横几天，可以果断退出\n\n---\n\n## 第3章：选股体系\n\n### 3.1 选股的原则\n**原则1：人气股、领涨股、龙头股**\n- 做人气股、领涨股时资金最安全，效率最高\n- 人气股不仅仅是热点，还是热点中的焦点\n\n**原则2：超强势股**\n- 只做超强势股的追涨和守株待兔\n- 选股很重要，是决定性的前提\n\n**原则3：与市场共振**\n- 龙头只所以安全，就在于与大盘转势共振\n- 市场也需要一只涨幅力度大的股票来树立赚钱效应\n\n**原则4：不做下跌通道**\n- 任何一种操作方法，哪怕是做下跌通道的一个小反抽\n- 只要是不参与任何级别调整，买了就为了马上挣钱，这种方法都是短线\n\n### 3.2 选股的方法\n**方法1：等待**\n- 需要绝对的耐心\n- 在一轮经典的下跌过后，市场面临转势，但我们不知道谁会先涨\n- 资金量大的操作必然会提前布局，而我们需要的就是睁大眼睛，等待最强的那只股票出现，然后闭着眼睛进入就可以了\n\n**方法2：发现**\n- 需要经验来确认\n- 龙头需要技术吗，不需要，要的是临阵时的果敢和勇气\n- 如果你操作的一直都是市场各阶段最强的股票，那你自然就能做到龙头\n\n**方法3：跟随**\n- 则是最次要的买入动作了\n- 交易是所有分析以后的结果，并不是盘口随意的追涨\n\n### 3.3 选股的注意事项\n**注意事项1：不要强做**\n- 我们赚大钱，全是符合这样的条件，而亏钱基本都是不符合而去强做\n\n**注意事项2：不要参与调整**\n- 说白了，不参与任何性质整理！\n- 任何一种操作方法，只要是参与了任何级别调整，买了不是为了马上挣钱，这种方法都不是短线\n\n**注意事项3：不要做超强势股**\n- 荣展做的只是超强势股，并非真正的龙头\n- 我和职业炒手兄所找的才是龙头\n\n---\n\n## 第4章：买入时机把握\n\n### 4.1 买入时机的选择\n**时机1：大盘转势初期**\n- 龙头只存在于大盘转势初期\n- 也就是说，2004年9月份以来只有600645叫龙头，其他的只叫超强势股\n\n**时机2：与大盘共振**\n- 龙头只所以安全，就在于与大盘转势共振\n- 市场也需要一只涨幅力度大的股票来树立赚钱效应\n\n**时机3：守株待兔**\n- 是我的一个短线介入点\n- 会理解的人知道在市场震荡期和上升期做这种技术赚钱也挺快的\n\n**时机4：二次脉冲**\n- 龙头过后的操作就是找强势股的二次脉冲（我称之为守株待兔）\n\n### 4.2 买入的方法\n**方法1：半仓买入**\n- 确认是追涨时，先进半仓\n- 当天涨停，次日继续加仓到全仓，让其利润最大化\n\n**方法2：全仓买入**\n- 当天涨停，次日继续加仓到全仓\n- 让其利润最大化\n\n**方法3：守株待兔买入**\n- 当天不能涨停，次日择高点先出等回调做守株待兔\n- 做守株待兔时，也是先半仓，获利后出局不加仓\n\n**方法4：龙头买入**\n- 龙头需要技术吗，不需要，要的是临阵时的果敢和勇气\n- 如果你操作的一直都是市场各阶段最强的股票，那你自然就能做到龙头\n\n### 4.3 买入的注意事项\n**注意事项1：不要追高**\n- 我的追涨操作为什么都出现在大盘已大涨的情况下\n- 原因很简单，我不能确认每一次大盘是否能继续向上，所以就挑最强的股票上\n\n**注意事项2：不要强做**\n- 我们赚大钱，全是符合这样的条件，而亏钱基本都是不符合而去强做\n\n**注意事项3：不要参与调整**\n- 说白了，不参与任何性质整理！\n- 任何一种操作方法，只要是参与了任何级别调整，买了不是为了马上挣钱，这种方法都不是短线\n\n---\n\n## 第5章：持有与卖出策略\n\n### 5.1 持有策略\n**策略1：半仓持有**\n- 确认是追涨时，先进半仓\n- 当天涨停，次日继续加仓到全仓\n\n**策略2：全仓持有**\n- 当天涨停，次日继续加仓到全仓\n- 让其利润最大化\n\n**策略3：守株待兔持有**\n- 做守株待兔时，也是先半仓，获利后出局不加仓\n- 失利后止损不加仓\n\n**策略4：龙头持有**\n-
